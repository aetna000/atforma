<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="1202" viewBox="-50 -90 2910 1202"><rect x="-50" y="-90" width="2910" height="1202" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Authenticated conversational assistant (AWS) · r2</tspan></text><path d="M290,536 C380,536 380,556 470,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,556 C800,556 800,631 890,631" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="410" width="210" height="26" fill="white"/><text x="800" y="428" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (PKCE)</tspan></text><path d="M710,556 C1010,556 1010,546 1310,546" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="410" width="210" height="26" fill="white"/><text x="1010" y="428" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">chat request + JWT</tspan></text><path d="M1130,631 C1220,631 1220,546 1310,546" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="410" width="210" height="26" fill="white"/><text x="1220" y="428" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT authorizer</tspan></text><path d="M1550,546 C1640,546 1640,636 1730,636" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="392" width="210" height="44" fill="white"/><text x="1640" y="410" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">invoke with verified subj</tspan><tspan x="1640" dy="18">ect</tspan></text><path d="M1970,636 C2060,636 2060,146 2150,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-28" width="210" height="44" fill="white"/><text x="2060" y="-10" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">read/write/delete own tur</tspan><tspan x="2060" dy="18">ns</tspan></text><path d="M1970,636 C2060,636 2060,426 2150,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="252" width="210" height="44" fill="white"/><text x="2060" y="270" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">Converse (bounded cont</tspan><tspan x="2060" dy="18">ext)</tspan></text><path d="M1970,636 C2060,636 2060,706 2150,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="392" width="210" height="44" fill="white"/><text x="2060" y="410" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">escalate approved conte</tspan><tspan x="2060" dy="18">xt</tspan></text><path d="M2390,706 C2480,706 2480,676 2570,676" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="550" width="210" height="26" fill="white"/><text x="2480" y="568" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">review escalation</tspan></text><path d="M1970,636 C2060,636 2060,976 2150,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="410" width="210" height="26" fill="white"/><text x="2060" y="428" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">metrics and errors</tspan></text><g><rect x="50" y="470" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Synthetic user (browser)</tspan><tspan x="66" dy="20">A synthetic test user in a browser</tspan><tspan x="66" dy="20">. This is a client reference and is </tspan><tspan x="66" dy="20">not provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="496" font-size="14"><tspan x="486" dy="0">Chat web app</tspan><tspan x="486" dy="20">Amazon CloudFront</tspan><tspan x="486" dy="20">Hosts the chat UI from private S3</tspan><tspan x="486" dy="20"> assets. Signs in with authorizatio</tspan><tspan x="486" dy="20">n code plus PKCE and calls the c</tspan><tspan x="486" dy="20">hat API with an access token.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="545" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="571" font-size="14"><tspan x="906" dy="0">User sign-in</tspan><tspan x="906" dy="20">Amazon Cognito</tspan><tspan x="906" dy="20">A user pool with admin-created s</tspan><tspan x="906" dy="20">ynthetic users and MFA. Issues J</tspan><tspan x="906" dy="20">WTs whose subject defines who </tspan><tspan x="906" dy="20">owns each conversation.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="470" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="496" font-size="14"><tspan x="1326" dy="0">Chat API</tspan><tspan x="1326" dy="20">Amazon API Gateway</tspan><tspan x="1326" dy="20">An HTTP API with a JWT authori</tspan><tspan x="1326" dy="20">zer, request size limits and throttli</tspan><tspan x="1326" dy="20">ng. It rejects anonymous calls.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="470" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="496" font-size="14"><tspan x="1746" dy="0">Chat orchestrator</tspan><tspan x="1746" dy="20">AWS Lambda</tspan><tspan x="1746" dy="20">Uses the JWT subject as the own</tspan><tspan x="1746" dy="20">er key and never trusts a user ID </tspan><tspan x="1746" dy="20">sent in the request. Builds a boun</tspan><tspan x="1746" dy="20">ded context window from recent t</tspan><tspan x="1746" dy="20">urns, enforces input and output li</tspan><tspan x="1746" dy="20">mits, and calls the model with retr</tspan><tspan x="1746" dy="20">ies and timeouts. If the model fail</tspan><tspan x="1746" dy="20">s, it returns a recoverable &apos;try aga</tspan><tspan x="1746" dy="20">in&apos; response without losing the st</tspan><tspan x="1746" dy="20">ored turn. It also handles convers</tspan><tspan x="1746" dy="20">ation delete and escalation, and </tspan><tspan x="1746" dy="20">owns its execution role and logs.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">Conversation store</tspan><tspan x="2166" dy="20">Amazon DynamoDB</tspan><tspan x="2166" dy="20">Partition key: owner subject. Sort</tspan><tspan x="2166" dy="20"> key: conversation and turn. Encr</tspan><tspan x="2166" dy="20">ypted at rest. Delete removes ev</tspan><tspan x="2166" dy="20">ery turn in the conversation. Opti</tspan><tspan x="2166" dy="20">onal TTL is still to be decided.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Foundation model</tspan><tspan x="2166" dy="20">Amazon Bedrock</tspan><tspan x="2166" dy="20">A direct foundation model throug</tspan><tspan x="2166" dy="20">h Converse. The model ID, acces</tspan><tspan x="2166" dy="20">s, region support and quotas are </tspan><tspan x="2166" dy="20">not yet verified. Local tests replac</tspan><tspan x="2166" dy="20">e it with scripted responses.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="636" font-size="14"><tspan x="2166" dy="0">Escalation queue</tspan><tspan x="2166" dy="20">Amazon SQS</tspan><tspan x="2166" dy="20">Receives an escalation record ho</tspan><tspan x="2166" dy="20">lding a snapshot of the user-appr</tspan><tspan x="2166" dy="20">oved conversation context. Encry</tspan><tspan x="2166" dy="20">pted, with a dead-letter queue for</tspan><tspan x="2166" dy="20"> failed handling.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="636" font-size="14"><tspan x="2586" dy="0">Human support reviewer</tspan><tspan x="2586" dy="20">A person who picks up escalation</tspan><tspan x="2586" dy="20">s. The tooling and access model </tspan><tspan x="2586" dy="20">are still to be decided.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="916" font-size="14"><tspan x="2166" dy="0">Logs and alarms</tspan><tspan x="2166" dy="20">Amazon CloudWatch</tspan><tspan x="2166" dy="20">Lambda and API metrics, a mode</tspan><tspan x="2166" dy="20">l-error alarm and an escalation D</tspan><tspan x="2166" dy="20">LQ alarm. Logs exclude messag</tspan><tspan x="2166" dy="20">e content.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>