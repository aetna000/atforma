<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1762" viewBox="-50 -90 1650 1762"><rect x="-50" y="-90" width="1650" height="1762" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">AWS log &amp; trace incident analysis · r2</tspan></text><path d="M290,556 C380,556 380,406 470,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="270" width="210" height="26" fill="white"/><text x="380" y="288" text-anchor="middle" font-size="12"><tspan x="380" dy="0">application logs</tspan></text><path d="M290,556 C800,556 800,976 1310,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="420" width="210" height="26" fill="white"/><text x="800" y="438" text-anchor="middle" font-size="12"><tspan x="800" dy="0">OTel trace segments</tspan></text><path d="M710,406 C800,406 800,406 890,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">subscription filter</tspan></text><path d="M1130,406 C1220,406 1220,136 1310,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-28" width="210" height="44" fill="white"/><text x="1220" y="-10" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">transform: redact + even</tspan><tspan x="1220" dy="18">t ID</tspan></text><path d="M1130,406 C1220,406 1220,396 1310,396" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted archive</tspan></text><path d="M1130,406 C1220,406 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">upsert by event ID</tspan></text><path d="M290,1226 C380,1226 380,1226 470,1226" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="1082" width="210" height="44" fill="white"/><text x="380" y="1100" text-anchor="middle" font-size="12"><tspan x="380" dy="0">SigV4 incident question /</tspan><tspan x="380" dy="18"> evidence-cited answer</tspan></text><path d="M710,1226 C800,1226 800,1296 890,1296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="1100" width="210" height="26" fill="white"/><text x="800" y="1118" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Lambda proxy invoke</tspan></text><path d="M1130,1296 C1220,1296 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="532" width="210" height="44" fill="white"/><text x="1220" y="550" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read logs by trace ID/tim</tspan><tspan x="1220" dy="18">e</tspan></text><path d="M1130,1296 C1220,1296 1220,976 1310,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="812" width="210" height="44" fill="white"/><text x="1220" y="830" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">BatchGetTraces (read-o</tspan><tspan x="1220" dy="18">nly)</tspan></text><path d="M1130,1296 C1220,1296 1220,1256 1310,1256" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="1100" width="210" height="26" fill="white"/><text x="1220" y="1118" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">guardrail applied to call</tspan></text><path d="M1130,1296 C1220,1296 1220,1536 1310,1536" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="1100" width="210" height="26" fill="white"/><text x="1220" y="1118" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Converse, no tools</tspan></text><g><rect x="50" y="480" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="506" font-size="14"><tspan x="66" dy="0">Synthetic services</tspan><tspan x="66" dy="20">Synthetic workload emitting logs </tspan><tspan x="66" dy="20">and OpenTelemetry traces (with </tspan><tspan x="66" dy="20">seeded secrets, injection text and</tspan><tspan x="66" dy="20"> missing spans for testing).</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Log collection</tspan><tspan x="486" dy="20">Amazon CloudWatch Logs</tspan><tspan x="486" dy="20">Receives service logs; a subscrip</tspan><tspan x="486" dy="20">tion filter forwards them to Fireho</tspan><tspan x="486" dy="20">se.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="916" font-size="14"><tspan x="1326" dy="0">Trace collection</tspan><tspan x="1326" dy="20">AWS X-Ray</tspan><tspan x="1326" dy="20">Stores distributed traces; the ana</tspan><tspan x="1326" dy="20">lysis runtime reads them by trace</tspan><tspan x="1326" dy="20"> ID and redacts span metadata b</tspan><tspan x="1326" dy="20">efore model input.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Log delivery</tspan><tspan x="906" dy="20">Amazon Data Firehose</tspan><tspan x="906" dy="20">Buffers logs, invokes the redactio</tspan><tspan x="906" dy="20">n transform, delivers to S3 and O</tspan><tspan x="906" dy="20">penSearch.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Secret redaction</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Firehose transform: pattern and e</tspan><tspan x="1326" dy="20">ntropy redaction of secrets; assig</tspan><tspan x="1326" dy="20">ns a deterministic event ID per lo</tspan><tspan x="1326" dy="20">g line.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Redacted archive</tspan><tspan x="1326" dy="20">Amazon S3</tspan><tspan x="1326" dy="20">Versioned archive of redacted log</tspan><tspan x="1326" dy="20">s, used to replay ingestion.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Log &amp; timeline search</tspan><tspan x="1326" dy="20">Amazon OpenSearch Service</tspan><tspan x="1326" dy="20">Indexes redacted logs using the </tspan><tspan x="1326" dy="20">event ID as the document ID, so </tspan><tspan x="1326" dy="20">re-ingestion updates records inst</tspan><tspan x="1326" dy="20">ead of duplicating them; searcha</tspan><tspan x="1326" dy="20">ble by trace ID and time.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="50" y="1160" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="1186" font-size="14"><tspan x="66" dy="0">Incident operator</tspan><tspan x="66" dy="20">Existing IAM-authenticated opera</tspan><tspan x="66" dy="20">tor; outside the provisioning scop</tspan><tspan x="66" dy="20">e.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="1160" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="1186" font-size="14"><tspan x="486" dy="0">Incident query API</tspan><tspan x="486" dy="20">Amazon API Gateway</tspan><tspan x="486" dy="20">HTTP API with IAM authorization</tspan><tspan x="486" dy="20">; no anonymous access.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1160" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1186" font-size="14"><tspan x="906" dy="0">Incident analysis runtime</tspan><tspan x="906" dy="20">AWS Lambda</tspan><tspan x="906" dy="20">Uses fixed read-only code paths t</tspan><tspan x="906" dy="20">o retrieve evidence (no model-iss</tspan><tspan x="906" dy="20">ued tool calls), redacts again, buil</tspan><tspan x="906" dy="20">ds a timeline and sends the evide</tspan><tspan x="906" dy="20">nce to the model, labelled as untr</tspan><tspan x="906" dy="20">usted data. Checks that every cit</tspan><tspan x="906" dy="20">ed trace/log ID exists, flags missi</tspan><tspan x="906" dy="20">ng spans as uncertainty, and retu</tspan><tspan x="906" dy="20">rns an answer with evidence IDs.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1170" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1196" font-size="14"><tspan x="1326" dy="0">Prompt safety filter</tspan><tspan x="1326" dy="20">Amazon Bedrock Guardrails</tspan><tspan x="1326" dy="20">Applied to the model call: detects</tspan><tspan x="1326" dy="20"> prompt attacks and sensitive info</tspan><tspan x="1326" dy="20">rmation (a second layer behind th</tspan><tspan x="1326" dy="20">e Lambda redaction).</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1450" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1476" font-size="14"><tspan x="1326" dy="0">Foundation model</tspan><tspan x="1326" dy="20">Amazon Bedrock</tspan><tspan x="1326" dy="20">Direct foundation model through t</tspan><tspan x="1326" dy="20">he Converse API, with tool config</tspan><tspan x="1326" dy="20">uration disabled. Model ID, acces</tspan><tspan x="1326" dy="20">s and region are still unverified.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>