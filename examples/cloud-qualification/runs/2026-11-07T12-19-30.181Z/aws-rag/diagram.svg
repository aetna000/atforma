<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="682" viewBox="-50 -90 2490 682"><rect x="-50" y="-90" width="2490" height="682" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic cited Q&amp;A qualification (AWS) · r2</tspan></text><path d="M290,256 C380,256 380,316 470,316" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,316 C800,316 800,221 890,221" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="55" width="210" height="26" fill="white"/><text x="800" y="73" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (PKCE + MFA)</tspan></text><path d="M1130,221 C1220,221 1220,286 1310,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="55" width="210" height="26" fill="white"/><text x="1220" y="73" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT authorizer</tspan></text><path d="M710,316 C1010,316 1010,286 1310,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="130" width="210" height="26" fill="white"/><text x="1010" y="148" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">question / cited answer</tspan></text><path d="M1550,286 C1640,286 1640,346 1730,346" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="130" width="210" height="26" fill="white"/><text x="1640" y="148" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">invoke</tspan></text><path d="M1970,346 C2060,346 2060,166 2150,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-28" width="210" height="44" fill="white"/><text x="2060" y="-10" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">permitted keyword looku</tspan><tspan x="2060" dy="18">p</tspan></text><path d="M1970,346 C2060,346 2060,436 2150,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="112" width="210" height="44" fill="white"/><text x="2060" y="130" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">Converse (permitted text</tspan><tspan x="2060" dy="18"> only)</tspan></text><g><rect x="50" y="190" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Signed-in user (browser)</tspan><tspan x="66" dy="20">A person using a browser. This is</tspan><tspan x="66" dy="20"> an external client reference, not </tspan><tspan x="66" dy="20">a provisioned service.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">Web app</tspan><tspan x="486" dy="20">Amazon CloudFront</tspan><tspan x="486" dy="20">Serves the web app from private </tspan><tspan x="486" dy="20">S3 assets that only CloudFront c</tspan><tspan x="486" dy="20">an read. Handles sign-in with aut</tspan><tspan x="486" dy="20">horization code + PKCE and call</tspan><tspan x="486" dy="20">s the API with an access token. S</tspan><tspan x="486" dy="20">hows cited answers, or an absten</tspan><tspan x="486" dy="20">tion when the sources don&apos;t supp</tspan><tspan x="486" dy="20">ort an answer.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="115" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="141" font-size="14"><tspan x="906" dy="0">User sign-in</tspan><tspan x="906" dy="20">Amazon Cognito</tspan><tspan x="906" dy="20">User pool with admin-created us</tspan><tspan x="906" dy="20">ers, required software-token MFA</tspan><tspan x="906" dy="20"> and an access-token scope. Eac</tspan><tspan x="906" dy="20">h user&apos;s identity and employee-re</tspan><tspan x="906" dy="20">gion mapping comes from the cat</tspan><tspan x="906" dy="20">alog.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="190" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="216" font-size="14"><tspan x="1326" dy="0">Authenticated RAG API</tspan><tspan x="1326" dy="20">Amazon API Gateway</tspan><tspan x="1326" dy="20">Bounded authenticated endpoint.</tspan><tspan x="1326" dy="20"> A JWT route serves the browser.</tspan><tspan x="1326" dy="20"> There is no anonymous access, </tspan><tspan x="1326" dy="20">and unknown identities fail close</tspan><tspan x="1326" dy="20">d.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="190" width="240" height="312" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="216" font-size="14"><tspan x="1746" dy="0">Retrieval &amp; answer function</tspan><tspan x="1746" dy="20">AWS Lambda</tspan><tspan x="1746" dy="20">Does keyword retrieval, filtering b</tspan><tspan x="1746" dy="20">y each document&apos;s access list an</tspan><tspan x="1746" dy="20">d region before anything reaches</tspan><tspan x="1746" dy="20"> the model. Re-checks revisions </tspan><tspan x="1746" dy="20">and authorization after generatio</tspan><tspan x="1746" dy="20">n, so an answer is suppressed if </tspan><tspan x="1746" dy="20">access was revoked. Returns the</tspan><tspan x="1746" dy="20"> answer with citations to current r</tspan><tspan x="1746" dy="20">evisions, or abstains. Owns its ex</tspan><tspan x="1746" dy="20">ecution role, logs, version and ali</tspan><tspan x="1746" dy="20">as.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="50" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">Document &amp; permissions catalog</tspan><tspan x="2166" dy="20">Amazon DynamoDB</tspan><tspan x="2166" dy="20">Holds up to 100 small synthetic U</tspan><tspan x="2166" dy="20">TF-8 documents with their revisio</tspan><tspan x="2166" dy="20">ns, explicit access lists and identi</tspan><tspan x="2166" dy="20">ty mappings. An operator ingests</tspan><tspan x="2166" dy="20">, updates and deletes documents</tspan><tspan x="2166" dy="20"> using the generated manageme</tspan><tspan x="2166" dy="20">nt tool. Callers can&apos;t write to it.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Foundation model</tspan><tspan x="2166" dy="20">Amazon Bedrock</tspan><tspan x="2166" dy="20">A direct foundation model called t</tspan><tspan x="2166" dy="20">hrough Converse. The model ID, </tspan><tspan x="2166" dy="20">region support, access and quota</tspan><tspan x="2166" dy="20">s are still to be selected and verifi</tspan><tspan x="2166" dy="20">ed. Local emulation uses scripted</tspan><tspan x="2166" dy="20"> responses only.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>