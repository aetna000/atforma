<svg xmlns="http://www.w3.org/2000/svg" width="3330" height="1322" viewBox="-50 -90 3330 1322"><rect x="-50" y="-90" width="3330" height="1322" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic sensor anomaly detection on AWS · r2</tspan></text><path d="M290,436 C380,436 380,436 470,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="270" width="210" height="26" fill="white"/><text x="380" y="288" text-anchor="middle" font-size="12"><tspan x="380" dy="0">MQTT/TLS telemetry</tspan></text><path d="M710,436 C800,436 800,426 890,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">IoT rule → PutRecord</tspan></text><path d="M1130,426 C1220,426 1220,456 1310,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">event source mapping</tspan></text><path d="M1550,456 C1640,456 1640,126 1730,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">lookup device/units</tspan></text><path d="M1550,456 C1640,456 1640,406 1730,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">rejected + reason</tspan></text><path d="M1550,456 C1640,456 1640,686 1730,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">valid events</tspan></text><path d="M1970,686 C2060,686 2060,746 2150,746" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="550" width="210" height="26" fill="white"/><text x="2060" y="568" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">event source mapping</tspan></text><path d="M2390,746 C2480,746 2480,296 2570,296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="130" width="210" height="26" fill="white"/><text x="2480" y="148" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">InvokeEndpoint</tspan></text><path d="M2390,746 C2480,746 2480,556 2570,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="410" width="210" height="26" fill="white"/><text x="2480" y="428" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">conditional write</tspan></text><path d="M2390,746 C2480,746 2480,826 2570,826" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="550" width="210" height="26" fill="white"/><text x="2480" y="568" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">publish anomaly</tspan></text><path d="M2810,826 C2900,826 2900,816 2990,816" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="690" width="210" height="26" fill="white"/><text x="2900" y="708" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">alert notification</tspan></text><path d="M2390,746 C2480,746 2480,1106 2570,1106" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="550" width="210" height="26" fill="white"/><text x="2480" y="568" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">metrics/logs</tspan></text><g><rect x="50" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Synthetic device simulator</tspan><tspan x="66" dy="20">External synthetic telemetry gene</tspan><tspan x="66" dy="20">rator outside the provisioning sco</tspan><tspan x="66" dy="20">pe. Emits {deviceId, eventId, time</tspan><tspan x="66" dy="20">stamp, metric, value, unit} over M</tspan><tspan x="66" dy="20">QTT/TLS with per-device X.509 c</tspan><tspan x="66" dy="20">ertificates, and buffers events loc</tspan><tspan x="66" dy="20">ally while disconnected.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Device ingestion</tspan><tspan x="486" dy="20">AWS IoT Core</tspan><tspan x="486" dy="20">Authenticates devices by certifica</tspan><tspan x="486" dy="20">te and routes telemetry through a</tspan><tspan x="486" dy="20">n IoT rule to Kinesis, unchanged.</tspan><tspan x="486" dy="20"> Preserves deviceId, timestamps </tspan><tspan x="486" dy="20">and units, and adds the ingest ti</tspan><tspan x="486" dy="20">me.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Raw telemetry buffer</tspan><tspan x="906" dy="20">Amazon Kinesis Data Streams</tspan><tspan x="906" dy="20">Durable, ordered buffer partitione</tspan><tspan x="906" dy="20">d by deviceId. Its retention windo</tspan><tspan x="906" dy="20">w supports replay after disconne</tspan><tspan x="906" dy="20">cts or failures; the retention perio</tspan><tspan x="906" dy="20">d is to be decided.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Event validator</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Uses a Kinesis event source map</tspan><tspan x="1326" dy="20">ping with partial batch failure rep</tspan><tspan x="1326" dy="20">orting. Rejects events from unkn</tspan><tspan x="1326" dy="20">own devices and events whose u</tspan><tspan x="1326" dy="20">nits are invalid for the registered </tspan><tspan x="1326" dy="20">metric, plus malformed timestam</tspan><tspan x="1326" dy="20">ps. Forwards valid events uncha</tspan><tspan x="1326" dy="20">nged.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Device registry</tspan><tspan x="1746" dy="20">Amazon DynamoDB</tspan><tspan x="1746" dy="20">The authoritative list of known de</tspan><tspan x="1746" dy="20">vices, with the allowed metrics an</tspan><tspan x="1746" dy="20">d units for each.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Rejected events</tspan><tspan x="1746" dy="20">Amazon SQS</tspan><tspan x="1746" dy="20">Holds rejected events with a reje</tspan><tspan x="1746" dy="20">ction reason for operator inspecti</tspan><tspan x="1746" dy="20">on; nothing is silently dropped.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Validated telemetry</tspan><tspan x="1746" dy="20">Amazon Kinesis Data Streams</tspan><tspan x="1746" dy="20">Validated events, partitioned by d</tspan><tspan x="1746" dy="20">eviceId so each device&apos;s events s</tspan><tspan x="1746" dy="20">tay in order for scoring.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="610" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="636" font-size="14"><tspan x="2166" dy="0">Anomaly scorer</tspan><tspan x="2166" dy="20">AWS Lambda</tspan><tspan x="2166" dy="20">Deduplicates on deviceId+eventI</tspan><tspan x="2166" dy="20">d with a conditional write, so dupl</tspan><tspan x="2166" dy="20">icates produce one result. Applie</tspan><tspan x="2166" dy="20">s the explicit late/out-of-order poli</tspan><tspan x="2166" dy="20">cy (window to be decided) and in</tspan><tspan x="2166" dy="20">vokes the model endpoint. The re</tspan><tspan x="2166" dy="20">sponse it writes includes the ano</tspan><tspan x="2166" dy="20">maly score, evidence features an</tspan><tspan x="2166" dy="20">d the model version.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="190" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="216" font-size="14"><tspan x="2586" dy="0">Anomaly model endpoint</tspan><tspan x="2586" dy="20">Amazon SageMaker AI</tspan><tspan x="2586" dy="20">Hosted anomaly model that retur</tspan><tspan x="2586" dy="20">ns a score and the model version</tspan><tspan x="2586" dy="20">. Supervised vs unsupervised is </tspan><tspan x="2586" dy="20">undecided. Local tests use a scri</tspan><tspan x="2586" dy="20">pted mock, which proves nothing </tspan><tspan x="2586" dy="20">about detection quality.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="496" font-size="14"><tspan x="2586" dy="0">Anomaly results</tspan><tspan x="2586" dy="20">Amazon DynamoDB</tspan><tspan x="2586" dy="20">One result per deviceId+eventId: </tspan><tspan x="2586" dy="20">original timestamp and unit, scor</tspan><tspan x="2586" dy="20">e, evidence, model version and l</tspan><tspan x="2586" dy="20">ate-event flag.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="750" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="776" font-size="14"><tspan x="2586" dy="0">Operator alert</tspan><tspan x="2586" dy="20">Amazon SNS</tspan><tspan x="2586" dy="20">Publishes one alert per anomalo</tspan><tspan x="2586" dy="20">us result, including the device, ti</tspan><tspan x="2586" dy="20">me, evidence and model version.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="750" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="776" font-size="14"><tspan x="3006" dy="0">Operator</tspan><tspan x="3006" dy="20">The person who receives and tria</tspan><tspan x="3006" dy="20">ges anomaly alerts; outside the p</tspan><tspan x="3006" dy="20">rovisioning scope.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="1030" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="1056" font-size="14"><tspan x="2586" dy="0">Pipeline monitoring</tspan><tspan x="2586" dy="20">Amazon CloudWatch</tspan><tspan x="2586" dy="20">Tracks iterator age, rejection rate</tspan><tspan x="2586" dy="20">, scorer errors and alert volume t</tspan><tspan x="2586" dy="20">o detect backlog and failures.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>