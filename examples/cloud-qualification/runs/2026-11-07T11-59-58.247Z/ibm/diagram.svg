<svg xmlns="http://www.w3.org/2000/svg" width="810" height="462" viewBox="-50 -90 810 462"><rect x="-50" y="-90" width="810" height="462" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Private object storage on IBM Cloud for synthetic documents · r2</tspan></text><path d="M290,136 C380,136 380,186 470,186" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-28" width="210" height="44" fill="white"/><text x="380" y="-10" text-anchor="middle" font-size="12"><tspan x="380" dy="0">Upload / read / delete ob</tspan><tspan x="380" dy="18">jects (scoped IAM)</tspan></text><g><rect x="50" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Existing service identity</tspan><tspan x="66" dy="20">An existing IBM Cloud IAM servic</tspan><tspan x="66" dy="20">e ID that sits outside the provisio</tspan><tspan x="66" dy="20">ning scope. Its identifier is suppli</tspan><tspan x="66" dy="20">ed as a required input. It is not cr</tspan><tspan x="66" dy="20">eated or modified here.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Synthetic document bucket</tspan><tspan x="486" dy="20">IBM Cloud Object Storage</tspan><tspan x="486" dy="20">A private bucket in an existing C</tspan><tspan x="486" dy="20">OS instance with object versionin</tspan><tspan x="486" dy="20">g on, anonymous and public acc</tspan><tspan x="486" dy="20">ess blocked, and IBM-managed </tspan><tspan x="486" dy="20">encryption. It holds synthetic doc</tspan><tspan x="486" dy="20">uments only. Candidate region a</tspan><tspan x="486" dy="20">u-syd has not been verified. The </tspan><tspan x="486" dy="20">COS instance ID is a required inp</tspan><tspan x="486" dy="20">ut.</tspan><tspan x="486" dy="20">au-syd (candidate)</tspan></text></g></g></svg>