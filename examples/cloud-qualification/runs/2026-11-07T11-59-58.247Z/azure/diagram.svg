<svg xmlns="http://www.w3.org/2000/svg" width="810" height="502" viewBox="-50 -90 810 502"><rect x="-50" y="-90" width="810" height="502" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Private object storage on Azure for synthetic documents · r2</tspan></text><path d="M290,146 C380,146 380,206 470,206" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-28" width="210" height="44" fill="white"/><text x="380" y="-10" text-anchor="middle" font-size="12"><tspan x="380" dy="0">upload / read / delete obj</tspan><tspan x="380" dy="18">ects (scoped role)</tspan></text><g><rect x="50" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Existing service identity</tspan><tspan x="66" dy="20">Existing service identity outside t</tspan><tspan x="66" dy="20">he provisioning scope. Its princip</tspan><tspan x="66" dy="20">al ID is supplied separately as a r</tspan><tspan x="66" dy="20">equired input. It is not created or </tspan><tspan x="66" dy="20">changed here, and it has not bee</tspan><tspan x="66" dy="20">n verified.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="312" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Private document storage</tspan><tspan x="486" dy="20">Azure Blob Storage</tspan><tspan x="486" dy="20">Azure Storage account with a pri</tspan><tspan x="486" dy="20">vate container for synthetic docu</tspan><tspan x="486" dy="20">ments, deployed into an existing </tspan><tspan x="486" dy="20">resource group supplied as input.</tspan><tspan x="486" dy="20"> Anonymous/public blob access i</tspan><tspan x="486" dy="20">s disabled, blob versioning is ena</tspan><tspan x="486" dy="20">bled and encryption at rest uses </tspan><tspan x="486" dy="20">Microsoft-managed keys. There i</tspan><tspan x="486" dy="20">s no compute and no private end</tspan><tspan x="486" dy="20">point. Regional support for austra</tspan><tspan x="486" dy="20">liaeast is assumed, not verified.</tspan><tspan x="486" dy="20">australiaeast (candidate)</tspan></text></g></g></svg>