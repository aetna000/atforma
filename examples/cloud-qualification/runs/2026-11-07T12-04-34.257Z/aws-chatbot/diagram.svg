<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="1182" viewBox="-50 -90 2910 1182"><rect x="-50" y="-90" width="2910" height="1182" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Authenticated conversational assistant (AWS) · r2</tspan></text><path d="M290,526 C380,526 380,566 470,566" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,566 C800,566 800,481 890,481" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="335" width="210" height="26" fill="white"/><text x="800" y="353" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (PKCE)</tspan></text><path d="M1130,481 C1220,481 1220,546 1310,546" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="335" width="210" height="26" fill="white"/><text x="1220" y="353" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT validation</tspan></text><path d="M710,566 C1010,566 1010,546 1310,546" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="392" width="210" height="44" fill="white"/><text x="1010" y="410" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">chat message + token / r</tspan><tspan x="1010" dy="18">eply</tspan></text><path d="M1550,546 C1640,546 1640,616 1730,616" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="410" width="210" height="26" fill="white"/><text x="1640" y="428" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">invoke</tspan></text><path d="M1970,616 C2060,616 2060,146 2150,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-10" width="210" height="26" fill="white"/><text x="2060" y="8" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">read/write user turns</tspan></text><path d="M1970,616 C2060,616 2060,426 2150,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="252" width="210" height="44" fill="white"/><text x="2060" y="270" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">Converse (limited contex</tspan><tspan x="2060" dy="18">t)</tspan></text><path d="M1970,616 C2060,616 2060,706 2150,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="410" width="210" height="26" fill="white"/><text x="2060" y="428" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">send escalation</tspan></text><path d="M2390,706 C2480,706 2480,676 2570,676" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="550" width="210" height="26" fill="white"/><text x="2480" y="568" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">review handoff</tspan></text><path d="M1970,616 C2060,616 2060,966 2150,966" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="410" width="210" height="26" fill="white"/><text x="2060" y="428" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">logs/metrics</tspan></text><g><rect x="50" y="470" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Synthetic user (browser)</tspan><tspan x="66" dy="20">Test user&apos;s browser. A client refer</tspan><tspan x="66" dy="20">ence, not a provisioned service.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="470" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="496" font-size="14"><tspan x="486" dy="0">Chat web app</tspan><tspan x="486" dy="20">Amazon CloudFront</tspan><tspan x="486" dy="20">Serves the chat interface from pri</tspan><tspan x="486" dy="20">vate S3 assets that CloudFront o</tspan><tspan x="486" dy="20">wns. Signs users in with authoriz</tspan><tspan x="486" dy="20">ation code + PKCE and sends th</tspan><tspan x="486" dy="20">eir token with each chat request.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="395" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="421" font-size="14"><tspan x="906" dy="0">User sign-in</tspan><tspan x="906" dy="20">Amazon Cognito</tspan><tspan x="906" dy="20">User pool for synthetic users cre</tspan><tspan x="906" dy="20">ated by an admin. MFA is propos</tspan><tspan x="906" dy="20">ed. Issues the JWTs that the API </tspan><tspan x="906" dy="20">checks.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="470" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="496" font-size="14"><tspan x="1326" dy="0">Chat API</tspan><tspan x="1326" dy="20">Amazon API Gateway</tspan><tspan x="1326" dy="20">HTTP API with a JWT authorizer.</tspan><tspan x="1326" dy="20"> Rejects requests without a valid </tspan><tspan x="1326" dy="20">token and applies throttling.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="470" width="240" height="292" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="496" font-size="14"><tspan x="1746" dy="0">Chat orchestrator</tspan><tspan x="1746" dy="20">AWS Lambda</tspan><tspan x="1746" dy="20">Takes the user ID from the verifie</tspan><tspan x="1746" dy="20">d token, loads that user&apos;s conver</tspan><tspan x="1746" dy="20">sation, trims context to a limited </tspan><tspan x="1746" dy="20">window (the last N turns or a toke</tspan><tspan x="1746" dy="20">n budget), calls the model, saves</tspan><tspan x="1746" dy="20"> the turn and returns the reply. D</tspan><tspan x="1746" dy="20">ecides when to escalate. Has no </tspan><tspan x="1746" dy="20">tools or external actions. Owns it</tspan><tspan x="1746" dy="20">s execution role, logs, version an</tspan><tspan x="1746" dy="20">d alias.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">Conversation state</tspan><tspan x="2166" dy="20">Amazon DynamoDB</tspan><tspan x="2166" dy="20">Partitioned by user ID and keyed </tspan><tspan x="2166" dy="20">by conversation and turn. A TTL r</tspan><tspan x="2166" dy="20">emoves old conversations. Acces</tspan><tspan x="2166" dy="20">s is scoped to the calling user&apos;s p</tspan><tspan x="2166" dy="20">artition.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Model runtime</tspan><tspan x="2166" dy="20">Amazon Bedrock</tspan><tspan x="2166" dy="20">A direct foundation model is calle</tspan><tspan x="2166" dy="20">d through the Converse API. The</tspan><tspan x="2166" dy="20"> model ID, access, quotas and re</tspan><tspan x="2166" dy="20">gion availability are not yet verifie</tspan><tspan x="2166" dy="20">d.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="636" font-size="14"><tspan x="2166" dy="0">Escalation queue</tspan><tspan x="2166" dy="20">Amazon SQS</tspan><tspan x="2166" dy="20">Holds escalated conversations, w</tspan><tspan x="2166" dy="20">ith their reason and a conversatio</tspan><tspan x="2166" dy="20">n reference, for human review. A </tspan><tspan x="2166" dy="20">dead-letter queue and alarm are </tspan><tspan x="2166" dy="20">still to be designed.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="636" font-size="14"><tspan x="2586" dy="0">Support reviewer</tspan><tspan x="2586" dy="20">The person who picks up escalati</tspan><tspan x="2586" dy="20">ons. How they work (queue cons</tspan><tspan x="2586" dy="20">ole or ticketing tool) is still open.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="890" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="916" font-size="14"><tspan x="2166" dy="0">Logs &amp; metrics</tspan><tspan x="2166" dy="20">Amazon CloudWatch</tspan><tspan x="2166" dy="20">Logs, latency, error and escalatio</tspan><tspan x="2166" dy="20">n metrics for the API and Lambd</tspan><tspan x="2166" dy="20">a. Retention is to be agreed.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>