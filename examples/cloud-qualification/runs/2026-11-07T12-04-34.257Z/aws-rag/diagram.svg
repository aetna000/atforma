<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="682" viewBox="-50 -90 2490 682"><rect x="-50" y="-90" width="2490" height="682" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic RAG qualification on AWS · r2</tspan></text><path d="M290,246 C380,246 380,306 470,306" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,306 C800,306 800,391 890,391" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (PKCE + MFA)</tspan></text><path d="M710,306 C1010,306 1010,276 1310,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="112" width="210" height="44" fill="white"/><text x="1010" y="130" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">question + token / cited </tspan><tspan x="1010" dy="18">answer</tspan></text><path d="M1130,391 C1220,391 1220,276 1310,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT authorizer</tspan></text><path d="M1550,276 C1640,276 1640,316 1730,316" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="130" width="210" height="26" fill="white"/><text x="1640" y="148" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">invoke</tspan></text><path d="M1970,316 C2060,316 2060,166 2150,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-28" width="210" height="44" fill="white"/><text x="2060" y="-10" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">read permitted documen</tspan><tspan x="2060" dy="18">ts</tspan></text><path d="M1970,316 C2060,316 2060,436 2150,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="130" width="210" height="26" fill="white"/><text x="2060" y="148" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">Converse</tspan></text><g><rect x="50" y="190" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">User browser</tspan><tspan x="66" dy="20">Existing client reference for a sig</tspan><tspan x="66" dy="20">ned-in user. Not provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">RAG web app</tspan><tspan x="486" dy="20">Amazon CloudFront</tspan><tspan x="486" dy="20">Hosts the browser app from priva</tspan><tspan x="486" dy="20">te S3 assets behind CloudFront a</tspan><tspan x="486" dy="20">ccess control. Signs users in with</tspan><tspan x="486" dy="20"> authorization code + PKCE, then</tspan><tspan x="486" dy="20"> calls the API with an access toke</tspan><tspan x="486" dy="20">n and shows answers with citatio</tspan><tspan x="486" dy="20">ns.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="265" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="291" font-size="14"><tspan x="906" dy="0">User pool</tspan><tspan x="906" dy="20">Amazon Cognito</tspan><tspan x="906" dy="20">Admin-created users with require</tspan><tspan x="906" dy="20">d software-token MFA. Issues sc</tspan><tspan x="906" dy="20">oped access tokens. Identity-to-e</tspan><tspan x="906" dy="20">mployee-region mappings live in </tspan><tspan x="906" dy="20">the catalog. Users are onboarded</tspan><tspan x="906" dy="20"> through the generated operator t</tspan><tspan x="906" dy="20">ool; no passwords are stored in t</tspan><tspan x="906" dy="20">he diagram.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="216" font-size="14"><tspan x="1326" dy="0">RAG API</tspan><tspan x="1326" dy="20">Amazon API Gateway</tspan><tspan x="1326" dy="20">Bounded authenticated HTTP AP</tspan><tspan x="1326" dy="20">I with a JWT browser route. Unkn</tspan><tspan x="1326" dy="20">own identities fail closed. No ano</tspan><tspan x="1326" dy="20">nymous access.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="190" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="216" font-size="14"><tspan x="1746" dy="0">Keyword retrieval and answer</tspan><tspan x="1746" dy="20">AWS Lambda</tspan><tspan x="1746" dy="20">Runs keyword search over the ca</tspan><tspan x="1746" dy="20">talog, filters by the caller&apos;s ACL a</tspan><tspan x="1746" dy="20">nd region, rechecks document re</tspan><tspan x="1746" dy="20">visions, calls the model and retur</tspan><tspan x="1746" dy="20">ns a cited answer, or abstains wh</tspan><tspan x="1746" dy="20">en nothing grounds it. Owns its e</tspan><tspan x="1746" dy="20">xecution role, logs, version and al</tspan><tspan x="1746" dy="20">ias.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="50" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">Document catalog and ACLs</tspan><tspan x="2166" dy="20">Amazon DynamoDB</tspan><tspan x="2166" dy="20">Up to 100 small synthetic UTF-8 </tspan><tspan x="2166" dy="20">documents with explicit per-docu</tspan><tspan x="2166" dy="20">ment ACLs and identity mapping</tspan><tspan x="2166" dy="20">s. Ingestion: an operator loads do</tspan><tspan x="2166" dy="20">cuments through the generated c</tspan><tspan x="2166" dy="20">onditional management tool. Call</tspan><tspan x="2166" dy="20">er roles cannot write to it.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Foundation model</tspan><tspan x="2166" dy="20">Amazon Bedrock</tspan><tspan x="2166" dy="20">A direct foundation model reache</tspan><tspan x="2166" dy="20">d through Converse. The model I</tspan><tspan x="2166" dy="20">D, model access, quotas and regi</tspan><tspan x="2166" dy="20">onal availability are still unselecte</tspan><tspan x="2166" dy="20">d and unverified. Locally, model r</tspan><tspan x="2166" dy="20">eplies are mocked.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>