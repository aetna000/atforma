<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="782" viewBox="-50 -90 2910 782"><rect x="-50" y="-90" width="2910" height="782" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic sensor anomaly detection (AWS) · r2</tspan></text><path d="M290,276 C380,276 380,276 470,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="112" width="210" height="44" fill="white"/><text x="380" y="130" text-anchor="middle" font-size="12"><tspan x="380" dy="0">MQTT publish (TLS, dev</tspan><tspan x="380" dy="18">ice cert)</tspan></text><path d="M710,276 C800,276 800,266 890,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">IoT rule → PutRecord</tspan></text><path d="M1130,266 C1220,266 1220,296 1310,296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">event source mapping</tspan></text><path d="M1550,296 C1640,296 1640,126 1730,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">invalid / failed events</tspan></text><path d="M1550,296 C1640,296 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="130" width="210" height="26" fill="white"/><text x="1640" y="148" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">InvokeEndpoint</tspan></text><path d="M1970,436 C2060,436 2060,276 2150,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="130" width="210" height="26" fill="white"/><text x="2060" y="148" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">PutItem score</tspan></text><path d="M1970,436 C2060,436 2060,556 2150,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="270" width="210" height="26" fill="white"/><text x="2060" y="288" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">Publish if anomalous</tspan></text><path d="M2390,556 C2480,556 2480,526 2570,526" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="410" width="210" height="26" fill="white"/><text x="2480" y="428" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">email/SMS notification</tspan></text><g><rect x="50" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Synthetic device simulator</tspan><tspan x="66" dy="20">Existing test publisher. It sends J</tspan><tspan x="66" dy="20">SON events with deviceId, timest</tspan><tspan x="66" dy="20">amp (ISO-8601 UTC), metric, val</tspan><tspan x="66" dy="20">ue and unit. It sits outside the pro</tspan><tspan x="66" dy="20">visioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">Ingestion</tspan><tspan x="486" dy="20">AWS IoT Core</tspan><tspan x="486" dy="20">MQTT ingestion with per-device </tspan><tspan x="486" dy="20">X.509 identity. A topic rule forwar</tspan><tspan x="486" dy="20">ds events unchanged to Kinesis, </tspan><tspan x="486" dy="20">partitioned by deviceId.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">Durable buffer</tspan><tspan x="906" dy="20">Amazon Kinesis Data Streams</tspan><tspan x="906" dy="20">Ordered per-device buffer with re</tspan><tspan x="906" dy="20">play. The retention period is still t</tspan><tspan x="906" dy="20">o be decided.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="190" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="216" font-size="14"><tspan x="1326" dy="0">Validation</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Checks the schema, units and ti</tspan><tspan x="1326" dy="20">mestamps without changing devi</tspan><tspan x="1326" dy="20">ceId, timestamp or unit. Uses par</tspan><tspan x="1326" dy="20">tial-batch failure reporting and ide</tspan><tspan x="1326" dy="20">mpotent processing on deviceId+</tspan><tspan x="1326" dy="20">timestamp.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Rejected events</tspan><tspan x="1746" dy="20">Amazon SQS</tspan><tspan x="1746" dy="20">Dead-letter queue for invalid or fa</tspan><tspan x="1746" dy="20">iled events, kept for investigation </tspan><tspan x="1746" dy="20">and replay.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Anomaly inference</tspan><tspan x="1746" dy="20">Amazon SageMaker AI (real-time</tspan><tspan x="1746" dy="20"> endpoint)</tspan><tspan x="1746" dy="20">Returns an anomaly score and fl</tspan><tspan x="1746" dy="20">ag for each event. Local tests us</tspan><tspan x="1746" dy="20">e a scripted mock; the real model</tspan><tspan x="1746" dy="20"> (or a threshold rule) is not decid</tspan><tspan x="1746" dy="20">ed yet.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="216" font-size="14"><tspan x="2166" dy="0">Results store</tspan><tspan x="2166" dy="20">Amazon DynamoDB</tspan><tspan x="2166" dy="20">Stores the score per event, keye</tspan><tspan x="2166" dy="20">d by deviceId + timestamp, with t</tspan><tspan x="2166" dy="20">he original unit and model versio</tspan><tspan x="2166" dy="20">n.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="496" font-size="14"><tspan x="2166" dy="0">Operator alert</tspan><tspan x="2166" dy="20">Amazon SNS</tspan><tspan x="2166" dy="20">Publishes an alert when an event</tspan><tspan x="2166" dy="20"> is flagged as anomalous. The to</tspan><tspan x="2166" dy="20">pic and subscribers are still to be </tspan><tspan x="2166" dy="20">reviewed.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="470" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="496" font-size="14"><tspan x="2586" dy="0">Operator</tspan><tspan x="2586" dy="20">The person who receives and tria</tspan><tspan x="2586" dy="20">ges anomaly alerts.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>