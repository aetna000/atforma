<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="902" viewBox="-50 -90 2490 902"><rect x="-50" y="-90" width="2490" height="902" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">AWS PR review assistant (synthetic) · r2</tspan></text><path d="M290,276 C380,276 380,156 470,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">signed PR webhook</tspan></text><path d="M710,156 C800,156 800,126 890,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">enqueue review job</tspan></text><path d="M1130,126 C1220,126 1220,466 1310,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">trigger review</tspan></text><path d="M1130,126 C1220,126 1220,116 1310,116" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redrive after retries</tspan></text><path d="M1130,426 C1220,426 1220,466 1310,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read-only token</tspan></text><path d="M290,276 C800,276 800,466 1310,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="112" width="210" height="44" fill="white"/><text x="800" y="130" text-anchor="middle" font-size="12"><tspan x="800" dy="0">read diff + changed files </tspan><tspan x="800" dy="18">only</tspan></text><path d="M1550,466 C1640,466 1640,136 1730,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">Converse: analyze diff</tspan></text><path d="M1550,466 C1640,466 1640,416 1730,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">write line-linked drafts</tspan></text><path d="M1970,416 C2060,416 2060,396 2150,396" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="270" width="210" height="26" fill="white"/><text x="2060" y="288" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">drafts for review</tspan></text><path d="M1550,466 C1640,466 1640,686 1730,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">logs and metrics</tspan></text><g><rect x="50" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Existing Git repository host</tspan><tspan x="66" dy="20">Existing repository with synthetic </tspan><tspan x="66" dy="20">PR. Sends signed PR webhook; </tspan><tspan x="66" dy="20">serves diff and file contents to a r</tspan><tspan x="66" dy="20">ead-only, repo-scoped token. Ne</tspan><tspan x="66" dy="20">ver modified.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">PR webhook endpoint</tspan><tspan x="486" dy="20">Amazon API Gateway (HTTP AP</tspan><tspan x="486" dy="20">I)</tspan><tspan x="486" dy="20">Receives PR events. A small vali</tspan><tspan x="486" dy="20">dator checks the webhook signat</tspan><tspan x="486" dy="20">ure and allowed repository, then </tspan><tspan x="486" dy="20">enqueues. Rejects unknown repo</tspan><tspan x="486" dy="20">s.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Review job queue</tspan><tspan x="906" dy="20">Amazon SQS</tspan><tspan x="906" dy="20">Buffers review jobs keyed by rep</tspan><tspan x="906" dy="20">o+PR+head commit SHA for ide</tspan><tspan x="906" dy="20">mpotent processing.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Failed review jobs</tspan><tspan x="1326" dy="20">Amazon SQS (dead-letter queue)</tspan><tspan x="1326" dy="20">Holds jobs that failed repeatedly, </tspan><tspan x="1326" dy="20">for operator inspection.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">PR review worker</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Fetches only the authorized diff a</tspan><tspan x="1326" dy="20">nd relevant changed files (size-b</tspan><tspan x="1326" dy="20">ounded), treats code as untruste</tspan><tspan x="1326" dy="20">d text and never executes it. Buil</tspan><tspan x="1326" dy="20">ds the prompt, calls the model, v</tspan><tspan x="1326" dy="20">alidates that each comment map</tspan><tspan x="1326" dy="20">s to a changed line, and stores dr</tspan><tspan x="1326" dy="20">afts. No push or merge permissio</tspan><tspan x="1326" dy="20">ns.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="340" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="366" font-size="14"><tspan x="906" dy="0">Read-only repo credential</tspan><tspan x="906" dy="20">AWS Secrets Manager</tspan><tspan x="906" dy="20">Stores the read-only repo token, </tspan><tspan x="906" dy="20">readable only by the worker role. </tspan><tspan x="906" dy="20">The value never appears in the di</tspan><tspan x="906" dy="20">agram.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Review model</tspan><tspan x="1746" dy="20">Amazon Bedrock</tspan><tspan x="1746" dy="20">Foundation model invoked via Co</tspan><tspan x="1746" dy="20">nverse. Model ID, access, region </tspan><tspan x="1746" dy="20">and quotas still need verification. </tspan><tspan x="1746" dy="20">Mocked in local tests.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Draft review comments</tspan><tspan x="1746" dy="20">Amazon DynamoDB</tspan><tspan x="1746" dy="20">Stores line-linked draft comments</tspan><tspan x="1746" dy="20"> per PR/head SHA (file, line, side</tspan><tspan x="1746" dy="20">, text, model ID). Uses conditiona</tspan><tspan x="1746" dy="20">l writes for idempotency.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Human code reviewer</tspan><tspan x="2166" dy="20">Reviews the drafts. Whether they</tspan><tspan x="2166" dy="20"> get posted to the PR is an open </tspan><tspan x="2166" dy="20">decision.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Logs and metrics</tspan><tspan x="1746" dy="20">Amazon CloudWatch</tspan><tspan x="1746" dy="20">Worker logs (no source code bod</tspan><tspan x="1746" dy="20">ies), latency, errors and a DLQ d</tspan><tspan x="1746" dy="20">epth alarm.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>