<svg xmlns="http://www.w3.org/2000/svg" width="4590" height="1202" viewBox="-50 -90 4590 1202"><rect x="-50" y="-90" width="4590" height="1202" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic call agent-assist (AWS) · r2</tspan></text><path d="M290,816 C380,816 380,706 470,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="550" width="210" height="26" fill="white"/><text x="380" y="568" text-anchor="middle" font-size="12"><tspan x="380" dy="0">uses assist desktop</tspan></text><path d="M710,706 C800,706 800,526 890,526" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="400" width="210" height="26" fill="white"/><text x="800" y="418" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (PKCE + MFA)</tspan></text><path d="M1130,526 C1220,526 1220,696 1310,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="400" width="210" height="26" fill="white"/><text x="1220" y="418" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT authorizer</tspan></text><path d="M710,706 C1010,706 1010,696 1310,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="532" width="210" height="44" fill="white"/><text x="1010" y="550" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">consent, approvals, live </tspan><tspan x="1010" dy="18">updates</tspan></text><path d="M1550,696 C1640,696 1640,426 1730,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="280" width="210" height="26" fill="white"/><text x="1640" y="298" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">record consent</tspan></text><path d="M1550,396 C1640,396 1640,426 1730,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">call start</tspan></text><path d="M1970,426 C2060,426 2060,406 2150,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="262" width="210" height="44" fill="white"/><text x="2060" y="280" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">allow stream if consente</tspan><tspan x="2060" dy="18">d</tspan></text><path d="M2390,406 C2480,406 2480,416 2570,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="280" width="210" height="26" fill="white"/><text x="2480" y="298" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">audio stream</tspan></text><path d="M2810,416 C2900,416 2900,416 2990,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="280" width="210" height="26" fill="white"/><text x="2900" y="298" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">transcript segments</tspan></text><path d="M3230,416 C3320,416 3320,576 3410,576" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3215" y="280" width="210" height="26" fill="white"/><text x="3320" y="298" text-anchor="middle" font-size="12"><tspan x="3320" dy="0">redacted segments</tspan></text><path d="M3650,576 C3740,576 3740,146 3830,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3635" y="-10" width="210" height="26" fill="white"/><text x="3740" y="8" text-anchor="middle" font-size="12"><tspan x="3740" dy="0">retrieve cited articles</tspan></text><path d="M3650,576 C3740,576 3740,406 3830,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3635" y="270" width="210" height="26" fill="white"/><text x="3740" y="288" text-anchor="middle" font-size="12"><tspan x="3740" dy="0">apply guardrail</tspan></text><path d="M4070,406 C4160,406 4160,416 4250,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="4055" y="270" width="210" height="26" fill="white"/><text x="4160" y="288" text-anchor="middle" font-size="12"><tspan x="4160" dy="0">Converse (guarded)</tspan></text><path d="M3650,576 C3740,576 3740,706 3830,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3635" y="392" width="210" height="44" fill="white"/><text x="3740" y="410" text-anchor="middle" font-size="12"><tspan x="3740" dy="0">write transcript, drafts, a</tspan><tspan x="3740" dy="18">udit</tspan></text><path d="M3410,576 C2480,576 2480,696 1550,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="392" width="210" height="44" fill="white"/><text x="2480" y="410" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">cited suggestions, summ</tspan><tspan x="2480" dy="18">ary and CRM drafts</tspan></text><path d="M3650,576 C3740,576 3740,976 3830,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3635" y="410" width="210" height="26" fill="white"/><text x="3740" y="428" text-anchor="middle" font-size="12"><tspan x="3740" dy="0">metrics and logs</tspan></text><path d="M290,816 C380,816 380,966 470,966" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="672" width="210" height="44" fill="white"/><text x="380" y="690" text-anchor="middle" font-size="12"><tspan x="380" dy="0">manual submit of approv</tspan><tspan x="380" dy="18">ed draft</tspan></text><g><rect x="50" y="750" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="776" font-size="14"><tspan x="66" dy="0">Support agent</tspan><tspan x="66" dy="20">Person handling the synthetic cal</tspan><tspan x="66" dy="20">l; reviews suggestions and appro</tspan><tspan x="66" dy="20">ves the summary and CRM draft.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Synthetic call audio</tspan><tspan x="1326" dy="20">Pre-recorded synthetic caller/age</tspan><tspan x="1326" dy="20">nt audio played as a stream. No r</tspan><tspan x="1326" dy="20">eal calls are placed.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="470" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="636" font-size="14"><tspan x="486" dy="0">Agent assist web app</tspan><tspan x="486" dy="20">Amazon CloudFront</tspan><tspan x="486" dy="20">Agent desktop showing the live r</tspan><tspan x="486" dy="20">edacted transcript and suggestio</tspan><tspan x="486" dy="20">ns with sources. It records conse</tspan><tspan x="486" dy="20">nt, summary approval and CRM </tspan><tspan x="486" dy="20">draft approval.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="460" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="486" font-size="14"><tspan x="906" dy="0">Agent sign-in</tspan><tspan x="906" dy="20">Amazon Cognito</tspan><tspan x="906" dy="20">Agent authentication with MFA; is</tspan><tspan x="906" dy="20">sues the tokens the API checks.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Assist API</tspan><tspan x="1326" dy="20">Amazon API Gateway</tspan><tspan x="1326" dy="20">Authenticated WebSocket/HTTP </tspan><tspan x="1326" dy="20">API for consent, suggestions and</tspan><tspan x="1326" dy="20"> approvals. Uses a JWT authoriz</tspan><tspan x="1326" dy="20">er; no anonymous access.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="340" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">Consent gate</tspan><tspan x="1746" dy="20">AWS Lambda</tspan><tspan x="1746" dy="20">Blocks audio processing until con</tspan><tspan x="1746" dy="20">sent is recorded for the call ID, a</tspan><tspan x="1746" dy="20">nd stops processing if consent is </tspan><tspan x="1746" dy="20">withdrawn.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="340" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="366" font-size="14"><tspan x="2166" dy="0">Audio ingestion</tspan><tspan x="2166" dy="20">Amazon Kinesis Video Streams</tspan><tspan x="2166" dy="20">Receives the call audio stream o</tspan><tspan x="2166" dy="20">nce consent is recorded.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="340" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="366" font-size="14"><tspan x="2586" dy="0">Transcription</tspan><tspan x="2586" dy="20">Amazon Transcribe</tspan><tspan x="2586" dy="20">Streaming speech-to-text with sp</tspan><tspan x="2586" dy="20">eaker labels; returns transcript se</tspan><tspan x="2586" dy="20">gments to the orchestrator.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="340" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="366" font-size="14"><tspan x="3006" dy="0">PII redaction</tspan><tspan x="3006" dy="20">Amazon Comprehend</tspan><tspan x="3006" dy="20">Detects and masks personal infor</tspan><tspan x="3006" dy="20">mation in each segment before st</tspan><tspan x="3006" dy="20">orage or any model call.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="3410" y="470" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3426" y="496" font-size="14"><tspan x="3426" dy="0">Assist orchestrator</tspan><tspan x="3426" dy="20">AWS Lambda</tspan><tspan x="3426" dy="20">Receives redacted segments, ret</tspan><tspan x="3426" dy="20">rieves knowledge, calls the mode</tspan><tspan x="3426" dy="20">l through guardrails, and returns </tspan><tspan x="3426" dy="20">cited suggestions, a draft summa</tspan><tspan x="3426" dy="20">ry and a CRM draft. It has no CR</tspan><tspan x="3426" dy="20">M write permission.</tspan><tspan x="3426" dy="20">To be selected</tspan></text></g><g><rect x="3830" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3846" y="76" font-size="14"><tspan x="3846" dy="0">Support knowledge base</tspan><tspan x="3846" dy="20">Amazon Bedrock Knowledge Bas</tspan><tspan x="3846" dy="20">es</tspan><tspan x="3846" dy="20">Approved support articles used f</tspan><tspan x="3846" dy="20">or grounding. Source content is tr</tspan><tspan x="3846" dy="20">eated as untrusted data, and eve</tspan><tspan x="3846" dy="20">ry suggestion cites its articles.</tspan><tspan x="3846" dy="20">To be selected</tspan></text></g><g><rect x="3830" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3846" y="356" font-size="14"><tspan x="3846" dy="0">Output guardrails</tspan><tspan x="3846" dy="20">Amazon Bedrock Guardrails</tspan><tspan x="3846" dy="20">Filters prompts and outputs (PII, </tspan><tspan x="3846" dy="20">denied topics, grounding check) </tspan><tspan x="3846" dy="20">around model calls.</tspan><tspan x="3846" dy="20">To be selected</tspan></text></g><g><rect x="4250" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="4266" y="356" font-size="14"><tspan x="4266" dy="0">Foundation model</tspan><tspan x="4266" dy="20">Amazon Bedrock</tspan><tspan x="4266" dy="20">Direct foundation model, not yet </tspan><tspan x="4266" dy="20">selected. Model access, region a</tspan><tspan x="4266" dy="20">nd quotas are unverified; mocked</tspan><tspan x="4266" dy="20"> locally with scripted replies.</tspan><tspan x="4266" dy="20">To be selected</tspan></text></g><g><rect x="3830" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3846" y="636" font-size="14"><tspan x="3846" dy="0">Call session and audit store</tspan><tspan x="3846" dy="20">Amazon DynamoDB</tspan><tspan x="3846" dy="20">Stores consent records, redacted</tspan><tspan x="3846" dy="20"> transcript, suggestions, the appr</tspan><tspan x="3846" dy="20">oved summary, the CRM draft an</tspan><tspan x="3846" dy="20">d the approval audit trail, keyed b</tspan><tspan x="3846" dy="20">y call ID with idempotent writes.</tspan><tspan x="3846" dy="20">To be selected</tspan></text></g><g><rect x="3830" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3846" y="916" font-size="14"><tspan x="3846" dy="0">Monitoring</tspan><tspan x="3846" dy="20">Amazon CloudWatch</tspan><tspan x="3846" dy="20">Logs, metrics and alarms for late</tspan><tspan x="3846" dy="20">ncy, errors and redaction failures.</tspan><tspan x="3846" dy="20"> Logs contain no unredacted cont</tspan><tspan x="3846" dy="20">ent.</tspan><tspan x="3846" dy="20">To be selected</tspan></text></g><g><rect x="470" y="890" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="916" font-size="14"><tspan x="486" dy="0">Existing CRM</tspan><tspan x="486" dy="20">Existing CRM, outside the provisi</tspan><tspan x="486" dy="20">oning scope. The agent submits t</tspan><tspan x="486" dy="20">he approved draft manually; the s</tspan><tspan x="486" dy="20">ystem never writes to it.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g></g></svg>