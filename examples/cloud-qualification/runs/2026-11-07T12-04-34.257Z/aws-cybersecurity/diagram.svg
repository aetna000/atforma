<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="1382" viewBox="-50 -90 2910 1382"><rect x="-50" y="-90" width="2910" height="1382" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic security alert triage (AWS) · r2</tspan></text><path d="M290,276 C380,276 380,296 470,296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="150" width="210" height="26" fill="white"/><text x="380" y="168" text-anchor="middle" font-size="12"><tspan x="380" dy="0">upload alert</tspan></text><path d="M710,296 C800,296 800,286 890,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="150" width="210" height="26" fill="white"/><text x="800" y="168" text-anchor="middle" font-size="12"><tspan x="800" dy="0">object-created event</tspan></text><path d="M1130,286 C1220,286 1220,456 1310,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="150" width="210" height="26" fill="white"/><text x="1220" y="168" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">batch trigger</tspan></text><path d="M1130,286 C1220,286 1220,136 1310,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="10" width="210" height="26" fill="white"/><text x="1220" y="28" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redrive after retries</tspan></text><path d="M1550,456 C1640,456 1640,136 1730,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="0" width="210" height="26" fill="white"/><text x="1640" y="18" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">write redacted alert</tspan></text><path d="M1550,456 C1640,456 1640,576 1730,576" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="290" width="210" height="26" fill="white"/><text x="1640" y="308" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">start execution</tspan></text><path d="M1970,576 C2060,576 2060,556 2150,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="420" width="210" height="26" fill="white"/><text x="2060" y="438" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">fetch evidence</tspan></text><path d="M2390,556 C2480,556 2480,416 2570,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="280" width="210" height="26" fill="white"/><text x="2480" y="298" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">read-only search</tspan></text><path d="M2390,556 C2480,556 2480,686 2570,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="420" width="210" height="26" fill="white"/><text x="2480" y="438" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">asset lookup</tspan></text><path d="M1970,576 C2060,576 2060,156 2150,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-10" width="210" height="26" fill="white"/><text x="2060" y="8" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">alert + evidence</tspan></text><path d="M2390,156 C2480,156 2480,126 2570,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="-10" width="210" height="26" fill="white"/><text x="2480" y="8" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">Converse call</tspan></text><path d="M1970,576 C2060,576 2060,856 2150,856" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="430" width="210" height="26" fill="white"/><text x="2060" y="448" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">create case + proposal</tspan></text><path d="M1970,576 C2060,576 2060,1146 2150,1146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="430" width="210" height="26" fill="white"/><text x="2060" y="448" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">write audit record</tspan></text><path d="M1970,1106 C2060,1106 2060,856 2150,856" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="710" width="210" height="26" fill="white"/><text x="2060" y="728" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">review + decide</tspan></text><path d="M1970,136 C2060,136 2060,156 2150,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-10" width="210" height="26" fill="white"/><text x="2060" y="8" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">read redacted alert</tspan></text><g><rect x="50" y="210" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="236" font-size="14"><tspan x="66" dy="0">Synthetic alert source</tspan><tspan x="66" dy="20">Existing producer of synthetic se</tspan><tspan x="66" dy="20">curity alerts. Outside the provisio</tspan><tspan x="66" dy="20">ning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="210" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="236" font-size="14"><tspan x="486" dy="0">Raw alert landing</tspan><tspan x="486" dy="20">Amazon S3</tspan><tspan x="486" dy="20">Private, versioned, encrypted buc</tspan><tspan x="486" dy="20">ket for raw alerts. Restricted acce</tspan><tspan x="486" dy="20">ss, and object-created events go </tspan><tspan x="486" dy="20">to the ingest queue.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="210" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="236" font-size="14"><tspan x="906" dy="0">Ingest queue</tspan><tspan x="906" dy="20">Amazon SQS</tspan><tspan x="906" dy="20">Buffers alerts for redaction. Visibi</tspan><tspan x="906" dy="20">lity timeout is at least 6x the funct</tspan><tspan x="906" dy="20">ion timeout.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="70" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="96" font-size="14"><tspan x="1326" dy="0">Ingest dead-letter queue</tspan><tspan x="1326" dy="20">Amazon SQS</tspan><tspan x="1326" dy="20">Holds alerts that repeatedly fail, </tspan><tspan x="1326" dy="20">with an alarm for the operator.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="350" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="376" font-size="14"><tspan x="1326" dy="0">Redaction function</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Reads the exact object version, </tspan><tspan x="1326" dy="20">masks sensitive fields (user nam</tspan><tspan x="1326" dy="20">es, IPs, secrets) using rules, writ</tspan><tspan x="1326" dy="20">es the redacted alert and starts t</tspan><tspan x="1326" dy="20">he workflow. Idempotent per vers</tspan><tspan x="1326" dy="20">ion.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="60" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="86" font-size="14"><tspan x="1746" dy="0">Redacted alert store</tspan><tspan x="1746" dy="20">Amazon S3</tspan><tspan x="1746" dy="20">Private encrypted bucket for reda</tspan><tspan x="1746" dy="20">cted alerts that downstream step</tspan><tspan x="1746" dy="20">s are allowed to read.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="490" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="516" font-size="14"><tspan x="1746" dy="0">Triage workflow</tspan><tspan x="1746" dy="20">AWS Step Functions</tspan><tspan x="1746" dy="20">Orchestrates evidence retrieval, </tspan><tspan x="1746" dy="20">AI triage, case creation and audit</tspan><tspan x="1746" dy="20"> writes. It has no action permissio</tspan><tspan x="1746" dy="20">ns on hosts or identities.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="620" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="646" font-size="14"><tspan x="2586" dy="0">Asset inventory</tspan><tspan x="2586" dy="20">Existing asset context (owner, crit</tspan><tspan x="2586" dy="20">icality). Read-only, and the integr</tspan><tspan x="2586" dy="20">ation is to be defined.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="340" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="366" font-size="14"><tspan x="2586" dy="0">Approved log evidence</tspan><tspan x="2586" dy="20">Amazon OpenSearch Service</tspan><tspan x="2586" dy="20">Index of approved, redacted logs </tspan><tspan x="2586" dy="20">searched by time window and ent</tspan><tspan x="2586" dy="20">ity.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="480" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="506" font-size="14"><tspan x="2166" dy="0">Evidence retrieval</tspan><tspan x="2166" dy="20">AWS Lambda</tspan><tspan x="2166" dy="20">Read-only queries for related log</tspan><tspan x="2166" dy="20">s and asset context. Returns cite</tspan><tspan x="2166" dy="20">d evidence references.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">AI triage</tspan><tspan x="2166" dy="20">AWS Lambda</tspan><tspan x="2166" dy="20">Builds a bounded prompt from th</tspan><tspan x="2166" dy="20">e redacted alert and evidence, tr</tspan><tspan x="2166" dy="20">eating evidence as untrusted. Re</tspan><tspan x="2166" dy="20">turns severity, rationale, citations </tspan><tspan x="2166" dy="20">and a proposal-only response. T</tspan><tspan x="2166" dy="20">he output schema is validated.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="76" font-size="14"><tspan x="2586" dy="0">Foundation model</tspan><tspan x="2586" dy="20">Amazon Bedrock</tspan><tspan x="2586" dy="20">Model not yet selected. Access, r</tspan><tspan x="2586" dy="20">egion availability and quotas are </tspan><tspan x="2586" dy="20">unverified.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="770" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="796" font-size="14"><tspan x="2166" dy="0">Analyst case queue</tspan><tspan x="2166" dy="20">Amazon DynamoDB</tspan><tspan x="2166" dy="20">Triage cases with status (new/ac</tspan><tspan x="2166" dy="20">cepted/rejected), proposal and ev</tspan><tspan x="2166" dy="20">idence links. Analysts record deci</tspan><tspan x="2166" dy="20">sions here.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="1050" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="1076" font-size="14"><tspan x="2166" dy="0">Audit record store</tspan><tspan x="2166" dy="20">Amazon S3</tspan><tspan x="2166" dy="20">Bucket with Object Lock holding i</tspan><tspan x="2166" dy="20">mmutable records: alert ID, evide</tspan><tspan x="2166" dy="20">nce references, model ID, prompt</tspan><tspan x="2166" dy="20"> version, proposal and analyst de</tspan><tspan x="2166" dy="20">cision.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="1040" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="1066" font-size="14"><tspan x="1746" dy="0">Security analyst</tspan><tspan x="1746" dy="20">Reviews proposals and decides. </tspan><tspan x="1746" dy="20">Any action is taken manually outs</tspan><tspan x="1746" dy="20">ide this system.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>