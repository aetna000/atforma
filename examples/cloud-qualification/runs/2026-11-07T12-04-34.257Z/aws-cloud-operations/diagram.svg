<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="902" viewBox="-50 -90 2070 902"><rect x="-50" y="-90" width="2070" height="902" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">AWS read-only drift detection and correction proposal · r2</tspan></text><path d="M290,396 C380,396 380,416 470,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="252" width="210" height="44" fill="white"/><text x="380" y="270" text-anchor="middle" font-size="12"><tspan x="380" dy="0">start analysis / approve </tspan><tspan x="380" dy="18">or reject</tspan></text><path d="M710,416 C800,416 800,136 890,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-28" width="210" height="44" fill="white"/><text x="800" y="-10" text-anchor="middle" font-size="12"><tspan x="800" dy="0">read snapshot (read-onl</tspan><tspan x="800" dy="18">y)</tspan></text><path d="M710,416 C800,416 800,416 890,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">run checks</tspan></text><path d="M1130,416 C1220,416 1220,426 1310,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">drift findings</tspan></text><path d="M1550,426 C1640,426 1640,276 1730,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="130" width="210" height="26" fill="white"/><text x="1640" y="148" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">draft plan</tspan></text><path d="M1550,426 C1640,426 1640,546 1730,546" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">store diff for review</tspan></text><path d="M710,416 C800,416 800,686 890,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">API activity logged</tspan></text><g><rect x="50" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Platform operator</tspan><tspan x="66" dy="20">Existing operator. Starts analysis </tspan><tspan x="66" dy="20">runs and reviews the results. Out</tspan><tspan x="66" dy="20">side the provisioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Synthetic inventory snapshots</tspan><tspan x="906" dy="20">Amazon S3</tspan><tspan x="906" dy="20">Private, versioned bucket that hol</tspan><tspan x="906" dy="20">ds the synthetic inventory and de</tspan><tspan x="906" dy="20">sired-state baselines. The workfl</tspan><tspan x="906" dy="20">ow can only read it.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Analysis workflow</tspan><tspan x="486" dy="20">AWS Step Functions</tspan><tspan x="486" dy="20">Runs the steps in order: snapsho</tspan><tspan x="486" dy="20">t, checks, plan, diff, then waits for</tspan><tspan x="486" dy="20"> approval. There is no apply step.</tspan><tspan x="486" dy="20"> Its execution role is read-only.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Policy and drift checks</tspan><tspan x="906" dy="20">AWS Lambda</tspan><tspan x="906" dy="20">Compares the inventory with the </tspan><tspan x="906" dy="20">baseline and policy rules, then ou</tspan><tspan x="906" dy="20">tputs findings. Design-only, so th</tspan><tspan x="906" dy="20">e code still needs to be written.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Correction plan drafter</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Turns findings into a proposed co</tspan><tspan x="1326" dy="20">rrection and a reviewable diff. Its </tspan><tspan x="1326" dy="20">plans can&apos;t include deletes or per</tspan><tspan x="1326" dy="20">mission increases, and it never a</tspan><tspan x="1326" dy="20">pplies anything. Design-only.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="216" font-size="14"><tspan x="1746" dy="0">Foundation model</tspan><tspan x="1746" dy="20">Amazon Bedrock</tspan><tspan x="1746" dy="20">Drafts the plan text. The model I</tspan><tspan x="1746" dy="20">D, access and region are not yet </tspan><tspan x="1746" dy="20">chosen or verified. Local tests us</tspan><tspan x="1746" dy="20">e scripted responses.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="470" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="496" font-size="14"><tspan x="1746" dy="0">Plans, diffs and approvals</tspan><tspan x="1746" dy="20">Amazon DynamoDB</tspan><tspan x="1746" dy="20">Stores findings, proposed diffs an</tspan><tspan x="1746" dy="20">d approval decisions for each run</tspan><tspan x="1746" dy="20">. Design-only.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="890" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">API audit trail</tspan><tspan x="906" dy="20">AWS CloudTrail</tspan><tspan x="906" dy="20">Records API activity so we can c</tspan><tspan x="906" dy="20">onfirm that only read operations </tspan><tspan x="906" dy="20">happened.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g></g></svg>