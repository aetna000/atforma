<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="1742" viewBox="-50 -90 2490 1742"><rect x="-50" y="-90" width="2490" height="1742" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Support staff knowledge assistant (AWS) · r2</tspan></text><path d="M290,816 C380,816 380,836 470,836" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="690" width="210" height="26" fill="white"/><text x="380" y="708" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,836 C800,836 800,761 890,761" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="615" width="210" height="26" fill="white"/><text x="800" y="633" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (PKCE)</tspan></text><path d="M1130,761 C1220,761 1220,816 1310,816" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="615" width="210" height="26" fill="white"/><text x="1220" y="633" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT authorizer</tspan></text><path d="M710,836 C1010,836 1010,816 1310,816" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="690" width="210" height="26" fill="white"/><text x="1010" y="708" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">draft request / cited draft</tspan></text><path d="M1550,816 C1640,816 1640,876 1730,876" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="690" width="210" height="26" fill="white"/><text x="1640" y="708" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">invoke</tspan></text><path d="M1970,876 C2060,876 2060,136 2150,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-10" width="210" height="26" fill="white"/><text x="2060" y="8" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">authorized retrieval</tspan></text><path d="M1970,876 C2060,876 2060,396 2150,396" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="270" width="210" height="26" fill="white"/><text x="2060" y="288" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">read ticket</tspan></text><path d="M1970,876 C2060,876 2060,676 2150,676" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="532" width="210" height="44" fill="white"/><text x="2060" y="550" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">read-only customer look</tspan><tspan x="2060" dy="18">up</tspan></text><path d="M1970,876 C2060,876 2060,966 2150,966" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="672" width="210" height="44" fill="white"/><text x="2060" y="690" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">grounded drafting (Conv</tspan><tspan x="2060" dy="18">erse)</tspan></text><path d="M1970,876 C2060,876 2060,1246 2150,1246" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="690" width="210" height="26" fill="white"/><text x="2060" y="708" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">escalate to human</tspan></text><path d="M1970,876 C2060,876 2060,1526 2150,1526" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="690" width="210" height="26" fill="white"/><text x="2060" y="708" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">audit events</tspan></text><g><rect x="50" y="750" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="776" font-size="14"><tspan x="66" dy="0">Support staff browser</tspan><tspan x="66" dy="20">Support agents using a browser. </tspan><tspan x="66" dy="20">Client reference only; not provisio</tspan><tspan x="66" dy="20">ned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="750" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="776" font-size="14"><tspan x="486" dy="0">Staff web app</tspan><tspan x="486" dy="20">Amazon CloudFront</tspan><tspan x="486" dy="20">Staff interface: shows the ticket, t</tspan><tspan x="486" dy="20">he drafted reply with citations an</tspan><tspan x="486" dy="20">d an Escalate button. The app o</tspan><tspan x="486" dy="20">wns its private static assets.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="675" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="701" font-size="14"><tspan x="906" dy="0">Staff sign-in</tspan><tspan x="906" dy="20">Amazon Cognito</tspan><tspan x="906" dy="20">Staff sign-in with MFA. Its tokens </tspan><tspan x="906" dy="20">authorize API calls and carry the </tspan><tspan x="906" dy="20">staff role used for retrieval filterin</tspan><tspan x="906" dy="20">g.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="750" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="776" font-size="14"><tspan x="1326" dy="0">Assistant API</tspan><tspan x="1326" dy="20">Amazon API Gateway</tspan><tspan x="1326" dy="20">Authenticated HTTP API. No ano</tspan><tspan x="1326" dy="20">nymous access.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="750" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="776" font-size="14"><tspan x="1746" dy="0">Draft orchestrator</tspan><tspan x="1746" dy="20">AWS Lambda</tspan><tspan x="1746" dy="20">Loads the ticket and runs authori</tspan><tspan x="1746" dy="20">zed retrieval from approved know</tspan><tspan x="1746" dy="20">ledge plus a read-only CRM look</tspan><tspan x="1746" dy="20">up. It then drafts a cited reply, ab</tspan><tspan x="1746" dy="20">stains or escalates when the evid</tspan><tspan x="1746" dy="20">ence is weak, and returns the dra</tspan><tspan x="1746" dy="20">ft to the staff app. It has no refun</tspan><tspan x="1746" dy="20">d or write tools.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">Approved knowledge catalog</tspan><tspan x="2166" dy="20">Amazon DynamoDB</tspan><tspan x="2166" dy="20">Approved articles with ACLs and </tspan><tspan x="2166" dy="20">revisions. The retrieval mode (ke</tspan><tspan x="2166" dy="20">yword or semantic) is still to be d</tspan><tspan x="2166" dy="20">ecided.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Synthetic ticket queue</tspan><tspan x="2166" dy="20">Existing synthetic ticket system. </tspan><tspan x="2166" dy="20">Read integration still needs engin</tspan><tspan x="2166" dy="20">eering.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="636" font-size="14"><tspan x="2166" dy="0">Existing CRM</tspan><tspan x="2166" dy="20">Customer records. Read-only ac</tspan><tspan x="2166" dy="20">cess only; the assistant never mo</tspan><tspan x="2166" dy="20">difies records or issues refunds.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="890" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="916" font-size="14"><tspan x="2166" dy="0">Foundation model</tspan><tspan x="2166" dy="20">Amazon Bedrock</tspan><tspan x="2166" dy="20">Drafts the grounded reply. Model </tspan><tspan x="2166" dy="20">ID, access, quotas and region ar</tspan><tspan x="2166" dy="20">e still to be verified.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="1170" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="1196" font-size="14"><tspan x="2166" dy="0">Human escalation queue</tspan><tspan x="2166" dy="20">Amazon SQS</tspan><tspan x="2166" dy="20">Holds low-confidence or out-of-sc</tspan><tspan x="2166" dy="20">ope cases for a human agent to r</tspan><tspan x="2166" dy="20">eview.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="1450" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="1476" font-size="14"><tspan x="2166" dy="0">Audit logs</tspan><tspan x="2166" dy="20">Amazon CloudWatch Logs</tspan><tspan x="2166" dy="20">Logs requests, cited sources, ab</tspan><tspan x="2166" dy="20">stentions and escalations. Retent</tspan><tspan x="2166" dy="20">ion is still to be agreed.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>