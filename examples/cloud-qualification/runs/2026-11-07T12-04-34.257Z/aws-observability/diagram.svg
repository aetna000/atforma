<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1772" viewBox="-50 -90 1650 1772"><rect x="-50" y="-90" width="1650" height="1772" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">AWS incident explainer (logs + traces) · r2</tspan></text><path d="M290,396 C380,396 380,406 470,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="270" width="210" height="26" fill="white"/><text x="380" y="288" text-anchor="middle" font-size="12"><tspan x="380" dy="0">OTLP logs + traces</tspan></text><path d="M710,406 C1010,406 1010,126 1310,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="-10" width="210" height="26" fill="white"/><text x="1010" y="8" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">redacted spans</tspan></text><path d="M710,406 C800,406 800,686 890,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">log records</tspan></text><path d="M1130,686 C1220,686 1220,426 1310,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">transform invoke</tspan></text><path d="M1130,686 C1220,686 1220,696 1310,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted batches</tspan></text><path d="M1130,686 C1220,686 1220,976 1310,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted index docs</tspan></text><path d="M290,1216 C380,1216 380,1236 470,1236" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="1082" width="210" height="44" fill="white"/><text x="380" y="1100" text-anchor="middle" font-size="12"><tspan x="380" dy="0">ask about incident (SigV</tspan><tspan x="380" dy="18">4)</tspan></text><path d="M710,1236 C800,1236 800,1286 890,1286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="1082" width="210" height="44" fill="white"/><text x="800" y="1100" text-anchor="middle" font-size="12"><tspan x="800" dy="0">invoke; returns cited expl</tspan><tspan x="800" dy="18">anation</tspan></text><path d="M1130,1286 C1220,1286 1220,126 1310,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">get traces by window</tspan></text><path d="M1130,1286 C1220,1286 1220,976 1310,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="840" width="210" height="26" fill="white"/><text x="1220" y="858" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">query by trace ID</tspan></text><path d="M1130,1286 C1220,1286 1220,1266 1310,1266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="1100" width="210" height="26" fill="white"/><text x="1220" y="1118" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">apply guardrail</tspan></text><path d="M1130,1286 C1220,1286 1220,1546 1310,1546" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="1082" width="210" height="44" fill="white"/><text x="1220" y="1100" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Converse (evidence as d</tspan><tspan x="1220" dy="18">ata)</tspan></text><g><rect x="50" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Synthetic services</tspan><tspan x="66" dy="20">Existing synthetic workload emitti</tspan><tspan x="66" dy="20">ng logs and OpenTelemetry trace</tspan><tspan x="66" dy="20">s. Outside provisioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">ADOT Collector</tspan><tspan x="486" dy="20">AWS Distro for OpenTelemetry</tspan><tspan x="486" dy="20">Receives OTLP logs and traces. </tspan><tspan x="486" dy="20">Sends traces to X-Ray and logs t</tspan><tspan x="486" dy="20">o Firehose.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Trace store</tspan><tspan x="1326" dy="20">AWS X-Ray</tspan><tspan x="1326" dy="20">Stores distributed traces. Attribut</tspan><tspan x="1326" dy="20">es are redacted at the collector b</tspan><tspan x="1326" dy="20">efore export.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">Log delivery stream</tspan><tspan x="906" dy="20">Amazon Data Firehose</tspan><tspan x="906" dy="20">Buffers log records and calls the </tspan><tspan x="906" dy="20">redaction transform before delive</tspan><tspan x="906" dy="20">ry.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">Redaction transform</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Applies the rule-based redaction </tspan><tspan x="1326" dy="20">rules (still to be confirmed) and ta</tspan><tspan x="1326" dy="20">gs records as untrusted text. Ow</tspan><tspan x="1326" dy="20">ns its role and logs.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="620" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="646" font-size="14"><tspan x="1326" dy="0">Redacted evidence archive</tspan><tspan x="1326" dy="20">Amazon S3</tspan><tspan x="1326" dy="20">Private, encrypted, versioned sto</tspan><tspan x="1326" dy="20">re for redacted log batches. This i</tspan><tspan x="1326" dy="20">s the evidence of record.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="900" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="926" font-size="14"><tspan x="1326" dy="0">Log search index</tspan><tspan x="1326" dy="20">Amazon OpenSearch Service</tspan><tspan x="1326" dy="20">Searchable index of redacted log</tspan><tspan x="1326" dy="20">s, keyed by trace ID and record I</tspan><tspan x="1326" dy="20">D.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1160" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1186" font-size="14"><tspan x="906" dy="0">Incident analysis runtime</tspan><tspan x="906" dy="20">AWS Lambda</tspan><tspan x="906" dy="20">Correlates X-Ray traces with Op</tspan><tspan x="906" dy="20">enSearch hits for an incident win</tspan><tspan x="906" dy="20">dow. Sends the evidence to the </tspan><tspan x="906" dy="20">model as quoted data and return</tspan><tspan x="906" dy="20">s an explanation that cites trace </tspan><tspan x="906" dy="20">and record IDs, or abstains. This </tspan><tspan x="906" dy="20">application code is not yet gener</tspan><tspan x="906" dy="20">ated.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1180" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1206" font-size="14"><tspan x="1326" dy="0">Prompt/answer guardrail</tspan><tspan x="1326" dy="20">Amazon Bedrock Guardrails</tspan><tspan x="1326" dy="20">Filters prompt attacks and sensiti</tspan><tspan x="1326" dy="20">ve information in model input and</tspan><tspan x="1326" dy="20"> output. The configuration still ne</tspan><tspan x="1326" dy="20">eds to be defined.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1460" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1486" font-size="14"><tspan x="1326" dy="0">Foundation model</tspan><tspan x="1326" dy="20">Amazon Bedrock</tspan><tspan x="1326" dy="20">Direct foundation model through </tspan><tspan x="1326" dy="20">Converse. The model ID, access,</tspan><tspan x="1326" dy="20"> region and quotas are unverified</tspan><tspan x="1326" dy="20">.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="470" y="1160" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="1186" font-size="14"><tspan x="486" dy="0">Operator API</tspan><tspan x="486" dy="20">Amazon API Gateway</tspan><tspan x="486" dy="20">IAM-authenticated HTTP API for i</tspan><tspan x="486" dy="20">ncident questions. No anonymou</tspan><tspan x="486" dy="20">s access.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="50" y="1160" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="1186" font-size="14"><tspan x="66" dy="0">On-call operator</tspan><tspan x="66" dy="20">Existing operator identity. Outsid</tspan><tspan x="66" dy="20">e provisioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g></g></svg>