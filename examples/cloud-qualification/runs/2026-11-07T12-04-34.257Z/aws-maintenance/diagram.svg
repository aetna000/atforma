<svg xmlns="http://www.w3.org/2000/svg" width="3750" height="642" viewBox="-50 -90 3750 642"><rect x="-50" y="-90" width="3750" height="642" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">AWS predictive maintenance (synthetic) · r2</tspan></text><path d="M290,106 C380,106 380,146 470,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">MQTT telemetry</tspan></text><path d="M710,146 C800,146 800,276 890,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Firehose delivery</tspan></text><path d="M710,396 C800,396 800,276 890,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">record upload</tspan></text><path d="M1130,276 C1220,276 1220,276 1310,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">raw read</tspan></text><path d="M1550,276 C1640,276 1640,201 1730,201" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="55" width="210" height="26" fill="white"/><text x="1640" y="73" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">labelled features</tspan></text><path d="M1970,201 C2060,201 2060,201 2150,201" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="37" width="210" height="44" fill="white"/><text x="2060" y="55" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">register version and metr</tspan><tspan x="2060" dy="18">ics</tspan></text><path d="M2390,201 C2480,201 2480,276 2570,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="55" width="210" height="26" fill="white"/><text x="2480" y="73" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">approved model</tspan></text><path d="M1550,276 C2060,276 2060,276 2570,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="130" width="210" height="26" fill="white"/><text x="2060" y="148" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">latest features</tspan></text><path d="M2810,276 C2900,276 2900,416 2990,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="130" width="210" height="26" fill="white"/><text x="2900" y="148" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">risk scores</tspan></text><path d="M2810,276 C2900,276 2900,136 2990,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="-28" width="210" height="44" fill="white"/><text x="2900" y="-10" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">captured inputs and outp</tspan><tspan x="2900" dy="18">uts</tspan></text><path d="M3230,416 C3320,416 3320,386 3410,386" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3215" y="270" width="210" height="26" fill="white"/><text x="3320" y="288" text-anchor="middle" font-size="12"><tspan x="3320" dy="0">draft for review</tspan></text><g><rect x="50" y="50" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Synthetic sensor generator</tspan><tspan x="66" dy="20">Existing synthetic sensor source </tspan><tspan x="66" dy="20">publishing telemetry over MQTT.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Sensor ingestion</tspan><tspan x="486" dy="20">AWS IoT Core</tspan><tspan x="486" dy="20">Receives telemetry and uses a ru</tspan><tspan x="486" dy="20">le to route it to Kinesis Data Fireh</tspan><tspan x="486" dy="20">ose, which delivers it to S3. Fireh</tspan><tspan x="486" dy="20">ose is shown inside this compon</tspan><tspan x="486" dy="20">ent.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Synthetic maintenance records</tspan><tspan x="486" dy="20">Existing CSV export of synthetic </tspan><tspan x="486" dy="20">maintenance and failure history, </tspan><tspan x="486" dy="20">used as labels.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">Raw and curated data</tspan><tspan x="906" dy="20">Amazon S3</tspan><tspan x="906" dy="20">Private, versioned, encrypted buc</tspan><tspan x="906" dy="20">ket for raw telemetry, maintenanc</tspan><tspan x="906" dy="20">e records, features and model art</tspan><tspan x="906" dy="20">ifacts.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="216" font-size="14"><tspan x="1326" dy="0">Feature preparation</tspan><tspan x="1326" dy="20">AWS Glue</tspan><tspan x="1326" dy="20">Builds windowed sensor features</tspan><tspan x="1326" dy="20"> and time-aligned failure labels, a</tspan><tspan x="1326" dy="20">voiding leakage, and writes the r</tspan><tspan x="1326" dy="20">esults to S3.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="115" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="141" font-size="14"><tspan x="1746" dy="0">Training and held-out evaluation</tspan><tspan x="1746" dy="20">Amazon SageMaker Pipelines</tspan><tspan x="1746" dy="20">Trains the model, then evaluates </tspan><tspan x="1746" dy="20">it on a later held-out time window</tspan><tspan x="1746" dy="20"> (precision/recall and false alarm</tspan><tspan x="1746" dy="20">s) before registration.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="115" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="141" font-size="14"><tspan x="2166" dy="0">Versioned model</tspan><tspan x="2166" dy="20">Amazon SageMaker Model Regi</tspan><tspan x="2166" dy="20">stry</tspan><tspan x="2166" dy="20">Holds versioned model packages</tspan><tspan x="2166" dy="20"> with evaluation metrics; a person</tspan><tspan x="2166" dy="20"> approves promotion.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="216" font-size="14"><tspan x="2586" dy="0">Maintenance risk scoring</tspan><tspan x="2586" dy="20">Amazon SageMaker Batch Trans</tspan><tspan x="2586" dy="20">form</tspan><tspan x="2586" dy="20">Scores the latest features with th</tspan><tspan x="2586" dy="20">e approved model version and ou</tspan><tspan x="2586" dy="20">tputs failure risk for each asset.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="76" font-size="14"><tspan x="3006" dy="0">Drift monitoring</tspan><tspan x="3006" dy="20">Amazon SageMaker Model Monit</tspan><tspan x="3006" dy="20">or</tspan><tspan x="3006" dy="20">Compares scored data with the tr</tspan><tspan x="3006" dy="20">aining baseline and raises alerts t</tspan><tspan x="3006" dy="20">hrough CloudWatch.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="356" font-size="14"><tspan x="3006" dy="0">Work-order drafts</tspan><tspan x="3006" dy="20">AWS Lambda</tspan><tspan x="3006" dy="20">Turns risk above a threshold into </tspan><tspan x="3006" dy="20">idempotent draft work orders stor</tspan><tspan x="3006" dy="20">ed in DynamoDB. Drafts only; ne</tspan><tspan x="3006" dy="20">ver controls equipment.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="3410" y="330" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3426" y="356" font-size="14"><tspan x="3426" dy="0">Maintenance operator</tspan><tspan x="3426" dy="20">A person who reviews, approves </tspan><tspan x="3426" dy="20">or rejects each draft.</tspan><tspan x="3426" dy="20">To be selected</tspan></text></g></g></svg>