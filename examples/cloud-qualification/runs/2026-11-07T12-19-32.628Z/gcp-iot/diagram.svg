<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="1482" viewBox="-50 -90 2490 1482"><rect x="-50" y="-90" width="2490" height="1482" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic sensor anomaly detection (Google Cloud) · r2</tspan></text><path d="M290,706 C380,706 380,706 470,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="550" width="210" height="26" fill="white"/><text x="380" y="568" text-anchor="middle" font-size="12"><tspan x="380" dy="0">publish telemetry</tspan></text><path d="M710,706 C800,706 800,756 890,756" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="532" width="210" height="44" fill="white"/><text x="800" y="550" text-anchor="middle" font-size="12"><tspan x="800" dy="0">streaming pull / replay vi</tspan><tspan x="800" dy="18">a seek</tspan></text><path d="M1130,756 C1220,756 1220,136 1310,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">archive raw events</tspan></text><path d="M1130,756 C1220,756 1220,416 1310,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">device and unit lookup</tspan></text><path d="M1130,756 C1220,756 1220,1256 1310,1256" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">rejected with reason</tspan></text><path d="M1130,756 C1220,756 1220,986 1310,986" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">predict feature window</tspan></text><path d="M1130,1226 C1220,1226 1220,986 1310,986" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="830" width="210" height="26" fill="white"/><text x="1220" y="848" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">deploy model version</tspan></text><path d="M1130,756 C1220,756 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="532" width="210" height="44" fill="white"/><text x="1220" y="550" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">write result with idempot</tspan><tspan x="1220" dy="18">ent key</tspan></text><path d="M1550,706 C1640,706 1640,826 1730,826" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="550" width="210" height="26" fill="white"/><text x="1640" y="568" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">anomaly metric</tspan></text><path d="M1550,1256 C1640,1256 1640,826 1730,826" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="690" width="210" height="26" fill="white"/><text x="1640" y="708" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">reject rate</tspan></text><path d="M1970,826 C2060,826 2060,816 2150,816" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="690" width="210" height="26" fill="white"/><text x="2060" y="708" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">alert notification</tspan></text><g><rect x="50" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="636" font-size="14"><tspan x="66" dy="0">Synthetic sensor simulator</tspan><tspan x="66" dy="20">Existing test caller outside provisi</tspan><tspan x="66" dy="20">oning scope. Emits events with d</tspan><tspan x="66" dy="20">evice_id, event_id, event timesta</tspan><tspan x="66" dy="20">mp, value and unit, including dupl</tspan><tspan x="66" dy="20">icates, late, out-of-order, unknow</tspan><tspan x="66" dy="20">n-device and bad-unit cases.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="636" font-size="14"><tspan x="486" dy="0">Telemetry ingest topic</tspan><tspan x="486" dy="20">Pub/Sub</tspan><tspan x="486" dy="20">Durable buffer with message rete</tspan><tspan x="486" dy="20">ntion and seek-to-timestamp for r</tspan><tspan x="486" dy="20">eplay after disconnection. Orderi</tspan><tspan x="486" dy="20">ng key = device_id. Publisher us</tspan><tspan x="486" dy="20">es a dedicated service account.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Raw event archive</tspan><tspan x="1326" dy="20">Cloud Storage</tspan><tspan x="1326" dy="20">Unmodified raw events written by</tspan><tspan x="1326" dy="20"> Dataflow for longer-term replay a</tspan><tspan x="1326" dy="20">nd audit, beyond Pub/Sub retenti</tspan><tspan x="1326" dy="20">on.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Device registry</tspan><tspan x="1326" dy="20">Firestore</tspan><tspan x="1326" dy="20">Known devices and their allowed </tspan><tspan x="1326" dy="20">units. Dataflow checks every eve</tspan><tspan x="1326" dy="20">nt against it; unknown devices ar</tspan><tspan x="1326" dy="20">e rejected.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="610" width="240" height="292" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">Validation and windowing pipelin</tspan><tspan x="906" dy="20">e</tspan><tspan x="906" dy="20">Dataflow</tspan><tspan x="906" dy="20">Apache Beam streaming job: vali</tspan><tspan x="906" dy="20">dates the schema, device and un</tspan><tspan x="906" dy="20">it; removes duplicates by event_i</tspan><tspan x="906" dy="20">d; uses event-time windows with </tspan><tspan x="906" dy="20">an explicit allowed-lateness polic</tspan><tspan x="906" dy="20">y (still open); builds feature windo</tspan><tspan x="906" dy="20">ws while keeping device_id, time</tspan><tspan x="906" dy="20">stamps and units unchanged; call</tspan><tspan x="906" dy="20">s the model.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1170" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1196" font-size="14"><tspan x="1326" dy="0">Rejected events topic</tspan><tspan x="1326" dy="20">Pub/Sub</tspan><tspan x="1326" dy="20">Dead-letter topic for unknown de</tspan><tspan x="1326" dy="20">vices, invalid units and events pa</tspan><tspan x="1326" dy="20">st the lateness limit, each with a r</tspan><tspan x="1326" dy="20">ejection reason.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="890" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="916" font-size="14"><tspan x="1326" dy="0">Anomaly model endpoint</tspan><tspan x="1326" dy="20">Vertex AI Endpoints</tspan><tspan x="1326" dy="20">Serves the anomaly model and r</tspan><tspan x="1326" dy="20">eturns a score, the evidence feat</tspan><tspan x="1326" dy="20">ures and the model version. In lo</tspan><tspan x="1326" dy="20">cal tests this is a scripted mock, </tspan><tspan x="1326" dy="20">not a validated model.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1150" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1176" font-size="14"><tspan x="906" dy="0">Model registry</tspan><tspan x="906" dy="20">Vertex AI Model Registry</tspan><tspan x="906" dy="20">Versioned anomaly models; the d</tspan><tspan x="906" dy="20">eployed version is stamped on ev</tspan><tspan x="906" dy="20">ery result.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Anomaly results</tspan><tspan x="1326" dy="20">BigQuery</tspan><tspan x="1326" dy="20">One row per device window, writt</tspan><tspan x="1326" dy="20">en idempotently using a determin</tspan><tspan x="1326" dy="20">istic key: device_id, window, scor</tspan><tspan x="1326" dy="20">e, evidence, model_version and </tspan><tspan x="1326" dy="20">original units and timestamps.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="750" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="776" font-size="14"><tspan x="1746" dy="0">Operator alerting</tspan><tspan x="1746" dy="20">Cloud Monitoring</tspan><tspan x="1746" dy="20">Alert policy on anomaly results a</tspan><tspan x="1746" dy="20">nd pipeline health (backlog, dead</tspan><tspan x="1746" dy="20">-letter rate).</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="750" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="776" font-size="14"><tspan x="2166" dy="0">Operator</tspan><tspan x="2166" dy="20">Person who receives anomaly al</tspan><tspan x="2166" dy="20">erts. Notification channel still to b</tspan><tspan x="2166" dy="20">e chosen.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>