<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="902" viewBox="-50 -90 2910 902"><rect x="-50" y="-90" width="2910" height="902" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Google Cloud log and trace incident analysis · r2</tspan></text><path d="M290,266 C380,266 380,286 470,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">OTLP logs and traces</tspan></text><path d="M710,286 C800,286 800,276 890,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">publish batches</tspan></text><path d="M1130,276 C1220,276 1220,306 1310,306" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">push subscription</tspan></text><path d="M1550,306 C1640,306 1640,146 1730,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">de-identify content</tspan></text><path d="M1550,306 C1640,306 1640,416 1730,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="112" width="210" height="44" fill="white"/><text x="1640" y="130" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">idempotent upsert of red</tspan><tspan x="1640" dy="18">acted records</tspan></text><path d="M1970,416 C2060,416 2060,606 2150,606" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="252" width="210" height="44" fill="white"/><text x="2060" y="270" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">timeline and evidence qu</tspan><tspan x="2060" dy="18">ery</tspan></text><path d="M2390,606 C2480,606 2480,556 2570,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="392" width="210" height="44" fill="white"/><text x="2480" y="410" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">generateContent (no tool</tspan><tspan x="2480" dy="18">s)</tspan></text><path d="M1550,676 C1640,676 1640,686 1730,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="550" width="210" height="26" fill="white"/><text x="1640" y="568" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">HTTPS sign-in</tspan></text><path d="M1970,686 C2060,686 2060,606 2150,606" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="392" width="210" height="44" fill="white"/><text x="2060" y="410" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">authenticated request; re</tspan><tspan x="2060" dy="18">turns cited answer</tspan></text><g><rect x="50" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Synthetic services</tspan><tspan x="66" dy="20">Existing synthetic microservices t</tspan><tspan x="66" dy="20">hat send OTLP logs and distribut</tspan><tspan x="66" dy="20">ed traces. Outside the provisionin</tspan><tspan x="66" dy="20">g scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">OpenTelemetry Collector</tspan><tspan x="486" dy="20">Cloud Run</tspan><tspan x="486" dy="20">OpenTelemetry Collector running</tspan><tspan x="486" dy="20"> on Cloud Run. Receives OTLP, </tspan><tspan x="486" dy="20">batches records and keeps the or</tspan><tspan x="486" dy="20">iginal trace_id, span_id and log I</tspan><tspan x="486" dy="20">Ds.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">Raw telemetry topic</tspan><tspan x="906" dy="20">Pub/Sub</tspan><tspan x="906" dy="20">Buffers raw, unredacted telemetr</tspan><tspan x="906" dy="20">y. A dead-letter topic and short re</tspan><tspan x="906" dy="20">tention apply. No direct consumer</tspan><tspan x="906" dy="20"> has model access.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="190" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="216" font-size="14"><tspan x="1326" dy="0">Redaction and ingestion worker</tspan><tspan x="1326" dy="20">Cloud Run</tspan><tspan x="1326" dy="20">Pushes each record to Sensitive </tspan><tspan x="1326" dy="20">Data Protection for de-identificati</tspan><tspan x="1326" dy="20">on before storage. Writes an ide</tspan><tspan x="1326" dy="20">mpotent upsert keyed by trace_id</tspan><tspan x="1326" dy="20">, span_id and log insertId, so rep</tspan><tspan x="1326" dy="20">eated ingestion produces the sa</tspan><tspan x="1326" dy="20">me timeline.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Secret redaction</tspan><tspan x="1746" dy="20">Sensitive Data Protection (Cloud </tspan><tspan x="1746" dy="20">DLP)</tspan><tspan x="1746" dy="20">De-identification template for cre</tspan><tspan x="1746" dy="20">dentials, tokens and keys. Redac</tspan><tspan x="1746" dy="20">ted text is the only text allowed d</tspan><tspan x="1746" dy="20">ownstream.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Redacted telemetry store</tspan><tspan x="1746" dy="20">BigQuery</tspan><tspan x="1746" dy="20">Redacted spans and logs, partitio</tspan><tspan x="1746" dy="20">ned by time and clustered by trac</tspan><tspan x="1746" dy="20">e_id. The incident timeline and e</tspan><tspan x="1746" dy="20">vidence search query this store.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="470" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="496" font-size="14"><tspan x="2166" dy="0">Incident analysis service</tspan><tspan x="2166" dy="20">Cloud Run</tspan><tspan x="2166" dy="20">Builds the timeline from BigQuery</tspan><tspan x="2166" dy="20"> and sends redacted evidence to </tspan><tspan x="2166" dy="20">Gemini as quoted data, with no t</tspan><tspan x="2166" dy="20">ool declarations. Checks that the </tspan><tspan x="2166" dy="20">output is valid JSON and that eve</tspan><tspan x="2166" dy="20">ry claim cites existing trace or log</tspan><tspan x="2166" dy="20"> IDs. If spans are missing, it retur</tspan><tspan x="2166" dy="20">ns &apos;uncertain&apos;. This service also p</tspan><tspan x="2166" dy="20">roduces the operator answer.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="496" font-size="14"><tspan x="2586" dy="0">Gemini model</tspan><tspan x="2586" dy="20">Vertex AI (Gemini)</tspan><tspan x="2586" dy="20">Managed model endpoint. The m</tspan><tspan x="2586" dy="20">odel ID, regional availability, quot</tspan><tspan x="2586" dy="20">as and access are not yet selecte</tspan><tspan x="2586" dy="20">d or verified.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Operator access</tspan><tspan x="1746" dy="20">Identity-Aware Proxy</tspan><tspan x="1746" dy="20">Authenticates operators before th</tspan><tspan x="1746" dy="20">ey reach the analysis service. Th</tspan><tspan x="1746" dy="20">ere is no anonymous access.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Incident operator</tspan><tspan x="1326" dy="20">The person who asks about an in</tspan><tspan x="1326" dy="20">cident and reviews the cited expl</tspan><tspan x="1326" dy="20">anation.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>