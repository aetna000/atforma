,436 C1640,436 1640,406 1730,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">allowed passages only</tspan></text><path d="M710,686 C800,686 800,686 890,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="560" width="210" height="26" fill="white"/><text x="800" y="578" text-anchor="middle" font-size="12"><tspan x="800" dy="0">upload/update/delete</tspan></text><path d="M1130,686 C1220,686 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="560" width="210" height="26" fill="white"/><text x="1220" y="578" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Eventarc object events</tspan></text><path d="M1550,706 C1640,706 1640,686 1730,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="550" width="210" height="26" fill="white"/><text x="1640" y="568" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">conditional index write</tspan></text><path d="M1550,436 C1640,436 1640,126 1730,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">audit events</tspan></text><g><rect x="50" y="330" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Signed-in user</tspan><tspan x="66" dy="20">Test user in a browser; not provis</tspan><tspan x="66" dy="20">ioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="340" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="366" font-size="14"><tspan x="906" dy="0">Identity Platform</tspan><tspan x="906" dy="20">Signs users in and issues ID toke</tspan><tspan x="906" dy="20">ns; subject maps to catalog ACL </tspan><tspan x="906" dy="20">groups.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Web app</tspan><tspan x="486" dy="20">Cloud Run</tspan><tspan x="486" dy="20">Authenticated chat UI; shows ans</tspan><tspan x="486" dy="20">wers with cited source revisions </tspan><tspan x="486" dy="20">or an abstention.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">RAG API</tspan><tspan x="1326" dy="20">Cloud Run</tspan><tspan x="1326" dy="20">Verifies token, filters by ACL befo</tspan><tspan x="1326" dy="20">re keyword retrieval, sends only </tspan><tspan x="1326" dy="20">allowed passages to the model, a</tspan><tspan x="1326" dy="20">bstains when unsupported, reche</tspan><tspan x="1326" dy="20">cks ACL/revision before returning</tspan><tspan x="1326" dy="20"> (suppresses on revocation).</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Document catalog</tspan><tspan x="1746" dy="20">Firestore</tspan><tspan x="1746" dy="20">Documents, keyword terms, expli</tspan><tspan x="1746" dy="20">cit ACLs and current revisions; d</tspan><tspan x="1746" dy="20">eletes remove entries.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Gemini model</tspan><tspan x="1746" dy="20">Vertex AI (Gemini)</tspan><tspan x="1746" dy="20">Writes grounded answers. Model</tspan><tspan x="1746" dy="20"> ID, region availability and quotas</tspan><tspan x="1746" dy="20"> unverified; mocked in local test.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="470" y="620" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="646" font-size="14"><tspan x="486" dy="0">Content operator</tspan><tspan x="486" dy="20">Uploads, updates and deletes sy</tspan><tspan x="486" dy="20">nthetic documents with ACL met</tspan><tspan x="486" dy="20">adata.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="620" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="646" font-size="14"><tspan x="906" dy="0">Source documents</tspan><tspan x="906" dy="20">Cloud Storage</tspan><tspan x="906" dy="20">Private versioned bucket for synt</tspan><tspan x="906" dy="20">hetic documents.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="620" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="646" font-size="14"><tspan x="1326" dy="0">Indexer</tspan><tspan x="1326" dy="20">Cloud Run</tspan><tspan x="1326" dy="20">Triggered by Eventarc on create/</tspan><tspan x="1326" dy="20">update/delete; tokenizes text and</tspan><tspan x="1326" dy="20"> conditionally writes revision + A</tspan><tspan x="1326" dy="20">CL to catalog.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Audit logs</tspan><tspan x="1746" dy="20">Cloud Logging</tspan><tspan x="1746" dy="20">Records denials, abstentions, cit</tspan><tspan x="1746" dy="20">ations and suppressions without </tspan><tspan x="1746" dy="20">document text.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>