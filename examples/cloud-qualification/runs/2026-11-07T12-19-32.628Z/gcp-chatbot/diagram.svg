<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1202" viewBox="-50 -90 2070 1202"><rect x="-50" y="-90" width="2070" height="1202" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP authenticated conversational assistant · r2</tspan></text><path d="M290,536 C380,536 380,631 470,631" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">sign in</tspan></text><path d="M290,536 C590,536 590,636 890,636" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="392" width="210" height="44" fill="white"/><text x="590" y="410" text-anchor="middle" font-size="12"><tspan x="590" dy="0">HTTPS chat with ID toke</tspan><tspan x="590" dy="18">n</tspan></text><path d="M710,631 C800,631 800,636 890,636" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="410" width="210" height="26" fill="white"/><text x="800" y="428" text-anchor="middle" font-size="12"><tspan x="800" dy="0">token verification</tspan></text><path d="M1130,636 C1220,636 1220,176 1310,176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-28" width="210" height="44" fill="white"/><text x="1220" y="-10" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read/write/delete own co</tspan><tspan x="1220" dy="18">nversations</tspan></text><path d="M1130,636 C1220,636 1220,436 1310,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="252" width="210" height="44" fill="white"/><text x="1220" y="270" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">bounded prompt / reply </tspan><tspan x="1220" dy="18">or fallback</tspan></text><path d="M1130,636 C1220,636 1220,716 1310,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="392" width="210" height="44" fill="white"/><text x="1220" y="410" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">publish approved contex</tspan><tspan x="1220" dy="18">t</tspan></text><path d="M1550,716 C1640,716 1640,676 1730,676" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="550" width="210" height="26" fill="white"/><text x="1640" y="568" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">escalation handoff</tspan></text><path d="M1130,636 C1220,636 1220,976 1310,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="410" width="210" height="26" fill="white"/><text x="1220" y="428" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">metrics &amp; audit logs</tspan></text><g><rect x="50" y="470" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Synthetic user (browser)</tspan><tspan x="66" dy="20">Synthetic test users chat through </tspan><tspan x="66" dy="20">a browser. This is a client referen</tspan><tspan x="66" dy="20">ce and is not provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="545" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="571" font-size="14"><tspan x="486" dy="0">Identity Platform</tspan><tspan x="486" dy="20">Signs in synthetic users and issu</tspan><tspan x="486" dy="20">es ID tokens. Cloud Run verifies </tspan><tspan x="486" dy="20">each token, and the user ID in th</tspan><tspan x="486" dy="20">e token decides which conversati</tspan><tspan x="486" dy="20">ons the user can access.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="470" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="496" font-size="14"><tspan x="906" dy="0">Assistant app (Cloud Run)</tspan><tspan x="906" dy="20">Cloud Run</tspan><tspan x="906" dy="20">Serves the chat UI and API. It rej</tspan><tspan x="906" dy="20">ects requests without a valid toke</tspan><tspan x="906" dy="20">n. Its internal modules build boun</tspan><tspan x="906" dy="20">ded context (a maximum number</tspan><tspan x="906" dy="20"> of turns and bytes, plus a maxim</tspan><tspan x="906" dy="20">um output token count), give a re</tspan><tspan x="906" dy="20">coverable fallback reply with retry</tspan><tspan x="906" dy="20"> if the model fails or times out, de</tspan><tspan x="906" dy="20">lete conversations on request, an</tspan><tspan x="906" dy="20">d publish an approved context sn</tspan><tspan x="906" dy="20">apshot for escalation. It takes no </tspan><tspan x="906" dy="20">external actions.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Conversation store (Firestore)</tspan><tspan x="1326" dy="20">Firestore</tspan><tspan x="1326" dy="20">Stores conversations under user</tspan><tspan x="1326" dy="20">s/{uid}/conversations. Only the Cl</tspan><tspan x="1326" dy="20">oud Run service account can acc</tspan><tspan x="1326" dy="20">ess the store, and the app filters </tspan><tspan x="1326" dy="20">every query by the verified user I</tspan><tspan x="1326" dy="20">D. Deleting a conversation remov</tspan><tspan x="1326" dy="20">es the conversation and its mess</tspan><tspan x="1326" dy="20">ages.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Gemini on Vertex AI</tspan><tspan x="1326" dy="20">Vertex AI (Gemini API)</tspan><tspan x="1326" dy="20">Model runtime that the app calls </tspan><tspan x="1326" dy="20">with its service account. The mod</tspan><tspan x="1326" dy="20">el version, regional availability an</tspan><tspan x="1326" dy="20">d quota are not verified yet. The l</tspan><tspan x="1326" dy="20">ocal test replaces this with a scri</tspan><tspan x="1326" dy="20">pted mock.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Escalation topic (Pub/Sub)</tspan><tspan x="1326" dy="20">Pub/Sub</tspan><tspan x="1326" dy="20">Carries escalation events that hol</tspan><tspan x="1326" dy="20">d the approved conversation cont</tspan><tspan x="1326" dy="20">ext snapshot. Delivery is at least </tspan><tspan x="1326" dy="20">once, so events carry an idempot</tspan><tspan x="1326" dy="20">ency key, and a dead-letter topic </tspan><tspan x="1326" dy="20">is planned.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Human support reviewer</tspan><tspan x="1746" dy="20">Person who receives escalated c</tspan><tspan x="1746" dy="20">onversations. The handling tool f</tspan><tspan x="1746" dy="20">or this person is not decided yet.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="916" font-size="14"><tspan x="1326" dy="0">Cloud Logging &amp; Monitoring</tspan><tspan x="1326" dy="20">Cloud Monitoring</tspan><tspan x="1326" dy="20">Records request, denial, model-e</tspan><tspan x="1326" dy="20">rror and escalation metrics and s</tspan><tspan x="1326" dy="20">ends alerts. Logs must not contai</tspan><tspan x="1326" dy="20">n the content of conversations.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>