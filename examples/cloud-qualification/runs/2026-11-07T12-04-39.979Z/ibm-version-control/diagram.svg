<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="682" viewBox="-50 -90 2070 682"><rect x="-50" y="-90" width="2070" height="682" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM Cloud AI pull-request reviewer · r2</tspan></text><path d="M290,146 C380,146 380,326 470,326" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-28" width="210" height="44" fill="white"/><text x="380" y="-10" text-anchor="middle" font-size="12"><tspan x="380" dy="0">PR event + read-only diff</tspan><tspan x="380" dy="18">/files fetch</tspan></text><path d="M290,416 C380,416 380,326 470,326" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">read-only token (IAM)</tspan></text><path d="M710,326 C800,326 800,176 890,176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">bounded diff context</tspan></text><path d="M1130,176 C1220,176 1220,146 1310,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-28" width="210" height="44" fill="white"/><text x="1220" y="-10" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">watsonx.ai inference req</tspan><tspan x="1220" dy="18">uest</tspan></text><path d="M1550,146 C1640,146 1640,116 1730,116" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-28" width="210" height="44" fill="white"/><text x="1640" y="-10" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">draft line-linked commen</tspan><tspan x="1640" dy="18">ts (via job)</tspan></text><path d="M710,326 C800,326 800,436 890,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">audit events</tspan></text><g><rect x="50" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Existing Git repository</tspan><tspan x="66" dy="20">Existing repository hosting the sy</tspan><tspan x="66" dy="20">nthetic pull request. Preserved u</tspan><tspan x="66" dy="20">nchanged; the reviewer gets read</tspan><tspan x="66" dy="20">-only access to the PR diff and re</tspan><tspan x="66" dy="20">levant files only. Git host to be co</tspan><tspan x="66" dy="20">nfirmed.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">PR reviewer job</tspan><tspan x="486" dy="20">IBM Cloud Code Engine</tspan><tspan x="486" dy="20">Event-triggered Code Engine job:</tspan><tspan x="486" dy="20"> fetches the authorised diff and b</tspan><tspan x="486" dy="20">ounded related files as text only (</tspan><tspan x="486" dy="20">no checkout build, no code execu</tspan><tspan x="486" dy="20">tion), builds the prompt, calls the </tspan><tspan x="486" dy="20">model and maps findings to chan</tspan><tspan x="486" dy="20">ged-line anchors. Returns draft c</tspan><tspan x="486" dy="20">omments; holds no push/merge p</tspan><tspan x="486" dy="20">ermission.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="50" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Repository read token</tspan><tspan x="66" dy="20">IBM Cloud Secrets Manager</tspan><tspan x="66" dy="20">Stores the least-privilege, read-o</tspan><tspan x="66" dy="20">nly repository credential; the job r</tspan><tspan x="66" dy="20">eads it at runtime via IAM service</tspan><tspan x="66" dy="20"> ID. No secrets on the diagram.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Scope &amp; content guard</tspan><tspan x="906" dy="20">IBM Cloud Code Engine (in revie</tspan><tspan x="906" dy="20">wer job)</tspan><tspan x="906" dy="20">Application responsibility inside t</tspan><tspan x="906" dy="20">he reviewer job: enforces file/size</tspan><tspan x="906" dy="20"> allow-list, treats repository conte</tspan><tspan x="906" dy="20">nt as untrusted (prompt-injection)</tspan><tspan x="906" dy="20">, strips secrets, and rejects com</tspan><tspan x="906" dy="20">ments not anchored to changed li</tspan><tspan x="906" dy="20">nes.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Review model</tspan><tspan x="1326" dy="20">IBM watsonx.ai</tspan><tspan x="1326" dy="20">Foundation model inference anal</tspan><tspan x="1326" dy="20">ysing the diff. Model ID, regional </tspan><tspan x="1326" dy="20">availability, plan and access are </tspan><tspan x="1326" dy="20">unverified. Local test uses scripte</tspan><tspan x="1326" dy="20">d mock responses.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Human reviewer</tspan><tspan x="1746" dy="20">Developer who reviews and appr</tspan><tspan x="1746" dy="20">oves draft line-linked comments </tspan><tspan x="1746" dy="20">before anything is published.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Audit &amp; run logs</tspan><tspan x="906" dy="20">IBM Cloud Logs + Activity Tracke</tspan><tspan x="906" dy="20">r</tspan><tspan x="906" dy="20">Records each review run (PR ref,</tspan><tspan x="906" dy="20"> files fetched, model call metadat</tspan><tspan x="906" dy="20">a, outcome) without storing sourc</tspan><tspan x="906" dy="20">e code bodies. Retention to be d</tspan><tspan x="906" dy="20">ecided.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g></g></svg>