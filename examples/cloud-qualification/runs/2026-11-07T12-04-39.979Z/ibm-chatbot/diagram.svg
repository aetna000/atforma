<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1502" viewBox="-50 -90 1650 1502"><rect x="-50" y="-90" width="1650" height="1502" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Use IBM Cloud for this synthetic… · r2</tspan></text><path d="M290,751 C380,751 380,801 470,801" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="625" width="210" height="26" fill="white"/><text x="380" y="643" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS chat</tspan></text><path d="M710,801 C800,801 800,136 890,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-28" width="210" height="44" fill="white"/><text x="800" y="-10" text-anchor="middle" font-size="12"><tspan x="800" dy="0">OIDC sign-in / token che</tspan><tspan x="800" dy="18">ck</tspan></text><path d="M710,801 C800,801 800,416 890,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">read/write own history</tspan></text><path d="M710,801 C800,801 800,716 890,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="550" width="210" height="26" fill="white"/><text x="800" y="568" text-anchor="middle" font-size="12"><tspan x="800" dy="0">bounded prompt</tspan></text><path d="M1130,716 C1220,716 1220,781 1310,781" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">inference request</tspan></text><path d="M1310,781 C1010,781 1010,801 710,801" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="625" width="210" height="26" fill="white"/><text x="1010" y="643" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">answer returned to user</tspan></text><path d="M710,801 C800,801 800,1276 890,1276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="625" width="210" height="26" fill="white"/><text x="800" y="643" text-anchor="middle" font-size="12"><tspan x="800" dy="0">handoff event</tspan></text><path d="M1130,1276 C1220,1276 1220,1256 1310,1256" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="1130" width="210" height="26" fill="white"/><text x="1220" y="1148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">notify</tspan></text><path d="M710,801 C800,801 800,996 890,996" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="625" width="210" height="26" fill="white"/><text x="800" y="643" text-anchor="middle" font-size="12"><tspan x="800" dy="0">logs &amp; audit</tspan></text><g><rect x="50" y="685" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="711" font-size="14"><tspan x="66" dy="0">Synthetic user</tspan><tspan x="66" dy="20">Synthetic test person who chats t</tspan><tspan x="66" dy="20">hrough a browser. External caller,</tspan><tspan x="66" dy="20"> not provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Sign-in</tspan><tspan x="906" dy="20">IBM Cloud App ID</tspan><tspan x="906" dy="20">Authenticates synthetic users (OI</tspan><tspan x="906" dy="20">DC) and issues tokens. The app </tspan><tspan x="906" dy="20">validates them before any chat tu</tspan><tspan x="906" dy="20">rn. Anonymous access is denied.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="685" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="711" font-size="14"><tspan x="486" dy="0">Assistant app</tspan><tspan x="486" dy="20">IBM Cloud Code Engine</tspan><tspan x="486" dy="20">Chat web app and API. It validate</tspan><tspan x="486" dy="20">s the App ID token, loads and sa</tspan><tspan x="486" dy="20">ves per-user state, applies the co</tspan><tspan x="486" dy="20">ntext bound, calls the model, retu</tspan><tspan x="486" dy="20">rns the answer and triggers escal</tspan><tspan x="486" dy="20">ation. It takes no external actions</tspan><tspan x="486" dy="20">.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Conversation state</tspan><tspan x="906" dy="20">IBM Cloudant</tspan><tspan x="906" dy="20">Per-user conversation document</tspan><tspan x="906" dy="20">s, partitioned by user ID. A user c</tspan><tspan x="906" dy="20">an only read their own partition th</tspan><tspan x="906" dy="20">rough the app.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="610" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">Context bounder</tspan><tspan x="906" dy="20">Logic in the IBM Cloud Code Eng</tspan><tspan x="906" dy="20">ine app</tspan><tspan x="906" dy="20">Requested conceptual step owne</tspan><tspan x="906" dy="20">d by the assistant app. It caps his</tspan><tspan x="906" dy="20">tory turns and tokens and screen</tspan><tspan x="906" dy="20">s input before the model call. Not</tspan><tspan x="906" dy="20"> a separate deployment.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="685" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="711" font-size="14"><tspan x="1326" dy="0">Model runtime</tspan><tspan x="1326" dy="20">IBM watsonx.ai</tspan><tspan x="1326" dy="20">Foundation model inference. The</tspan><tspan x="1326" dy="20"> model, plan, region availability a</tspan><tspan x="1326" dy="20">nd quotas still need to be chosen</tspan><tspan x="1326" dy="20"> and verified. Local tests use a sc</tspan><tspan x="1326" dy="20">ripted mock instead.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1216" font-size="14"><tspan x="906" dy="0">Escalation</tspan><tspan x="906" dy="20">IBM Cloud Event Notifications</tspan><tspan x="906" dy="20">Sends a handoff notice with a co</tspan><tspan x="906" dy="20">nversation reference when the us</tspan><tspan x="906" dy="20">er asks for a person or the app a</tspan><tspan x="906" dy="20">bstains.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1190" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1216" font-size="14"><tspan x="1326" dy="0">Human support</tspan><tspan x="1326" dy="20">Person or queue that receives es</tspan><tspan x="1326" dy="20">calations. External to the provisio</tspan><tspan x="1326" dy="20">ning scope.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="910" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="936" font-size="14"><tspan x="906" dy="0">Logs &amp; audit</tspan><tspan x="906" dy="20">IBM Cloud Logs + Activity Tracke</tspan><tspan x="906" dy="20">r</tspan><tspan x="906" dy="20">Application logs, latency, errors a</tspan><tspan x="906" dy="20">nd escalation audit, with no raw c</tspan><tspan x="906" dy="20">hat content by default.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g></g></svg>