<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="912" viewBox="-50 -90 2070 912"><rect x="-50" y="-90" width="2070" height="912" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM cited Q&amp;A assistant (synthetic qualification) · r2</tspan></text><path d="M290,406 C380,406 380,446 470,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="280" width="210" height="26" fill="white"/><text x="380" y="298" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,446 C800,446 800,436 890,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">OIDC sign-in (PKCE)</tspan></text><path d="M1130,436 C1220,436 1220,466 1310,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">token validation (JWT)</tspan></text><path d="M710,446 C1010,446 1010,466 1310,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="262" width="210" height="44" fill="white"/><text x="1010" y="280" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">question + token → cited</tspan><tspan x="1010" dy="18"> answer</tspan></text><path d="M1550,466 C1640,466 1640,146 1730,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-28" width="210" height="44" fill="white"/><text x="1640" y="-10" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">keyword search, ACL-filt</tspan><tspan x="1640" dy="18">ered</tspan></text><path d="M1550,466 C1640,466 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="262" width="210" height="44" fill="white"/><text x="1640" y="280" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">prompt with permitted pa</tspan><tspan x="1640" dy="18">ssages</tspan></text><path d="M1130,136 C1220,136 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read documents + ACLs</tspan></text><path d="M1550,156 C1640,156 1640,146 1730,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-28" width="210" height="44" fill="white"/><text x="1640" y="-10" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">write chunks, keywords, </tspan><tspan x="1640" dy="18">ACLs</tspan></text><path d="M1550,466 C1640,466 1640,696 1730,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="280" width="210" height="26" fill="white"/><text x="1640" y="298" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">audit events</tspan></text><g><rect x="50" y="340" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="366" font-size="14"><tspan x="66" dy="0">Synthetic test user (browser)</tspan><tspan x="66" dy="20">Synthetic test person using a bro</tspan><tspan x="66" dy="20">wser. This is a client reference an</tspan><tspan x="66" dy="20">d is not provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="340" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="366" font-size="14"><tspan x="486" dy="0">Q&amp;A web app</tspan><tspan x="486" dy="20">IBM Cloud Code Engine (applicat</tspan><tspan x="486" dy="20">ion)</tspan><tspan x="486" dy="20">Authenticated web app. Sends th</tspan><tspan x="486" dy="20">e user to App ID to sign in, calls t</tspan><tspan x="486" dy="20">he RAG API with the user&apos;s token</tspan><tspan x="486" dy="20">, and shows each answer with its</tspan><tspan x="486" dy="20"> citations.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Sign-in &amp; identity</tspan><tspan x="906" dy="20">IBM Cloud App ID</tspan><tspan x="906" dy="20">Handles user sign-in for synthetic</tspan><tspan x="906" dy="20"> users through OIDC with PKCE. </tspan><tspan x="906" dy="20">Issues tokens that the RAG API v</tspan><tspan x="906" dy="20">alidates, and the user identity an</tspan><tspan x="906" dy="20">d groups are used for ACL filterin</tspan><tspan x="906" dy="20">g.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">RAG API (keyword retrieval)</tspan><tspan x="1326" dy="20">IBM Cloud Code Engine (applicat</tspan><tspan x="1326" dy="20">ion)</tspan><tspan x="1326" dy="20">Validates the App ID token, runs </tspan><tspan x="1326" dy="20">bounded keyword search on the </tspan><tspan x="1326" dy="20">catalog, removes passages the u</tspan><tspan x="1326" dy="20">ser isn&apos;t allowed to see (fails clos</tspan><tspan x="1326" dy="20">ed), prompts watsonx.ai using on</tspan><tspan x="1326" dy="20">ly permitted passages, and return</tspan><tspan x="1326" dy="20">s a cited answer or declines.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Keyword catalog + ACLs</tspan><tspan x="1746" dy="20">IBM Cloudant</tspan><tspan x="1746" dy="20">Stores document chunks, keywor</tspan><tspan x="1746" dy="20">d terms, source revisions and the</tspan><tspan x="1746" dy="20"> explicit ACLs for each document</tspan><tspan x="1746" dy="20">. Only the ingestion job writes to i</tspan><tspan x="1746" dy="20">t; the RAG API reads from it.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Synthetic document store</tspan><tspan x="906" dy="20">IBM Cloud Object Storage</tspan><tspan x="906" dy="20">Private bucket holding the small </tspan><tspan x="906" dy="20">synthetic document collection an</tspan><tspan x="906" dy="20">d an ACL manifest for each docu</tspan><tspan x="906" dy="20">ment.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Ingestion job</tspan><tspan x="1326" dy="20">IBM Cloud Code Engine (job)</tspan><tspan x="1326" dy="20">Reads the documents and their A</tspan><tspan x="1326" dy="20">CLs, splits documents into chunk</tspan><tspan x="1326" dy="20">s, extracts keywords and writes t</tspan><tspan x="1326" dy="20">hem to the catalog with condition</tspan><tspan x="1326" dy="20">al writes, keeping each source&apos;s </tspan><tspan x="1326" dy="20">permissions.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">Model runtime</tspan><tspan x="1746" dy="20">IBM watsonx.ai</tspan><tspan x="1746" dy="20">Generates grounded answers fro</tspan><tspan x="1746" dy="20">m the permitted passages. In loc</tspan><tspan x="1746" dy="20">al tests the model is mocked; the </tspan><tspan x="1746" dy="20">real model ID, access, quota and</tspan><tspan x="1746" dy="20"> region still need verification.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="620" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="646" font-size="14"><tspan x="1746" dy="0">Audit &amp; logs</tspan><tspan x="1746" dy="20">IBM Cloud Logs</tspan><tspan x="1746" dy="20">Logs requests, access denials an</tspan><tspan x="1746" dy="20">d citations for audit. Does not log </tspan><tspan x="1746" dy="20">document text or tokens.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>