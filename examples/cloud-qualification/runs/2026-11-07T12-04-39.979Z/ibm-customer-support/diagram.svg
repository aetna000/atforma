<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1792" viewBox="-50 -90 1650 1792"><rect x="-50" y="-90" width="1650" height="1792" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM support assistant (synthetic qualification) · r2</tspan></text><path d="M290,676 C380,676 380,716 470,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="550" width="210" height="26" fill="white"/><text x="380" y="568" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS UI</tspan></text><path d="M710,716 C800,716 800,566 890,566" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="410" width="210" height="26" fill="white"/><text x="800" y="428" text-anchor="middle" font-size="12"><tspan x="800" dy="0">OIDC sign-in</tspan></text><path d="M710,716 C800,716 800,916 890,916" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="532" width="210" height="44" fill="white"/><text x="800" y="550" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Draft request / approved </tspan><tspan x="800" dy="18">escalation (bearer token)</tspan></text><path d="M1130,916 C1220,916 1220,1536 1310,1536" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="672" width="210" height="44" fill="white"/><text x="1220" y="690" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Read ticket; escalate aft</tspan><tspan x="1220" dy="18">er approval</tspan></text><path d="M1130,916 C1220,916 1220,976 1310,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="672" width="210" height="44" fill="white"/><text x="1220" y="690" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Read-only customer look</tspan><tspan x="1220" dy="18">up</tspan></text><path d="M1130,916 C1220,916 1220,1276 1310,1276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="690" width="210" height="26" fill="white"/><text x="1220" y="708" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">ACL-filtered retrieval</tspan></text><path d="M1130,916 C1220,916 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Grounded generation</tspan></text><path d="M1130,916 C1220,916 1220,416 1310,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Fetch credentials</tspan></text><path d="M1130,916 C1220,916 1220,146 1310,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Logs and audit events</tspan></text><path d="M710,1516 C800,1516 800,1546 890,1546" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="1380" width="210" height="26" fill="white"/><text x="800" y="1398" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Read approved articles</tspan></text><path d="M1130,1546 C1220,1546 1220,1276 1310,1276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="1110" width="210" height="26" fill="white"/><text x="1220" y="1128" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Upsert chunks + ACLs</tspan></text><g><rect x="50" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="636" font-size="14"><tspan x="66" dy="0">Support staff</tspan><tspan x="66" dy="20">Support agents using a browser. </tspan><tspan x="66" dy="20">This is an external client referenc</tspan><tspan x="66" dy="20">e, not a provisioned service.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="470" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="496" font-size="14"><tspan x="906" dy="0">Staff sign-in</tspan><tspan x="906" dy="20">IBM Cloud App ID</tspan><tspan x="906" dy="20">OIDC sign-in for staff. It issues to</tspan><tspan x="906" dy="20">kens with the staff identity and gr</tspan><tspan x="906" dy="20">oup claims used for retrieval auth</tspan><tspan x="906" dy="20">orization. Federation with a comp</tspan><tspan x="906" dy="20">any IdP is undecided.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="610" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="636" font-size="14"><tspan x="486" dy="0">Staff interface</tspan><tspan x="486" dy="20">IBM Code Engine (application)</tspan><tspan x="486" dy="20">Web UI that shows the ticket, the</tspan><tspan x="486" dy="20"> cited draft answer and customer </tspan><tspan x="486" dy="20">context. Staff edit and approve or</tspan><tspan x="486" dy="20"> reject the draft, or escalate the ti</tspan><tspan x="486" dy="20">cket. Nothing is sent without a pe</tspan><tspan x="486" dy="20">rson.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="750" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="776" font-size="14"><tspan x="906" dy="0">Assistant orchestration service</tspan><tspan x="906" dy="20">IBM Code Engine (application)</tspan><tspan x="906" dy="20">Validates the user token, reads th</tspan><tspan x="906" dy="20">e ticket and the CRM record (rea</tspan><tspan x="906" dy="20">d-only), and retrieves only knowl</tspan><tspan x="906" dy="20">edge the user is allowed to see. I</tspan><tspan x="906" dy="20">t calls watsonx.ai with the retriev</tspan><tspan x="906" dy="20">ed passages, checks that the dra</tspan><tspan x="906" dy="20">ft has citations and declines to an</tspan><tspan x="906" dy="20">swer when evidence is weak. A h</tspan><tspan x="906" dy="20">ard-coded policy blocks refund a</tspan><tspan x="906" dy="20">nd record-change actions. It write</tspan><tspan x="906" dy="20">s escalations to the ticket queue </tspan><tspan x="906" dy="20">only after staff approve.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1450" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1476" font-size="14"><tspan x="1326" dy="0">Synthetic ticket queue</tspan><tspan x="1326" dy="20">Existing synthetic ticket system. </tspan><tspan x="1326" dy="20">The assistant reads tickets and a</tspan><tspan x="1326" dy="20">dds an escalation note or reassig</tspan><tspan x="1326" dy="20">ns the ticket only after staff appro</tspan><tspan x="1326" dy="20">val.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="916" font-size="14"><tspan x="1326" dy="0">Existing CRM</tspan><tspan x="1326" dy="20">Existing CRM with customer reco</tspan><tspan x="1326" dy="20">rds. Read-only access with a sco</tspan><tspan x="1326" dy="20">ped service credential stored in S</tspan><tspan x="1326" dy="20">ecrets Manager. No write, refund </tspan><tspan x="1326" dy="20">or update permission.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1170" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1196" font-size="14"><tspan x="1326" dy="0">Knowledge index</tspan><tspan x="1326" dy="20">IBM Cloud Databases for Elastic</tspan><tspan x="1326" dy="20">search</tspan><tspan x="1326" dy="20">Holds chunks of approved knowl</tspan><tspan x="1326" dy="20">edge with ACL and approval met</tspan><tspan x="1326" dy="20">adata. Queries are filtered by the </tspan><tspan x="1326" dy="20">caller&apos;s groups (keyword or hybri</tspan><tspan x="1326" dy="20">d retrieval to be decided).</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Answer drafting model</tspan><tspan x="1326" dy="20">IBM watsonx.ai</tspan><tspan x="1326" dy="20">Foundation model that writes gro</tspan><tspan x="1326" dy="20">unded drafts from the supplied p</tspan><tspan x="1326" dy="20">assages only. The model choice, </tspan><tspan x="1326" dy="20">its availability in the region, quota</tspan><tspan x="1326" dy="20">s and plan are unverified.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="470" y="1440" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="1466" font-size="14"><tspan x="486" dy="0">Approved knowledge store</tspan><tspan x="486" dy="20">IBM Cloud Object Storage</tspan><tspan x="486" dy="20">Private bucket of approved knowl</tspan><tspan x="486" dy="20">edge articles with owner, approva</tspan><tspan x="486" dy="20">l and ACL metadata.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1440" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1466" font-size="14"><tspan x="906" dy="0">Knowledge indexing job</tspan><tspan x="906" dy="20">IBM Code Engine (job)</tspan><tspan x="906" dy="20">Scheduled job that reads approv</tspan><tspan x="906" dy="20">ed articles from Object Storage, c</tspan><tspan x="906" dy="20">hunks them and upserts them wit</tspan><tspan x="906" dy="20">h their ACLs into the index. It rem</tspan><tspan x="906" dy="20">oves articles that are no longer a</tspan><tspan x="906" dy="20">pproved.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Secrets</tspan><tspan x="1326" dy="20">IBM Cloud Secrets Manager</tspan><tspan x="1326" dy="20">Stores the CRM and ticket-queue</tspan><tspan x="1326" dy="20"> credentials and the service API k</tspan><tspan x="1326" dy="20">eys. The diagram never holds se</tspan><tspan x="1326" dy="20">cret values.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Logs and audit</tspan><tspan x="1326" dy="20">IBM Cloud Logs + Activity Tracke</tspan><tspan x="1326" dy="20">r</tspan><tspan x="1326" dy="20">Application logs and an audit trail</tspan><tspan x="1326" dy="20"> of who saw which draft, which so</tspan><tspan x="1326" dy="20">urces were cited, and every escal</tspan><tspan x="1326" dy="20">ation or approval.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>