x="3006" dy="20">IBM Watson OpenScale (watson</tspan><tspan x="3006" dy="20">x.governance)</tspan><tspan x="3006" dy="20">Tracks input/prediction drift and q</tspan><tspan x="3006" dy="20">uality against later labels; alerts tr</tspan><tspan x="3006" dy="20">igger retraining review.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="356" font-size="14"><tspan x="3006" dy="0">Work-order draft service</tspan><tspan x="3006" dy="20">IBM Code Engine</tspan><tspan x="3006" dy="20">Builds draft work orders for high-r</tspan><tspan x="3006" dy="20">isk assets with model version an</tspan><tspan x="3006" dy="20">d reasons. Drafts only; never con</tspan><tspan x="3006" dy="20">trols equipment.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="3410" y="330" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3426" y="356" font-size="14"><tspan x="3426" dy="0">Maintenance operator</tspan><tspan x="3426" dy="20">Reviews, edits, approves or rejec</tspan><tspan x="3426" dy="20">ts drafts.</tspan><tspan x="3426" dy="20">To be selected</tspan></text></g></g></svg>