roval</tspan></text><g><rect x="50" y="405" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="431" font-size="14"><tspan x="66" dy="0">Synthetic sensor histories</tspan><tspan x="66" dy="20">Synthetic telemetry generator (ex</tspan><tspan x="66" dy="20">isting caller, outside provisioning </tspan><tspan x="66" dy="20">scope).</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="125" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="151" font-size="14"><tspan x="486" dy="0">Synthetic maintenance records</tspan><tspan x="486" dy="20">Synthetic failure/repair history us</tspan><tspan x="486" dy="20">ed as labels.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="470" y="405" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="431" font-size="14"><tspan x="486" dy="0">Telemetry ingestion</tspan><tspan x="486" dy="20">IBM Event Streams</tspan><tspan x="486" dy="20">Kafka topics receive sensor readi</tspan><tspan x="486" dy="20">ngs; a consumer lands batches i</tspan><tspan x="486" dy="20">n Object Storage.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="265" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="291" font-size="14"><tspan x="906" dy="0">Raw and curated data</tspan><tspan x="906" dy="20">IBM Cloud Object Storage</tspan><tspan x="906" dy="20">Private buckets for raw telemetry,</tspan><tspan x="906" dy="20"> maintenance records, feature se</tspan><tspan x="906" dy="20">ts and evaluation reports.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="265" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="291" font-size="14"><tspan x="1326" dy="0">Feature preparation</tspan><tspan x="1326" dy="20">IBM Analytics Engine (Spark)</tspan><tspan x="1326" dy="20">Windowed sensor aggregates joi</