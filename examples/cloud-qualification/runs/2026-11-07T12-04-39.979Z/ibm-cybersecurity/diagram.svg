<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="1067" viewBox="-50 -90 2490 1067"><rect x="-50" y="-90" width="2490" height="1067" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM synthetic security alert triage · r2</tspan></text><path d="M290,201 C380,201 380,351 470,351" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="75" width="210" height="26" fill="white"/><text x="380" y="93" text-anchor="middle" font-size="12"><tspan x="380" dy="0">publish alerts</tspan></text><path d="M290,481 C380,481 380,351 470,351" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="215" width="210" height="26" fill="white"/><text x="380" y="233" text-anchor="middle" font-size="12"><tspan x="380" dy="0">asset context feed</tspan></text><path d="M710,351 C800,351 800,371 890,371" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="215" width="210" height="26" fill="white"/><text x="800" y="233" text-anchor="middle" font-size="12"><tspan x="800" dy="0">consume topic</tspan></text><path d="M1130,371 C1220,371 1220,126 1310,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">write redacted evidence</tspan></text><path d="M1550,126 C1640,126 1640,156 1730,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">index documents</tspan></text><path d="M1130,371 C1220,371 1220,541 1310,541" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="215" width="210" height="26" fill="white"/><text x="1220" y="233" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">triage request</tspan></text><path d="M1550,541 C1640,541 1640,156 1730,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="0" width="210" height="26" fill="white"/><text x="1640" y="18" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">search evidence</tspan></text><path d="M1550,541 C1640,541 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="262" width="210" height="44" fill="white"/><text x="1640" y="280" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">inference (redacted pro</tspan><tspan x="1640" dy="18">mpt)</tspan></text><path d="M1550,541 C1640,541 1640,821 1730,821" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="337" width="210" height="44" fill="white"/><text x="1640" y="355" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">verdict + proposed respo</tspan><tspan x="1640" dy="18">nse</tspan></text><path d="M1550,781 C1640,781 1640,821 1730,821" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="655" width="210" height="26" fill="white"/><text x="1640" y="673" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">review / decide</tspan></text><path d="M1550,541 C1850,541 1850,736 2150,736" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1745" y="355" width="210" height="26" fill="white"/><text x="1850" y="373" text-anchor="middle" font-size="12"><tspan x="1850" dy="0">triage audit events</tspan></text><path d="M1970,821 C2060,821 2060,736 2150,736" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="580" width="210" height="26" fill="white"/><text x="2060" y="598" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">analyst decisions</tspan></text><g><rect x="50" y="135" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="161" font-size="14"><tspan x="66" dy="0">Approved log sources (synthetic)</tspan><tspan x="66" dy="20">Existing approved sources of syn</tspan><tspan x="66" dy="20">thetic security alerts and logs. Ou</tspan><tspan x="66" dy="20">tside the provisioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="50" y="415" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="441" font-size="14"><tspan x="66" dy="0">Asset context (CMDB export)</tspan><tspan x="66" dy="20">Existing asset inventory (owner, c</tspan><tspan x="66" dy="20">riticality, location). Read-only refe</tspan><tspan x="66" dy="20">rence.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="275" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="301" font-size="14"><tspan x="486" dy="0">Alert ingestion</tspan><tspan x="486" dy="20">IBM Event Streams</tspan><tspan x="486" dy="20">Kafka topics for raw alerts and as</tspan><tspan x="486" dy="20">set updates, plus a dead-letter to</tspan><tspan x="486" dy="20">pic for alerts that fail processing.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="275" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="301" font-size="14"><tspan x="906" dy="0">Redaction &amp; normalisation</tspan><tspan x="906" dy="20">IBM Code Engine</tspan><tspan x="906" dy="20">Consumer job that normalises al</tspan><tspan x="906" dy="20">erts, joins asset context and mas</tspan><tspan x="906" dy="20">ks sensitive fields. Failures are q</tspan><tspan x="906" dy="20">uarantined. Treats all content as </tspan><tspan x="906" dy="20">untrusted.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Redacted evidence store</tspan><tspan x="1326" dy="20">IBM Cloud Object Storage</tspan><tspan x="1326" dy="20">Private bucket holding redacted e</tspan><tspan x="1326" dy="20">vidence, with object versioning a</tspan><tspan x="1326" dy="20">nd retention to be confirmed.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="60" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="86" font-size="14"><tspan x="1746" dy="0">Evidence retrieval index</tspan><tspan x="1746" dy="20">IBM Cloud Databases for OpenS</tspan><tspan x="1746" dy="20">earch</tspan><tspan x="1746" dy="20">Keyword (and later optionally vec</tspan><tspan x="1746" dy="20">tor) search over redacted eviden</tspan><tspan x="1746" dy="20">ce by alert, host and user; return</tspan><tspan x="1746" dy="20">s citations.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="415" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="441" font-size="14"><tspan x="1326" dy="0">AI triage service</tspan><tspan x="1326" dy="20">IBM Code Engine</tspan><tspan x="1326" dy="20">Retrieves evidence, calls the mo</tspan><tspan x="1326" dy="20">del, validates the structured verdi</tspan><tspan x="1326" dy="20">ct (severity, rationale, citations, pr</tspan><tspan x="1326" dy="20">oposed response) and abstains </tspan><tspan x="1326" dy="20">when evidence is insufficient. Re</tspan><tspan x="1326" dy="20">ad-only; has no permission to isol</tspan><tspan x="1326" dy="20">ate hosts, disable users or execu</tspan><tspan x="1326" dy="20">te anything.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">Triage model</tspan><tspan x="1746" dy="20">IBM watsonx.ai</tspan><tspan x="1746" dy="20">Foundation model inference. Mo</tspan><tspan x="1746" dy="20">del ID, regional availability and e</tspan><tspan x="1746" dy="20">ntitlement are unverified. A script</tspan><tspan x="1746" dy="20">ed model replaces it in local tests</tspan><tspan x="1746" dy="20">.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="715" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="741" font-size="14"><tspan x="1746" dy="0">Analyst queue &amp; case records</tspan><tspan x="1746" dy="20">IBM Cloud Databases for Postgr</tspan><tspan x="1746" dy="20">eSQL</tspan><tspan x="1746" dy="20">Stores triage cases with propose</tspan><tspan x="1746" dy="20">d responses and their status (pen</tspan><tspan x="1746" dy="20">ding, accepted, rejected). Propos</tspan><tspan x="1746" dy="20">als are never executed by the sy</tspan><tspan x="1746" dy="20">stem.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="715" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="741" font-size="14"><tspan x="1326" dy="0">SOC analyst</tspan><tspan x="1326" dy="20">Reviews each proposal and deci</tspan><tspan x="1326" dy="20">des. Any containment is done ma</tspan><tspan x="1326" dy="20">nually in existing tools.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="640" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="666" font-size="14"><tspan x="2166" dy="0">Audit trail</tspan><tspan x="2166" dy="20">IBM Cloud Logs + Activity Tracke</tspan><tspan x="2166" dy="20">r</tspan><tspan x="2166" dy="20">Records triage events, model call</tspan><tspan x="2166" dy="20">s, analyst decisions and control-p</tspan><tspan x="2166" dy="20">lane activity. Retention is to be co</tspan><tspan x="2166" dy="20">nfirmed.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>