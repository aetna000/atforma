</tspan></text><path d="M1550,576 C2060,576 2060,286 2570,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="140" width="210" height="26" fill="white"/><text x="2060" y="158" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">store raw audio</tspan></text><path d="M1550,576 C1640,576 1640,1096 1730,1096" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="420" width="210" height="26" fill="white"/><text x="1640" y="438" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">stream audio</tspan></text><path d="M1970,1096 C2060,1096 2060,1126 2150,1126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="960" width="210" height="26" fill="white"/><text x="2060" y="978" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">raw transcript</tspan></text><path d="M2390,1126 C2480,1126 2480,286 2570,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="140" width="210" height="26" fill="white"/><text x="2480" y="158" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">redacted transcript</tspan></text><path d="M2390,1126 C2480,1126 2480,1146 2570,1146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="960" width="210" height="26" fill="white"/><text x="2480" y="978" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">redacted segments</tspan></text><path d="M2810,546 C2900,546 2900,556 2990,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="420" width="210" height="26" fill="white"/><text x="2900" y="438" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">sync articles</tspan></text><path d="M2810,1146 C2900,1146 2900,556 2990,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="420" width="210" height="26" fill="white"/><text x="2900" y="438" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">retrieve passages</tspan></text><path d="M2810,1146 C2900,1146 2900,1126 2990,1126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="962" width="210" height="44" fill="white"/><text x="2900" y="980" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">grounded prompt (redact</tspan><tspan x="2900" dy="18">ed)</tspan></text><path d="M2810,1146 C2900,1146 2900,846 2990,846" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="682" width="210" height="44" fill="white"/><text x="2900" y="700" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">cited suggestions, summ</tspan><tspan x="2900" dy="18">ary &amp; CRM draft</tspan></text><path d="M2810,836 C2900,836 2900,846 2990,846" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="700" width="210" height="26" fill="white"/><text x="2900" y="718" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">agent sign-in</tspan></text><path d="M3230,846 C3320,846 3320,826 3410,826" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3215" y="700" width="210" height="26" fill="white"/><text x="3320" y="718" text-anchor="middle" font-size="12"><tspan x="3320" dy="0">review &amp; approve</tspan></text><path d="M3230,846 C3320,846 3320,136 3410,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3215" y="-28" width="210" height="44" fill="white"/><text x="3320" y="-10" text-anchor="middle" font-size="12"><tspan x="3320" dy="0">approved summary + au</tspan><tspan x="3320" dy="18">dit</tspan></text><path d="M3650,826 C3740,826 3740,826 3830,826" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3635" y="700" width="210" height="26" fill="white"/><text x="3740" y="718" text-anchor="middle" font-size="12"><tspan x="3740" dy="0">manual CRM submit</tspan></text><path d="M2810,1146 C2900,1146 2900,1406 2990,1406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="980" width="210" height="26" fill="white"/><text x="2900" y="998" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">redacted logs &amp; metrics</tspan></text><g><rect x="50" y="405" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="431" font-size="14"><tspan x="66" dy="0">Synthetic caller</tspan><tspan x="66" dy="20">Synthetic customer on the suppo</tspan><tspan x="66" dy="20">rt call. External actor, not provisio</tspan><tspan x="66" dy="20">ned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="405" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="431" font-size="14"><tspan x="486" dy="0">Existing telephony / contact centr</tspan><tspan x="486" dy="20">e</tspan><tspan x="486" dy="20">Current call platform. Plays cons</tspan><tspan x="486" dy="20">ent prompt and forks call audio st</tspan><tspan x="486" dy="20">ream to ingestion only after cons</tspan><tspan x="486" dy="20">ent. Integration contract (SIP/We</tspan><tspan x="486" dy="20">bSocket media fork) to be confir</tspan><tspan x="486" dy="20">med.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Consent gate</tspan><tspan x="906" dy="20">IBM Code Engine (app)</tspan><tspan x="906" dy="20">Records the caller&apos;s consent deci</tspan><tspan x="906" dy="20">sion with timestamp and call ID in</tspan><tspan x="906" dy="20"> Databases for PostgreSQL; bloc</tspan><tspan x="906" dy="20">ks ingestion unless consent=gran</tspan><tspan x="906" dy="20">ted. Fails closed.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="480" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="506" font-size="14"><tspan x="1326" dy="0">Audio ingestion</tspan><tspan x="1326" dy="20">IBM Code Engine (app)</tspan><tspan x="1326" dy="20">Receives consented audio strea</tspan><tspan x="1326" dy="20">m, streams it to Speech to Text a</tspan><tspan x="1326" dy="20">nd writes the raw audio to encryp</tspan><tspan x="1326" dy="20">ted Object Storage with short ret</tspan><tspan x="1326" dy="20">ention.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="200" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="226" font-size="14"><tspan x="2586" dy="0">Call audio &amp; transcripts</tspan><tspan x="2586" dy="20">IBM Cloud Object Storage</tspan><tspan x="2586" dy="20">Private bucket, Key Protect encry</tspan><tspan x="2586" dy="20">ption, lifecycle expiry (retention to</tspan><tspan x="2586" dy="20"> be agreed). Stores raw audio an</tspan><tspan x="2586" dy="20">d redacted transcripts.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="1020" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="1046" font-size="14"><tspan x="1746" dy="0">Transcription</tspan><tspan x="1746" dy="20">IBM Watson Speech to Text</tspan><tspan x="1746" dy="20">Streaming transcription with spea</tspan><tspan x="1746" dy="20">ker labels. Language/model and r</tspan><tspan x="1746" dy="20">egional availability to be verified.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="1020" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="1046" font-size="14"><tspan x="2166" dy="0">PII redaction</tspan><tspan x="2166" dy="20">IBM Code Engine (job/app) with </tspan><tspan x="2166" dy="20">entity detection</tspan><tspan x="2166" dy="20">Masks names, phone, card, addr</tspan><tspan x="2166" dy="20">ess and IDs in transcript segment</tspan><tspan x="2166" dy="20">s before any model call or storag</tspan><tspan x="2166" dy="20">e of transcripts. Unredactable se</tspan><tspan x="2166" dy="20">gments are dropped.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="1040" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="1066" font-size="14"><tspan x="2586" dy="0">Agent-assist orchestrator</tspan><tspan x="2586" dy="20">IBM Code Engine (app)</tspan><tspan x="2586" dy="20">Retrieves KB passages, prompts </tspan><tspan x="2586" dy="20">watsonx.ai for cited suggestions, </tspan><tspan x="2586" dy="20">drafts call summary and CRM dr</tspan><tspan x="2586" dy="20">aft. Abstains when no grounding f</tspan><tspan x="2586" dy="20">ound. No telephony or CRM write</tspan><tspan x="2586" dy="20"> permissions.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="1040" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="1066" font-size="14"><tspan x="3006" dy="0">Foundation model</tspan><tspan x="3006" dy="20">IBM watsonx.ai</tspan><tspan x="3006" dy="20">Generates suggestions and sum</tspan><tspan x="3006" dy="20">maries from redacted text only. M</tspan><tspan x="3006" dy="20">odel choice, entitlement and regi</tspan><tspan x="3006" dy="20">on to be verified.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="480" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="506" font-size="14"><tspan x="2586" dy="0">Existing support knowledge base</tspan><tspan x="2586" dy="20">Current support articles; synced </tspan><tspan x="2586" dy="20">as untrusted content to the searc</tspan><tspan x="2586" dy="20">h index.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="480" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="506" font-size="14"><tspan x="3006" dy="0">Grounding index</tspan><tspan x="3006" dy="20">IBM watsonx Discovery (Elastics</tspan><tspan x="3006" dy="20">earch)</tspan><tspan x="3006" dy="20">Indexes KB articles for retrieval w</tspan><tspan x="3006" dy="20">ith source IDs for citations.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="3410" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3426" y="76" font-size="14"><tspan x="3426" dy="0">Consent, summaries &amp; audit</tspan><tspan x="3426" dy="20">IBM Cloud Databases for Postgr</tspan><tspan x="3426" dy="20">eSQL</tspan><tspan x="3426" dy="20">Consent records, approved sum</tspan><tspan x="3426" dy="20">maries, CRM drafts and approval</tspan><tspan x="3426" dy="20"> audit trail.</tspan><tspan x="3426" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="760" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="786" font-size="14"><tspan x="3006" dy="0">Agent assist panel</tspan><tspan x="3006" dy="20">IBM Code Engine (web app)</tspan><tspan x="3006" dy="20">Shows live transcript, cited sugge</tspan><tspan x="3006" dy="20">stions, editable summary with Ap</tspan><tspan x="3006" dy="20">prove button, and CRM draft the </tspan><tspan x="3006" dy="20">agent copies/submits manually.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="760" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="786" font-size="14"><tspan x="2586" dy="0">Agent sign-in</tspan><tspan x="2586" dy="20">IBM Cloud App ID</tspan><tspan x="2586" dy="20">Authenticates support agents to t</tspan><tspan x="2586" dy="20">he assist panel; company IdP fed</tspan><tspan x="2586" dy="20">eration to be decided.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="3410" y="760" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3426" y="786" font-size="14"><tspan x="3426" dy="0">Support agent</tspan><tspan x="3426" dy="20">Reviews suggestions, approves s</tspan><tspan x="3426" dy="20">ummary, submits CRM update by</tspan><tspan x="3426" dy="20"> hand.</tspan><tspan x="3426" dy="20">To be selected</tspan></text></g><g><rect x="3830" y="760" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3846" y="786" font-size="14"><tspan x="3846" dy="0">Existing CRM</tspan><tspan x="3846" dy="20">Receives only agent-submitted u</tspan><tspan x="3846" dy="20">pdates; the system has no write c</tspan><tspan x="3846" dy="20">redential.</tspan><tspan x="3846" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="1320" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="1346" font-size="14"><tspan x="3006" dy="0">Logs &amp; audit</tspan><tspan x="3006" dy="20">IBM Cloud Logs + Activity Tracke</tspan><tspan x="3006" dy="20">r</tspan><tspan x="3006" dy="20">Redacted application logs, latenc</tspan><tspan x="3006" dy="20">y and abstention metrics, control-</tspan><tspan x="3006" dy="20">plane audit.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g></g></svg>