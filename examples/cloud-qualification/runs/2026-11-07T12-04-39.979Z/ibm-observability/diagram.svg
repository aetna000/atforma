<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="942" viewBox="-50 -90 2490 942"><rect x="-50" y="-90" width="2490" height="942" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM synthetic log &amp; trace incident analysis · r2</tspan></text><path d="M290,546 C380,546 380,586 470,586" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">logs + OTLP traces</tspan></text><path d="M710,586 C800,586 800,566 890,566" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="410" width="210" height="26" fill="white"/><text x="800" y="428" text-anchor="middle" font-size="12"><tspan x="800" dy="0">normalised events</tspan></text><path d="M1130,566 C1220,566 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="392" width="210" height="44" fill="white"/><text x="1220" y="410" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">index redacted events/s</tspan><tspan x="1220" dy="18">pans</tspan></text><path d="M1130,566 C1220,566 1220,406 1310,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">write redacted batches</tspan></text><path d="M1550,126 C1640,126 1640,466 1730,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-28" width="210" height="44" fill="white"/><text x="1640" y="-10" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">incident question / cited </tspan><tspan x="1640" dy="18">answer</tspan></text><path d="M1550,706 C1640,706 1640,466 1730,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="252" width="210" height="44" fill="white"/><text x="1640" y="270" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">correlated evidence by tr</tspan><tspan x="1640" dy="18">ace_id</tspan></text><path d="M1970,466 C2060,466 2060,286 2150,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="112" width="210" height="44" fill="white"/><text x="2060" y="130" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">prompt with untrusted ev</tspan><tspan x="2060" dy="18">idence</tspan></text><path d="M1970,466 C2060,466 2060,556 2150,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="270" width="210" height="26" fill="white"/><text x="2060" y="288" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">audit events + metrics</tspan></text><g><rect x="50" y="470" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Synthetic services (logs + traces)</tspan><tspan x="66" dy="20">Existing synthetic workload emitti</tspan><tspan x="66" dy="20">ng JSON logs and OpenTelemetr</tspan><tspan x="66" dy="20">y spans with shared trace IDs. O</tspan><tspan x="66" dy="20">utside provisioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="470" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="496" font-size="14"><tspan x="486" dy="0">Collection</tspan><tspan x="486" dy="20">IBM Cloud Logs Routing + Open</tspan><tspan x="486" dy="20">Telemetry Collector on Code Eng</tspan><tspan x="486" dy="20">ine</tspan><tspan x="486" dy="20">Receives logs and OTLP traces, </tspan><tspan x="486" dy="20">normalises fields (timestamp, ser</tspan><tspan x="486" dy="20">vice, trace_id, span_id) and forw</tspan><tspan x="486" dy="20">ards to redaction. Batch and retry</tspan><tspan x="486" dy="20"> with bounded buffer.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="470" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="496" font-size="14"><tspan x="906" dy="0">Redaction</tspan><tspan x="906" dy="20">IBM Cloud Code Engine (redacti</tspan><tspan x="906" dy="20">on job)</tspan><tspan x="906" dy="20">Masks secrets, tokens, emails an</tspan><tspan x="906" dy="20">d IPs before storage; records red</tspan><tspan x="906" dy="20">action counts. Original unredacte</tspan><tspan x="906" dy="20">d data is not retained.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Log &amp; trace search</tspan><tspan x="1326" dy="20">IBM Cloud Databases for OpenS</tspan><tspan x="1326" dy="20">earch</tspan><tspan x="1326" dy="20">Indexes redacted log events and </tspan><tspan x="1326" dy="20">spans by time window, service an</tspan><tspan x="1326" dy="20">d trace_id for correlation queries.</tspan><tspan x="1326" dy="20"> Retention to be agreed.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Redacted archive</tspan><tspan x="1326" dy="20">IBM Cloud Object Storage</tspan><tspan x="1326" dy="20">Immutable copy of redacted batc</tspan><tspan x="1326" dy="20">hes for replay, evaluation and au</tspan><tspan x="1326" dy="20">dit.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Incident analysis runtime</tspan><tspan x="1746" dy="20">IBM Cloud Code Engine (applicat</tspan><tspan x="1746" dy="20">ion)</tspan><tspan x="1746" dy="20">Takes an operator question, queri</tspan><tspan x="1746" dy="20">es correlated logs/spans, wraps </tspan><tspan x="1746" dy="20">evidence as quoted untrusted dat</tspan><tspan x="1746" dy="20">a, calls the model, validates that </tspan><tspan x="1746" dy="20">every claim cites an evidence ID,</tspan><tspan x="1746" dy="20"> and abstains when evidence is i</tspan><tspan x="1746" dy="20">nsufficient. Returns the explanati</tspan><tspan x="1746" dy="20">on with source evidence.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="190" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="216" font-size="14"><tspan x="2166" dy="0">Foundation model</tspan><tspan x="2166" dy="20">IBM watsonx.ai</tspan><tspan x="2166" dy="20">Generates the incident explanati</tspan><tspan x="2166" dy="20">on from supplied evidence only. </tspan><tspan x="2166" dy="20">Model choice, regional availabilit</tspan><tspan x="2166" dy="20">y and entitlement not yet verified.</tspan><tspan x="2166" dy="20"> Mocked in local tests.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Incident operator</tspan><tspan x="1326" dy="20">Person asking about an incident </tspan><tspan x="1326" dy="20">and reviewing the cited explanati</tspan><tspan x="1326" dy="20">on. Authenticated via IBM Cloud I</tspan><tspan x="1326" dy="20">AM / App ID (to be decided).</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="496" font-size="14"><tspan x="2166" dy="0">Audit &amp; monitoring</tspan><tspan x="2166" dy="20">IBM Cloud Activity Tracker / Clou</tspan><tspan x="2166" dy="20">d Monitoring</tspan><tspan x="2166" dy="20">Audits operator queries and mod</tspan><tspan x="2166" dy="20">el calls; tracks pipeline lag, redac</tspan><tspan x="2166" dy="20">tion failures and abstention rate.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>