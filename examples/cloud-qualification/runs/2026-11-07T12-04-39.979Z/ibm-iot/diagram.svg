<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="782" viewBox="-50 -90 2490 782"><rect x="-50" y="-90" width="2490" height="782" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM sensor anomaly detection qualification · r2</tspan></text><path d="M290,276 C380,276 380,286 470,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">produce events (Kafka)</tspan></text><path d="M710,286 C800,286 800,296 890,296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">consume sensor-raw</tspan></text><path d="M1130,296 C1220,296 1220,126 1310,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">rejected + reason</tspan></text><path d="M1130,296 C1220,296 1220,456 1310,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">score valid event</tspan></text><path d="M1550,456 C1640,456 1640,276 1730,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="130" width="210" height="26" fill="white"/><text x="1640" y="148" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">write score</tspan></text><path d="M1550,456 C1640,456 1640,556 1730,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">anomaly flagged</tspan></text><path d="M1970,556 C2060,556 2060,526 2150,526" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="410" width="210" height="26" fill="white"/><text x="2060" y="428" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">notify</tspan></text><g><rect x="50" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Synthetic sensor producer</tspan><tspan x="66" dy="20">Existing synthetic event generato</tspan><tspan x="66" dy="20">r. It emits {deviceId, timestamp (I</tspan><tspan x="66" dy="20">SO-8601 UTC), metric, value, uni</tspan><tspan x="66" dy="20">t}. It is outside provisioning scope</tspan><tspan x="66" dy="20">.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">Raw events topic</tspan><tspan x="486" dy="20">IBM Event Streams</tspan><tspan x="486" dy="20">Kafka topic &apos;sensor-raw&apos;, keyed b</tspan><tspan x="486" dy="20">y deviceId to keep per-device ord</tspan><tspan x="486" dy="20">er. It provides durable buffering w</tspan><tspan x="486" dy="20">ith configurable retention, so con</tspan><tspan x="486" dy="20">sumers can replay events.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="190" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">Event validator</tspan><tspan x="906" dy="20">IBM Code Engine</tspan><tspan x="906" dy="20">Consumer app that checks the sc</tspan><tspan x="906" dy="20">hema, device identity, timestamp </tspan><tspan x="906" dy="20">format and allowed units. It pass</tspan><tspan x="906" dy="20">es valid events through unchang</tspan><tspan x="906" dy="20">ed. Rejected events go to the de</tspan><tspan x="906" dy="20">ad-letter topic with a reason.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Rejected events topic</tspan><tspan x="1326" dy="20">IBM Event Streams</tspan><tspan x="1326" dy="20">Dead-letter topic &apos;sensor-rejected</tspan><tspan x="1326" dy="20">&apos; for invalid events, kept for revie</tspan><tspan x="1326" dy="20">w and replay.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Anomaly scoring</tspan><tspan x="1326" dy="20">IBM watsonx.ai Runtime deploym</tspan><tspan x="1326" dy="20">ent</tspan><tspan x="1326" dy="20">Online deployment that scores va</tspan><tspan x="1326" dy="20">lidated events and returns an ano</tspan><tspan x="1326" dy="20">maly score and flag, with deviceI</tspan><tspan x="1326" dy="20">d, timestamp and unit echoed ba</tspan><tspan x="1326" dy="20">ck. The model type is not yet cho</tspan><tspan x="1326" dy="20">sen. Locally, a scripted response </tspan><tspan x="1326" dy="20">stands in for it.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="216" font-size="14"><tspan x="1746" dy="0">Anomaly results</tspan><tspan x="1746" dy="20">IBM Cloudant</tspan><tspan x="1746" dy="20">Stores one document per scored </tspan><tspan x="1746" dy="20">event (deviceId, timestamp, valu</tspan><tspan x="1746" dy="20">e, unit, score, flag, model version</tspan><tspan x="1746" dy="20">), with idempotent ids.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="496" font-size="14"><tspan x="1746" dy="0">Operator alert</tspan><tspan x="1746" dy="20">IBM Cloud Event Notifications</tspan><tspan x="1746" dy="20">Sends an alert when an event is f</tspan><tspan x="1746" dy="20">lagged as anomalous. The destin</tspan><tspan x="1746" dy="20">ation (email or Slack, for example</tspan><tspan x="1746" dy="20">) is still to be decided.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="470" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="496" font-size="14"><tspan x="2166" dy="0">Operator</tspan><tspan x="2166" dy="20">Person who receives and handle</tspan><tspan x="2166" dy="20">s anomaly alerts.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>