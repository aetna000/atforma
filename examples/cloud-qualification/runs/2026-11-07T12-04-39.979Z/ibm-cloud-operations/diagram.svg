<svg xmlns="http://www.w3.org/2000/svg" width="3330" height="937" viewBox="-50 -90 3330 937"><rect x="-50" y="-90" width="3330" height="937" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM Cloud drift detection &amp; correction planning (synthetic) · r2</tspan></text><path d="M290,331 C380,331 380,511 470,511" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="205" width="210" height="26" fill="white"/><text x="380" y="223" text-anchor="middle" font-size="12"><tspan x="380" dy="0">read-only inventory</tspan></text><path d="M290,641 C380,641 380,511 470,511" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="345" width="210" height="26" fill="white"/><text x="380" y="363" text-anchor="middle" font-size="12"><tspan x="380" dy="0">read-only API key</tspan></text><path d="M710,511 C800,511 800,491 890,491" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="345" width="210" height="26" fill="white"/><text x="800" y="363" text-anchor="middle" font-size="12"><tspan x="800" dy="0">write versioned snapshot</tspan></text><path d="M1130,491 C1220,491 1220,341 1310,341" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="205" width="210" height="26" fill="white"/><text x="1220" y="223" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">snapshot + baseline</tspan></text><path d="M1130,491 C1220,491 1220,671 1310,671" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="345" width="210" height="26" fill="white"/><text x="1220" y="363" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">snapshot</tspan></text><path d="M1550,341 C1640,341 1640,521 1730,521" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="205" width="210" height="26" fill="white"/><text x="1640" y="223" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">drift findings</tspan></text><path d="M1550,671 C1640,671 1640,521 1730,521" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="345" width="210" height="26" fill="white"/><text x="1640" y="363" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">policy violations</tspan></text><path d="M1970,521 C2060,521 2060,436 2150,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="252" width="210" height="44" fill="white"/><text x="2060" y="270" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">proposed Terraform cha</tspan><tspan x="2060" dy="18">nge</tspan></text><path d="M2390,436 C2480,436 2480,176 2570,176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="10" width="210" height="26" fill="white"/><text x="2480" y="28" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">plan diff</tspan></text><path d="M2570,176 C2480,176 2480,116 2390,116" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="-10" width="210" height="26" fill="white"/><text x="2480" y="8" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">diff for review</tspan></text><path d="M2390,116 C2480,116 2480,176 2570,176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="-10" width="210" height="26" fill="white"/><text x="2480" y="8" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">approve / reject</tspan></text><path d="M2810,176 C2900,176 2900,481 2990,481" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="10" width="210" height="26" fill="white"/><text x="2900" y="28" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">approval decision</tspan></text><path d="M2390,436 C2690,436 2690,481 2990,481" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2585" y="270" width="210" height="26" fill="white"/><text x="2690" y="288" text-anchor="middle" font-size="12"><tspan x="2690" dy="0">plan events</tspan></text><path d="M1970,521 C2480,521 2480,481 2990,481" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="335" width="210" height="26" fill="white"/><text x="2480" y="353" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">model call log</tspan></text><g><rect x="2150" y="50" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">Platform reviewer</tspan><tspan x="2166" dy="20">The person who reviews the diff </tspan><tspan x="2166" dy="20">and approves or rejects it. Outsid</tspan><tspan x="2166" dy="20">e provisioning scope.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="50" y="265" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="291" font-size="14"><tspan x="66" dy="0">Synthetic cloud inventory</tspan><tspan x="66" dy="20">Synthetic resource inventory fixtu</tspan><tspan x="66" dy="20">re (JSON) used for qualification. </tspan><tspan x="66" dy="20">Not a real IBM account.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="50" y="545" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="571" font-size="14"><tspan x="66" dy="0">Read-only credentials</tspan><tspan x="66" dy="20">IBM Cloud Secrets Manager</tspan><tspan x="66" dy="20">Holds the API key for a read-only</tspan><tspan x="66" dy="20"> Service ID (Viewer/Reader roles </tspan><tspan x="66" dy="20">only). The system never asks for </tspan><tspan x="66" dy="20">broader credentials or creates th</tspan><tspan x="66" dy="20">em on its own.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="405" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="431" font-size="14"><tspan x="486" dy="0">Inventory collector</tspan><tspan x="486" dy="20">IBM Cloud Code Engine (job)</tspan><tspan x="486" dy="20">Read-only job that normalises th</tspan><tspan x="486" dy="20">e inventory into a snapshot. Loca</tspan><tspan x="486" dy="20">lly it reads the synthetic fixture. A</tspan><tspan x="486" dy="20">gainst a real account it would call</tspan><tspan x="486" dy="20"> read-only Resource Controller/G</tspan><tspan x="486" dy="20">lobal Search APIs.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="405" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="431" font-size="14"><tspan x="906" dy="0">Snapshot &amp; baseline store</tspan><tspan x="906" dy="20">IBM Cloud Object Storage</tspan><tspan x="906" dy="20">Versioned bucket holding invento</tspan><tspan x="906" dy="20">ry snapshots, the desired-state b</tspan><tspan x="906" dy="20">aseline, plans and diffs. No delet</tspan><tspan x="906" dy="20">e path is granted to the pipeline.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="265" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="291" font-size="14"><tspan x="1326" dy="0">Drift detector</tspan><tspan x="1326" dy="20">IBM Cloud Code Engine (job)</tspan><tspan x="1326" dy="20">Deterministic comparison of the l</tspan><tspan x="1326" dy="20">atest snapshot with the baseline. </tspan><tspan x="1326" dy="20">Emits a list of drift findings.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="545" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="571" font-size="14"><tspan x="1326" dy="0">Policy checks</tspan><tspan x="1326" dy="20">IBM Cloud Code Engine (OPA po</tspan><tspan x="1326" dy="20">licy-as-code); IBM Cloud Security</tspan><tspan x="1326" dy="20"> and Compliance Center for real </tspan><tspan x="1326" dy="20">accounts</tspan><tspan x="1326" dy="20">Evaluates the snapshot against p</tspan><tspan x="1326" dy="20">olicy rules, e.g. encryption, public</tspan><tspan x="1326" dy="20"> access and tags. Results are det</tspan><tspan x="1326" dy="20">erministic and independent of the</tspan><tspan x="1326" dy="20"> model.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="405" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="431" font-size="14"><tspan x="1746" dy="0">Correction planner</tspan><tspan x="1746" dy="20">IBM watsonx.ai</tspan><tspan x="1746" dy="20">Turns drift and policy findings int</tspan><tspan x="1746" dy="20">o a proposed Terraform change </tspan><tspan x="1746" dy="20">with an explanation. Its output is </tspan><tspan x="1746" dy="20">untrusted until it passes the polic</tspan><tspan x="1746" dy="20">y checks again. Locally a scripte</tspan><tspan x="1746" dy="20">d mock answers, which proves n</tspan><tspan x="1746" dy="20">othing about real model quality.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Plan generator (plan only)</tspan><tspan x="2166" dy="20">IBM Cloud Schematics (plan acti</tspan><tspan x="2166" dy="20">on only)</tspan><tspan x="2166" dy="20">Runs terraform plan on the propo</tspan><tspan x="2166" dy="20">sed change in a Schematics wor</tspan><tspan x="2166" dy="20">kspace. The pipeline identity is n</tspan><tspan x="2166" dy="20">ot granted apply or destroy action</tspan><tspan x="2166" dy="20">s.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="70" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="96" font-size="14"><tspan x="2586" dy="0">Diff review &amp; approval</tspan><tspan x="2586" dy="20">IBM Cloud Code Engine (app) + I</tspan><tspan x="2586" dy="20">BM Cloud App ID sign-in</tspan><tspan x="2586" dy="20">Shows the plan diff, findings and </tspan><tspan x="2586" dy="20">rationale. The reviewer approves </tspan><tspan x="2586" dy="20">or rejects, and the decision is rec</tspan><tspan x="2586" dy="20">orded. Approval does not trigger </tspan><tspan x="2586" dy="20">an apply in this scope.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="395" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="421" font-size="14"><tspan x="3006" dy="0">Audit trail</tspan><tspan x="3006" dy="20">IBM Cloud Activity Tracker Event </tspan><tspan x="3006" dy="20">Routing + IBM Cloud Logs</tspan><tspan x="3006" dy="20">Records every collection, check, </tspan><tspan x="3006" dy="20">model call, plan and approval de</tspan><tspan x="3006" dy="20">cision with actor and timestamp.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g></g></svg>