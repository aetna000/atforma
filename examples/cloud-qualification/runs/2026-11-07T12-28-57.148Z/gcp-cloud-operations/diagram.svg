ocation success and f</tspan><tspan x="1010" dy="18">ailure logs</tspan></text><g><rect x="50" y="565" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="591" font-size="14"><tspan x="66" dy="0">Reviewer</tspan><tspan x="66" dy="20">Existing human reviewer outside </tspan><tspan x="66" dy="20">provisioning scope. Reviews affe</tspan><tspan x="66" dy="20">cted resources, policy findings, e</tspan><tspan x="66" dy="20">stimated costs and recovery requ</tspan><tspan x="66" dy="20">irements. Approval records revie</tspan><tspan x="66" dy="20">w only and cannot execute chang</tspan><tspan x="66" dy="20">es; identity provider and reviewer</tspan><tspan x="66" dy="20"> authorization remain to be chose</tspan><tspan x="66" dy="20">n.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="50" y="285" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="311" font-size="14"><tspan x="66" dy="0">Synthetic inventory fixtures</tspan><tspan x="66" dy="20">Qualification input contract for su</tspan><tspan x="66" dy="20">pplied synthetic inventory; no real</tspan><tspan x="66" dy="20"> account assumed. Include resou</tspan><tspan x="66" dy="20">rce identifiers, configuration, mali</tspan><tspan x="66" dy="20">cious tags, baseline revisions an</tspan><tspan x="66" dy="20">d changed revisions for drift tests</tspan><tspan x="66" dy="20">. Fixture harness still needs imple</tspan><tspan x="66" dy="20">mentation.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Cloud inventory API reference</tspan><tspan x="906" dy="20">Cloud Asset Inventory</tspan><tspan x="906" dy="20">External Google Cloud API refere</tspan><tspan x="906" dy="20">nce, outside provisioning scope; </tspan><tspan x="906" dy="20">no approved project or account a</tspan><tspan x="906" dy="20">ccess is asserted. Future collecto</tspan><tspan x="906" dy="20">r uses only explicitly scoped asse</tspan><tspan x="906" dy="20">t read permissions. Initial qualific</tspan><tspan x="906" dy="20">ation substitutes synthetic snaps</tspan><tspan x="906" dy="20">hots and never requests broader </tspan><tspan x="906" dy="20">credentials automatically.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="415" width="240" height="412" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="441" font-size="14"><tspan x="486" dy="0">Analysis and review application</tspan><tspan x="486" dy="20">Cloud Run</tspan><tspan x="486" dy="20">One Cloud Run deployment own</tspan><tspan x="486" dy="20">s collector, schema normalization</tspan><tspan x="486" dy="20">, deterministic policy checks, pro</tspan><tspan x="486" dy="20">posal validation, authenticated re</tspan><tspan x="486" dy="20">view UI and drift checks. Tags re</tspan><tspan x="486" dy="20">main inert data. Model output can</tspan><tspan x="486" dy="20">not select commands or grant pri</tspan><tspan x="486" dy="20">vileges. Review binds to snapsho</tspan><tspan x="486" dy="20">t/policy/configuration/plan digests</tspan><tspan x="486" dy="20">; fresh reads invalidate approval </tspan><tspan x="486" dy="20">on drift, with freshness failure blo</tspan><tspan x="486" dy="20">cking approval. Returns findings </tspan><tspan x="486" dy="20">and diffs. Separate scoped invent</tspan><tspan x="486" dy="20">ory identity; no mutation privilege</tspan><tspan x="486" dy="20">s or apply route. Authentication a</tspan><tspan x="486" dy="20">n</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Correction proposal inference</tspan><tspan x="906" dy="20">Vertex AI</tspan><tspan x="906" dy="20">Vertex AI generates structured co</tspan><tspan x="906" dy="20">rrection candidates from bounde</tspan><tspan x="906" dy="20">d normalized inventory and policy</tspan><tspan x="906" dy="20"> findings. No tools, shell, deploy</tspan><tspan x="906" dy="20">ment credentials or authority to a</tspan><tspan x="906" dy="20">pprove. Application validates out</tspan><tspan x="906" dy="20">put against allowed resource typ</tspan><tspan x="906" dy="20">es and correction templates. Mod</tspan><tspan x="906" dy="20">el and regional availability require</tspan><tspan x="906" dy="20"> verification; local scripted respon</tspan><tspan x="906" dy="20">ses do not establish model qualit</tspan><tspan x="906" dy="20">y.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="630" width="240" height="412" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="656" font-size="14"><tspan x="906" dy="0">Isolated plan generation</tspan><tspan x="906" dy="20">Cloud Build</tspan><tspan x="906" dy="20">Cloud Build executes a fixed revi</tspan><tspan x="906" dy="20">ewed planning pipeline with pinn</tspan><tspan x="906" dy="20">ed tools and providers, approved </tspan><tspan x="906" dy="20">templates and no model-generat</tspan><tspan x="906" dy="20">ed executable code. Synthetic m</tspan><tspan x="906" dy="20">ode uses fixture state and no clo</tspan><tspan x="906" dy="20">ud credentials. Future live planni</tspan><tspan x="906" dy="20">ng requires separately scoped re</tspan><tspan x="906" dy="20">ad-only credentials; no apply/del</tspan><tspan x="906" dy="20">ete permissions. Reject provision</tspan><tspan x="906" dy="20">ers, external commands and uns</tspan><tspan x="906" dy="20">afe templates. Produces machine</tspan><tspan x="906" dy="20">-readable plan, affected-resource</tspan><tspan x="906" dy="20"> diff and cost estimates with sour</tspan><tspan x="906" dy="20">ces, assumptions and unknowns.</tspan><tspan x="906" dy="20"> Tool and estimati</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="780" width="240" height="352" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="806" font-size="14"><tspan x="1326" dy="0">Versioned review evidence</tspan><tspan x="1326" dy="20">Google Cloud Storage</tspan><tspan x="1326" dy="20">Private versioned Cloud Storage </tspan><tspan x="1326" dy="20">bucket holds synthetic snapshots</tspan><tspan x="1326" dy="20">, original requests, policy version</tspan><tspan x="1326" dy="20">s, model outputs, plan JSON, diff</tspan><tspan x="1326" dy="20">s, cost assumptions and approval</tspan><tspan x="1326" dy="20">/invalidation records. Conditional </tspan><tspan x="1326" dy="20">writes and digest references prev</tspan><tspan x="1326" dy="20">ent approval races. Retention, de</tspan><tspan x="1326" dy="20">letion policy and access scope re</tspan><tspan x="1326" dy="20">quire review; no public access. T</tspan><tspan x="1326" dy="20">his bucket supports the applicatio</tspan><tspan x="1326" dy="20">n and does not replace its imple</tspan><tspan x="1326" dy="20">mentation.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="50" y="930" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="956" font-size="14"><tspan x="66" dy="0">Recurring drift checks</tspan><tspan x="66" dy="20">Cloud Scheduler</tspan><tspan x="66" dy="20">Cloud Scheduler invokes the aut</tspan><tspan x="66" dy="20">henticated application drift-check </tspan><tspan x="66" dy="20">route using a dedicated invocatio</tspan><tspan x="66" dy="20">n identity. Frequency remains un</tspan><tspan x="66" dy="20">decided. The application also rec</tspan><tspan x="66" dy="20">hecks before accepting review; s</tspan><tspan x="66" dy="20">cheduled checks alone do not gu</tspan><tspan x="66" dy="20">arantee freshness.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="780" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="806" font-size="14"><tspan x="1746" dy="0">Audit and failure evidence</tspan><tspan x="1746" dy="20">Cloud Logging</tspan><tspan x="1746" dy="20">Cloud Logging receives structure</tspan><tspan x="1746" dy="20">d actor, artifact digest, policy resu</tspan><tspan x="1746" dy="20">lt, review, denial, drift and failure </tspan><tspan x="1746" dy="20">events. Configure applicable Clo</tspan><tspan x="1746" dy="20">ud Audit Logs, including required </tspan><tspan x="1746" dy="20">Data Access logs, rather than as</tspan><tspan x="1746" dy="20">suming all reads are recorded by </tspan><tspan x="1746" dy="20">default. Restrict log administratio</tspan><tspan x="1746" dy="20">n separately from reviewers; rete</tspan><tspan x="1746" dy="20">ntion and alert routing remain op</tspan><tspan x="1746" dy="20">en. Audit-write failure blocks succ</tspan><tspan x="1746" dy="20">essful review acknowledgement.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>