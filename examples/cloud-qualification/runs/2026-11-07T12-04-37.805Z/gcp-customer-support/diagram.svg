<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="1482" viewBox="-50 -90 2490 1482"><rect x="-50" y="-90" width="2490" height="1482" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP support staff assistant (synthetic qualification) · r2</tspan></text><path d="M290,536 C380,536 380,556 470,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS sign-in</tspan></text><path d="M710,556 C800,556 800,556 890,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="410" width="210" height="26" fill="white"/><text x="800" y="428" text-anchor="middle" font-size="12"><tspan x="800" dy="0">verified identity</tspan></text><path d="M1130,556 C1220,556 1220,746 1310,746" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="410" width="210" height="26" fill="white"/><text x="1220" y="428" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">ticket + draft request</tspan></text><path d="M1130,806 C1220,806 1220,746 1310,746" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">ticket context (read)</tspan></text><path d="M1550,1246 C1640,1246 1640,1256 1730,1256" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="1092" width="210" height="44" fill="white"/><text x="1640" y="1110" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">index approved docs + A</tspan><tspan x="1640" dy="18">CLs</tspan></text><path d="M1550,746 C1640,746 1640,1256 1730,1256" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="550" width="210" height="26" fill="white"/><text x="1640" y="568" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">ACL-filtered query</tspan></text><path d="M1550,746 C1640,746 1640,976 1730,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="550" width="210" height="26" fill="white"/><text x="1640" y="568" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">read customer fields</tspan></text><path d="M1970,976 C2060,976 2060,956 2150,956" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="830" width="210" height="26" fill="white"/><text x="2060" y="848" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">read-only API</tspan></text><path d="M1550,746 C1640,746 1640,696 1730,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="532" width="210" height="44" fill="white"/><text x="1640" y="550" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">grounded prompt → draf</tspan><tspan x="1640" dy="18">t</tspan></text><path d="M1550,746 C1640,746 1640,416 1730,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="252" width="210" height="44" fill="white"/><text x="1640" y="270" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">blocked/unsure → huma</tspan><tspan x="1640" dy="18">n</tspan></text><path d="M1550,746 C1640,746 1640,146 1730,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">audit events</tspan></text><path d="M1310,746 C1220,746 1220,556 1130,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="410" width="210" height="26" fill="white"/><text x="1220" y="428" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">cited draft answer</tspan></text><g><rect x="50" y="470" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Support staff</tspan><tspan x="66" dy="20">Support agents using a browser. </tspan><tspan x="66" dy="20">A client reference, not provisione</tspan><tspan x="66" dy="20">d.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="496" font-size="14"><tspan x="486" dy="0">Staff sign-in</tspan><tspan x="486" dy="20">Identity-Aware Proxy</tspan><tspan x="486" dy="20">Authenticates staff before the co</tspan><tspan x="486" dy="20">nsole and passes a verified identi</tspan><tspan x="486" dy="20">ty downstream. The identity provi</tspan><tspan x="486" dy="20">der is still to be decided.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="496" font-size="14"><tspan x="906" dy="0">Staff console</tspan><tspan x="906" dy="20">Cloud Run</tspan><tspan x="906" dy="20">Web UI. Shows the ticket, the dra</tspan><tspan x="906" dy="20">ft answer with citations, and Sen</tspan><tspan x="906" dy="20">d/Edit/Escalate actions. A human</tspan><tspan x="906" dy="20"> sends every reply.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Assistant orchestrator</tspan><tspan x="1326" dy="20">Cloud Run</tspan><tspan x="1326" dy="20">Gets ticket context, runs retrieval </tspan><tspan x="1326" dy="20">scoped to the staff member&apos;s per</tspan><tspan x="1326" dy="20">missions, calls the read-only CR</tspan><tspan x="1326" dy="20">M adapter and drafts a grounded </tspan><tspan x="1326" dy="20">answer. It abstains when no sour</tspan><tspan x="1326" dy="20">ce supports an answer. A policy c</tspan><tspan x="1326" dy="20">heck blocks refunds and record c</tspan><tspan x="1326" dy="20">hanges and routes them to escal</tspan><tspan x="1326" dy="20">ation.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="750" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="776" font-size="14"><tspan x="906" dy="0">Synthetic ticket queue</tspan><tspan x="906" dy="20">Existing synthetic ticketing syste</tspan><tspan x="906" dy="20">m that supplies open tickets.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1180" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1206" font-size="14"><tspan x="1326" dy="0">Approved knowledge</tspan><tspan x="1326" dy="20">Cloud Storage</tspan><tspan x="1326" dy="20">Private bucket holding approved </tspan><tspan x="1326" dy="20">articles and their ACL metadata.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="1170" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="1196" font-size="14"><tspan x="1746" dy="0">Authorised retrieval</tspan><tspan x="1746" dy="20">Vertex AI Search</tspan><tspan x="1746" dy="20">Indexes the approved knowledge</tspan><tspan x="1746" dy="20"> and filters results by user/group </tspan><tspan x="1746" dy="20">ACL. Returns passages with their</tspan><tspan x="1746" dy="20"> source IDs for citation.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="916" font-size="14"><tspan x="1746" dy="0">CRM read-only adapter</tspan><tspan x="1746" dy="20">Cloud Run</tspan><tspan x="1746" dy="20">Uses a read-only service account</tspan><tspan x="1746" dy="20"> to fetch only the customer fields </tspan><tspan x="1746" dy="20">this ticket needs. It has no write o</tspan><tspan x="1746" dy="20">r refund operations.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="890" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="916" font-size="14"><tspan x="2166" dy="0">Existing CRM</tspan><tspan x="2166" dy="20">The customer system of record. </tspan><tspan x="2166" dy="20">Stays outside the provisioning sc</tspan><tspan x="2166" dy="20">ope.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Answer model</tspan><tspan x="1746" dy="20">Vertex AI Gemini</tspan><tspan x="1746" dy="20">Drafts answers using only the pa</tspan><tspan x="1746" dy="20">ssages it is given. Mocked in the </tspan><tspan x="1746" dy="20">local test. The model version, reg</tspan><tspan x="1746" dy="20">ion and quota are not verified.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Human escalation</tspan><tspan x="1746" dy="20">Pub/Sub</tspan><tspan x="1746" dy="20">Routes refunds, record-change r</tspan><tspan x="1746" dy="20">equests and low-confidence case</tspan><tspan x="1746" dy="20">s to a supervisor queue/ticket not</tspan><tspan x="1746" dy="20">e. A person decides.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Audit &amp; monitoring</tspan><tspan x="1746" dy="20">Cloud Logging + Cloud Monitorin</tspan><tspan x="1746" dy="20">g</tspan><tspan x="1746" dy="20">Records who asked, which sourc</tspan><tspan x="1746" dy="20">es were used, the draft and block</tspan><tspan x="1746" dy="20">ed actions, plus latency and error</tspan><tspan x="1746" dy="20"> alerts.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>