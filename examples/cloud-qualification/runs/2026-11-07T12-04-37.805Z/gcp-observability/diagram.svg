<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="922" viewBox="-50 -90 1650 922"><rect x="-50" y="-90" width="1650" height="922" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP synthetic incident correlation · r2</tspan></text><path d="M290,136 C380,136 380,136 470,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">logs + OTel traces</tspan></text><path d="M710,136 C800,136 800,156 890,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Pub/Sub push (log sink)</tspan></text><path d="M1130,156 C1220,156 1220,146 1310,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted rows insert</tspan></text><path d="M1310,706 C1220,706 1220,476 1130,476" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="272" width="210" height="44" fill="white"/><text x="1220" y="290" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">incident question (IAP-a</tspan><tspan x="1220" dy="18">uthenticated HTTPS)</tspan></text><path d="M1130,476 C1220,476 1220,146 1310,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-18" width="210" height="44" fill="white"/><text x="1220" y="0" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read-only correlation que</tspan><tspan x="1220" dy="18">ry</tspan></text><path d="M1130,476 C1220,476 1220,436 1310,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="272" width="210" height="44" fill="white"/><text x="1220" y="290" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Vertex AI generateConte</tspan><tspan x="1220" dy="18">nt</tspan></text><path d="M1130,476 C1220,476 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="272" width="210" height="44" fill="white"/><text x="1220" y="290" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">cited explanation / abstai</tspan><tspan x="1220" dy="18">n</tspan></text><g><rect x="50" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Synthetic services (log/trace emit</tspan><tspan x="66" dy="20">ters)</tspan><tspan x="66" dy="20">Synthetic workloads emitting stru</tspan><tspan x="66" dy="20">ctured logs and OpenTelemetry tr</tspan><tspan x="66" dy="20">aces. Outside provisioning scope</tspan><tspan x="66" dy="20">.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Telemetry collection</tspan><tspan x="486" dy="20">Cloud Logging + Cloud Trace (lo</tspan><tspan x="486" dy="20">g sink to Pub/Sub)</tspan><tspan x="486" dy="20">Receives logs and traces; a log s</tspan><tspan x="486" dy="20">ink routes entries plus trace IDs t</tspan><tspan x="486" dy="20">o Pub/Sub for redaction.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Redaction worker</tspan><tspan x="906" dy="20">Cloud Run job + Sensitive Data </tspan><tspan x="906" dy="20">Protection</tspan><tspan x="906" dy="20">De-identifies secrets/PII before st</tspan><tspan x="906" dy="20">orage; keeps original record IDs f</tspan><tspan x="906" dy="20">or evidence. Raw unredacted tex</tspan><tspan x="906" dy="20">t is not persisted beyond short ret</tspan><tspan x="906" dy="20">ention.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="60" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="86" font-size="14"><tspan x="1326" dy="0">Telemetry store &amp; search</tspan><tspan x="1326" dy="20">BigQuery (redacted logs + spans</tspan><tspan x="1326" dy="20">, partitioned by time)</tspan><tspan x="1326" dy="20">Holds redacted logs and spans jo</tspan><tspan x="1326" dy="20">ined by trace_id; time-window an</tspan><tspan x="1326" dy="20">d service queries feed analysis.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="350" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="376" font-size="14"><tspan x="906" dy="0">Incident analysis runtime</tspan><tspan x="906" dy="20">Cloud Run service (service acco</tspan><tspan x="906" dy="20">unt, read-only BigQuery)</tspan><tspan x="906" dy="20">Queries correlated evidence, wra</tspan><tspan x="906" dy="20">ps log text as untrusted quoted d</tspan><tspan x="906" dy="20">ata, calls the model, validates tha</tspan><tspan x="906" dy="20">t every claim cites log/span IDs, </tspan><tspan x="906" dy="20">abstains when evidence is insuffi</tspan><tspan x="906" dy="20">cient. Returns the cited explanati</tspan><tspan x="906" dy="20">on to the operator.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="350" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="376" font-size="14"><tspan x="1326" dy="0">LLM</tspan><tspan x="1326" dy="20">Vertex AI Gemini (model ID to be</tspan><tspan x="1326" dy="20"> selected)</tspan><tspan x="1326" dy="20">Generates the explanation from s</tspan><tspan x="1326" dy="20">upplied evidence only. Regional </tspan><tspan x="1326" dy="20">availability and quota unverified.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="630" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="656" font-size="14"><tspan x="1326" dy="0">On-call operator</tspan><tspan x="1326" dy="20">Asks about an incident and recei</tspan><tspan x="1326" dy="20">ves an explanation with source lo</tspan><tspan x="1326" dy="20">g/trace evidence. Authenticated v</tspan><tspan x="1326" dy="20">ia IAP (to be confirmed).</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>