<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="622" viewBox="-50 -90 2910 622"><rect x="-50" y="-90" width="2910" height="622" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP synthetic sensor anomaly detection · r2</tspan></text><path d="M290,276 C380,276 380,296 470,296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">publish events</tspan></text><path d="M710,296 C800,296 800,316 890,316" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">streaming pull</tspan></text><path d="M1130,316 C1430,316 1430,406 1730,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1325" y="130" width="210" height="26" fill="white"/><text x="1430" y="148" text-anchor="middle" font-size="12"><tspan x="1430" dy="0">rejected + reason</tspan></text><path d="M1130,316 C1220,316 1220,166 1310,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">predict request (window)</tspan></text><path d="M1550,166 C1640,166 1640,136 1730,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-28" width="210" height="44" fill="white"/><text x="1640" y="-10" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">score → streaming inser</tspan><tspan x="1640" dy="18">t via Dataflow</tspan></text><path d="M1970,136 C2060,136 2060,276 2150,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-10" width="210" height="26" fill="white"/><text x="2060" y="8" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">anomaly metric</tspan></text><path d="M1970,406 C2060,406 2060,276 2150,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="130" width="210" height="26" fill="white"/><text x="2060" y="148" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">backlog metric</tspan></text><path d="M2390,276 C2480,276 2480,266 2570,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="130" width="210" height="26" fill="white"/><text x="2480" y="148" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">notification</tspan></text><g><rect x="50" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Synthetic sensor event generator</tspan><tspan x="66" dy="20">Existing synthetic event producer</tspan><tspan x="66" dy="20">, outside the provisioning scope. I</tspan><tspan x="66" dy="20">t sends JSON events with device</tspan><tspan x="66" dy="20">_id, event timestamp, metric, val</tspan><tspan x="66" dy="20">ue and unit.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">Ingestion topic</tspan><tspan x="486" dy="20">Google Cloud Pub/Sub</tspan><tspan x="486" dy="20">Pub/Sub topic and subscription t</tspan><tspan x="486" dy="20">hat durably buffer events with ret</tspan><tspan x="486" dy="20">ention, so they can be replayed. </tspan><tspan x="486" dy="20">The publisher authenticates with </tspan><tspan x="486" dy="20">a scoped service account. device</tspan><tspan x="486" dy="20">_id is the ordering key.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="190" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">Validation &amp; feature window</tspan><tspan x="906" dy="20">Dataflow (Apache Beam streami</tspan><tspan x="906" dy="20">ng)</tspan><tspan x="906" dy="20">Validates the schema, unit whiteli</tspan><tspan x="906" dy="20">st and timestamp sanity, and kee</tspan><tspan x="906" dy="20">ps device_id, event time and unit </tspan><tspan x="906" dy="20">unchanged. It builds per-device </tspan><tspan x="906" dy="20">windows for scoring and sends re</tspan><tspan x="906" dy="20">jected events to the dead-letter to</tspan><tspan x="906" dy="20">pic with a reason.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Rejected events (dead-letter)</tspan><tspan x="1746" dy="20">Google Cloud Pub/Sub</tspan><tspan x="1746" dy="20">Dead-letter topic for invalid or un</tspan><tspan x="1746" dy="20">processable events, kept for insp</tspan><tspan x="1746" dy="20">ection and replay.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Anomaly scoring model</tspan><tspan x="1326" dy="20">Vertex AI online prediction endpo</tspan><tspan x="1326" dy="20">int</tspan><tspan x="1326" dy="20">Returns an anomaly score and fl</tspan><tspan x="1326" dy="20">ag for each device window. In loc</tspan><tspan x="1326" dy="20">al tests it is a scripted mock. The </tspan><tspan x="1326" dy="20">real model, its training labels and</tspan><tspan x="1326" dy="20"> its thresholds are not decided ye</tspan><tspan x="1326" dy="20">t.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Anomaly results</tspan><tspan x="1746" dy="20">BigQuery</tspan><tspan x="1746" dy="20">Results table with device_id, eve</tspan><tspan x="1746" dy="20">nt timestamp, unit, value, score, f</tspan><tspan x="1746" dy="20">lag and model version, partitione</tspan><tspan x="1746" dy="20">d by event date.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="216" font-size="14"><tspan x="2166" dy="0">Operator alerting</tspan><tspan x="2166" dy="20">Cloud Monitoring alerting policy</tspan><tspan x="2166" dy="20">Raises an alert from a log-based </tspan><tspan x="2166" dy="20">metric on flagged anomalies. It al</tspan><tspan x="2166" dy="20">so alerts on dead-letter backlog a</tspan><tspan x="2166" dy="20">nd pipeline lag.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="216" font-size="14"><tspan x="2586" dy="0">Operator</tspan><tspan x="2586" dy="20">Existing on-call person who recei</tspan><tspan x="2586" dy="20">ves alerts through an email or ch</tspan><tspan x="2586" dy="20">at notification channel that is still </tspan><tspan x="2586" dy="20">to be confirmed.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>