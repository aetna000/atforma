<svg xmlns="http://www.w3.org/2000/svg" width="3750" height="642" viewBox="-50 -90 3750 642"><rect x="-50" y="-90" width="3750" height="642" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP predictive maintenance (synthetic) · r2</tspan></text><path d="M290,106 C380,106 380,116 470,116" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">publish events</tspan></text><path d="M710,116 C800,116 800,116 890,116" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">subscription</tspan></text><path d="M1130,116 C1220,116 1220,266 1310,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">windowed readings</tspan></text><path d="M710,396 C800,396 800,396 890,396" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">upload records</tspan></text><path d="M1130,396 C1220,396 1220,266 1310,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">load records/labels</tspan></text><path d="M1550,266 C1640,266 1640,191 1730,191" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="55" width="210" height="26" fill="white"/><text x="1640" y="73" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">training + holdout sets</tspan></text><path d="M1970,191 C2060,191 2060,181 2150,181" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="55" width="210" height="26" fill="white"/><text x="2060" y="73" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">register passing version</tspan></text><path d="M2390,181 C2480,181 2480,266 2570,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="55" width="210" height="26" fill="white"/><text x="2480" y="73" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">approved version</tspan></text><path d="M1550,266 C2060,266 2060,266 2570,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="130" width="210" height="26" fill="white"/><text x="2060" y="148" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">latest features</tspan></text><path d="M2810,266 C2900,266 2900,136 2990,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="-10" width="210" height="26" fill="white"/><text x="2900" y="8" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">predictions + inputs</tspan></text><path d="M2810,266 C2900,266 2900,416 2990,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="130" width="210" height="26" fill="white"/><text x="2900" y="148" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">risk scores</tspan></text><path d="M3230,416 C3320,416 3320,386 3410,386" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3215" y="270" width="210" height="26" fill="white"/><text x="3320" y="288" text-anchor="middle" font-size="12"><tspan x="3320" dy="0">draft for review</tspan></text><g><rect x="50" y="50" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Synthetic sensor histories</tspan><tspan x="66" dy="20">Synthetic sensor data publisher o</tspan><tspan x="66" dy="20">utside the provisioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Synthetic maintenance records</tspan><tspan x="486" dy="20">Synthetic historical failure and re</tspan><tspan x="486" dy="20">pair records (CSV exports) used f</tspan><tspan x="486" dy="20">or labels.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Sensor ingestion</tspan><tspan x="486" dy="20">Pub/Sub</tspan><tspan x="486" dy="20">Topic receiving sensor events; de</tspan><tspan x="486" dy="20">ad-letter topic for bad messages.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Stream processing</tspan><tspan x="906" dy="20">Dataflow</tspan><tspan x="906" dy="20">Validates, deduplicates and wind</tspan><tspan x="906" dy="20">ows sensor events into BigQuery.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Records landing bucket</tspan><tspan x="906" dy="20">Cloud Storage</tspan><tspan x="906" dy="20">Private bucket for maintenance r</tspan><tspan x="906" dy="20">ecord files, versioned.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="216" font-size="14"><tspan x="1326" dy="0">Feature preparation</tspan><tspan x="1326" dy="20">BigQuery</tspan><tspan x="1326" dy="20">Joins sensor windows with recor</tspan><tspan x="1326" dy="20">ds; builds point-in-time features a</tspan><tspan x="1326" dy="20">nd failure labels.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="115" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="141" font-size="14"><tspan x="1746" dy="0">Training + held-out evaluation</tspan><tspan x="1746" dy="20">Vertex AI Pipelines / Training</tspan><tspan x="1746" dy="20">Trains the model and evaluates o</tspan><tspan x="1746" dy="20">n a later held-out time window; re</tspan><tspan x="1746" dy="20">gisters only if gate passes.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="115" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="141" font-size="14"><tspan x="2166" dy="0">Versioned model</tspan><tspan x="2166" dy="20">Vertex AI Model Registry</tspan><tspan x="2166" dy="20">Stores model versions with evalu</tspan><tspan x="2166" dy="20">ation metrics and lineage.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="216" font-size="14"><tspan x="2586" dy="0">Maintenance risk scoring</tspan><tspan x="2586" dy="20">Vertex AI Batch Prediction</tspan><tspan x="2586" dy="20">Scores latest equipment features</tspan><tspan x="2586" dy="20"> on a schedule; writes risk scores</tspan><tspan x="2586" dy="20">.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="76" font-size="14"><tspan x="3006" dy="0">Drift monitoring</tspan><tspan x="3006" dy="20">Vertex AI Model Monitoring + Clo</tspan><tspan x="3006" dy="20">ud Monitoring</tspan><tspan x="3006" dy="20">Compares feature/prediction distr</tspan><tspan x="3006" dy="20">ibutions with training baseline; al</tspan><tspan x="3006" dy="20">erts owner.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="356" font-size="14"><tspan x="3006" dy="0">Work-order draft service</tspan><tspan x="3006" dy="20">Cloud Run</tspan><tspan x="3006" dy="20">Turns high-risk scores into draft </tspan><tspan x="3006" dy="20">work orders with evidence; drafts</tspan><tspan x="3006" dy="20"> only, no equipment control, audit</tspan><tspan x="3006" dy="20"> logged.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="3410" y="330" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3426" y="356" font-size="14"><tspan x="3426" dy="0">Maintenance operator</tspan><tspan x="3426" dy="20">Reviews and approves or rejects </tspan><tspan x="3426" dy="20">drafts.</tspan><tspan x="3426" dy="20">To be selected</tspan></text></g></g></svg>