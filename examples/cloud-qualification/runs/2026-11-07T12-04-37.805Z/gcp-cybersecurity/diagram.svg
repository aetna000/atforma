<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="932" viewBox="-50 -90 2910 932"><rect x="-50" y="-90" width="2910" height="932" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP synthetic security alert triage · r2</tspan></text><path d="M290,676 C380,676 380,686 470,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="550" width="210" height="26" fill="white"/><text x="380" y="568" text-anchor="middle" font-size="12"><tspan x="380" dy="0">publish alert</tspan></text><path d="M710,686 C800,686 800,426 890,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">push subscription</tspan></text><path d="M710,686 C800,686 800,696 890,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="550" width="210" height="26" fill="white"/><text x="800" y="568" text-anchor="middle" font-size="12"><tspan x="800" dy="0">dead-letter after retries</tspan></text><path d="M710,406 C800,406 800,426 890,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="260" width="210" height="26" fill="white"/><text x="800" y="278" text-anchor="middle" font-size="12"><tspan x="800" dy="0">approved log excerpts</tspan></text><path d="M1130,426 C1220,426 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="10" width="210" height="26" fill="white"/><text x="1220" y="28" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">write redacted records</tspan></text><path d="M1130,126 C1220,126 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">asset export</tspan></text><path d="M1130,426 C1430,426 1430,446 1730,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1325" y="270" width="210" height="26" fill="white"/><text x="1430" y="288" text-anchor="middle" font-size="12"><tspan x="1430" dy="0">redacted alert</tspan></text><path d="M1550,156 C1640,156 1640,446 1730,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="10" width="210" height="26" fill="white"/><text x="1640" y="28" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">bounded evidence query</tspan></text><path d="M1970,446 C2060,446 2060,126 2150,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-28" width="210" height="44" fill="white"/><text x="2060" y="-10" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">generateContent (structu</tspan><tspan x="2060" dy="18">red)</tspan></text><path d="M1970,446 C2060,446 2060,426 2150,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="252" width="210" height="44" fill="white"/><text x="2060" y="270" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">create case + response </tspan><tspan x="2060" dy="18">proposal</tspan></text><path d="M2390,426 C2480,426 2480,386 2570,386" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="260" width="210" height="26" fill="white"/><text x="2480" y="278" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">review via IAP</tspan></text><path d="M1970,446 C2270,446 2270,696 2570,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2165" y="252" width="210" height="44" fill="white"/><text x="2270" y="270" text-anchor="middle" font-size="12"><tspan x="2270" dy="0">log proposal + evidence </tspan><tspan x="2270" dy="18">IDs</tspan></text><path d="M2390,426 C2480,426 2480,696 2570,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="270" width="210" height="26" fill="white"/><text x="2480" y="288" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">log analyst decision</tspan></text><g><rect x="50" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="636" font-size="14"><tspan x="66" dy="0">Synthetic alert generator</tspan><tspan x="66" dy="20">Existing synthetic alert feed (outs</tspan><tspan x="66" dy="20">ide provisioning scope). Publishe</tspan><tspan x="66" dy="20">s alert JSON.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="320" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="346" font-size="14"><tspan x="486" dy="0">Approved logs</tspan><tspan x="486" dy="20">Cloud Logging (log sink)</tspan><tspan x="486" dy="20">Approved log sources exported vi</tspan><tspan x="486" dy="20">a a log sink to the evidence store</tspan><tspan x="486" dy="20">; only allow-listed logs are includ</tspan><tspan x="486" dy="20">ed.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Asset context</tspan><tspan x="906" dy="20">Cloud Asset Inventory</tspan><tspan x="906" dy="20">Asset metadata (owner, criticality,</tspan><tspan x="906" dy="20"> exposure) exported to BigQuery </tspan><tspan x="906" dy="20">for enrichment.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="636" font-size="14"><tspan x="486" dy="0">Alert ingestion topic</tspan><tspan x="486" dy="20">Pub/Sub</tspan><tspan x="486" dy="20">Receives alerts; push subscriptio</tspan><tspan x="486" dy="20">n to redaction with retry and dead</tspan><tspan x="486" dy="20">-letter policy.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="620" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="646" font-size="14"><tspan x="906" dy="0">Dead-letter topic</tspan><tspan x="906" dy="20">Pub/Sub (dead-letter)</tspan><tspan x="906" dy="20">Holds alerts that repeatedly fail p</tspan><tspan x="906" dy="20">rocessing for review; alerted via </tspan><tspan x="906" dy="20">Cloud Monitoring.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Redaction service</tspan><tspan x="906" dy="20">Cloud Run + Sensitive Data Prot</tspan><tspan x="906" dy="20">ection (DLP)</tspan><tspan x="906" dy="20">Masks personal data and secrets</tspan><tspan x="906" dy="20"> in alerts and log excerpts before </tspan><tspan x="906" dy="20">storage or model use; treats alert</tspan><tspan x="906" dy="20"> content as untrusted.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="70" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="96" font-size="14"><tspan x="1326" dy="0">Evidence store</tspan><tspan x="1326" dy="20">BigQuery</tspan><tspan x="1326" dy="20">Redacted alerts, approved log ex</tspan><tspan x="1326" dy="20">cerpts and asset context, partitio</tspan><tspan x="1326" dy="20">ned by time with retention to be a</tspan><tspan x="1326" dy="20">greed.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Triage orchestrator</tspan><tspan x="1746" dy="20">Cloud Run</tspan><tspan x="1746" dy="20">Retrieves bounded evidence for t</tspan><tspan x="1746" dy="20">he alert, calls the model, validate</tspan><tspan x="1746" dy="20">s structured output (severity, ratio</tspan><tspan x="1746" dy="20">nale, cited evidence IDs, propose</tspan><tspan x="1746" dy="20">d response). Read-only: has no p</tspan><tspan x="1746" dy="20">ermission to act on hosts or ident</tspan><tspan x="1746" dy="20">ities. Idempotent per alert ID.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">Triage model</tspan><tspan x="2166" dy="20">Vertex AI (Gemini)</tspan><tspan x="2166" dy="20">Model and regional availability to </tspan><tspan x="2166" dy="20">be verified; mocked with scripted </tspan><tspan x="2166" dy="20">responses in local tests.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Analyst case queue</tspan><tspan x="2166" dy="20">Firestore + Cloud Run console b</tspan><tspan x="2166" dy="20">ehind IAP</tspan><tspan x="2166" dy="20">Cases with triage proposal and e</tspan><tspan x="2166" dy="20">vidence; analysts accept, edit or r</tspan><tspan x="2166" dy="20">eject. No action is executed by th</tspan><tspan x="2166" dy="20">e system.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="320" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="346" font-size="14"><tspan x="2586" dy="0">Security analyst</tspan><tspan x="2586" dy="20">Reviews proposals and decides </tspan><tspan x="2586" dy="20">any response outside this system</tspan><tspan x="2586" dy="20">.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="600" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="626" font-size="14"><tspan x="2586" dy="0">Audit trail</tspan><tspan x="2586" dy="20">BigQuery audit dataset + Cloud </tspan><tspan x="2586" dy="20">Audit Logs + Cloud Monitoring</tspan><tspan x="2586" dy="20">Append-only record of inputs, evi</tspan><tspan x="2586" dy="20">dence IDs, model version, propo</tspan><tspan x="2586" dy="20">sal and analyst decision; monitori</tspan><tspan x="2586" dy="20">ng of failures and DLQ depth.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>