<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="972" viewBox="-50 -90 2070 972"><rect x="-50" y="-90" width="2070" height="972" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP synthetic RAG qualification · r2</tspan></text><path d="M290,396 C380,396 380,416 470,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="270" width="210" height="26" fill="white"/><text x="380" y="288" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS chat</tspan></text><path d="M710,416 C800,416 800,416 890,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in, ID token</tspan></text><path d="M710,416 C1010,416 1010,496 1310,496" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="252" width="210" height="44" fill="white"/><text x="1010" y="270" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">question + bearer token /</tspan><tspan x="1010" dy="18"> cited answer</tspan></text><path d="M1130,416 C1220,416 1220,496 1310,496" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="252" width="210" height="44" fill="white"/><text x="1220" y="270" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">token verification (JWKS</tspan><tspan x="1220" dy="18">)</tspan></text><path d="M1550,496 C1640,496 1640,696 1730,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="252" width="210" height="44" fill="white"/><text x="1640" y="270" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">ACL-filtered keyword qu</tspan><tspan x="1640" dy="18">ery</tspan></text><path d="M1550,496 C1640,496 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="252" width="210" height="44" fill="white"/><text x="1640" y="270" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">generateContent with all</tspan><tspan x="1640" dy="18">owed passages</tspan></text><path d="M1550,496 C1640,496 1640,146 1730,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">audit events</tspan></text><path d="M710,696 C800,696 800,706 890,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="560" width="210" height="26" fill="white"/><text x="800" y="578" text-anchor="middle" font-size="12"><tspan x="800" dy="0">upload docs + ACLs</tspan></text><path d="M1130,706 C1220,706 1220,726 1310,726" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="542" width="210" height="44" fill="white"/><text x="1220" y="560" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">object finalized (Eventar</tspan><tspan x="1220" dy="18">c)</tspan></text><path d="M1550,726 C1640,726 1640,696 1730,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="532" width="210" height="44" fill="white"/><text x="1640" y="550" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">conditional chunk + ACL </tspan><tspan x="1640" dy="18">writes</tspan></text><g><rect x="50" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Synthetic test user (browser)</tspan><tspan x="66" dy="20">Person using a browser. A client </tspan><tspan x="66" dy="20">reference, not a provisioned reso</tspan><tspan x="66" dy="20">urce.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="340" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="366" font-size="14"><tspan x="906" dy="0">Identity Platform</tspan><tspan x="906" dy="20">Signs users in with synthetic acc</tspan><tspan x="906" dy="20">ounts (MFA proposed) and issue</tspan><tspan x="906" dy="20">s ID tokens. These carry the subj</tspan><tspan x="906" dy="20">ect used for permission checks.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">RAG web app</tspan><tspan x="486" dy="20">Cloud Run</tspan><tspan x="486" dy="20">Authenticated chat UI. Gets a tok</tspan><tspan x="486" dy="20">en from Identity Platform, calls th</tspan><tspan x="486" dy="20">e RAG API and shows the answe</tspan><tspan x="486" dy="20">r with its source citations.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">RAG API (keyword retrieval + per</tspan><tspan x="1326" dy="20">mission filter)</tspan><tspan x="1326" dy="20">Cloud Run</tspan><tspan x="1326" dy="20">Checks the ID token and resolve</tspan><tspan x="1326" dy="20">s the user&apos;s groups from the catal</tspan><tspan x="1326" dy="20">og. Runs bounded keyword sear</tspan><tspan x="1326" dy="20">ch only over chunks whose ACL </tspan><tspan x="1326" dy="20">allows the user and re-checks th</tspan><tspan x="1326" dy="20">e document revision. Sends the a</tspan><tspan x="1326" dy="20">llowed passages to Gemini and r</tspan><tspan x="1326" dy="20">eturns a cited answer, or declines</tspan><tspan x="1326" dy="20"> when no sources match. If the id</tspan><tspan x="1326" dy="20">entity is unknown, it denies acces</tspan><tspan x="1326" dy="20">s.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Document &amp; ACL catalog</tspan><tspan x="1746" dy="20">Firestore</tspan><tspan x="1746" dy="20">Stores chunks, keyword terms, d</tspan><tspan x="1746" dy="20">ocument revisions, source ACLs </tspan><tspan x="1746" dy="20">and user-to-group mappings. Not</tspan><tspan x="1746" dy="20"> vector search.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Gemini model</tspan><tspan x="1746" dy="20">Vertex AI (Gemini)</tspan><tspan x="1746" dy="20">Generates grounded answers fro</tspan><tspan x="1746" dy="20">m the passages it receives. The </tspan><tspan x="1746" dy="20">model version, regional availabilit</tspan><tspan x="1746" dy="20">y and quota still need checking. L</tspan><tspan x="1746" dy="20">ocal tests use a scripted reply ins</tspan><tspan x="1746" dy="20">tead.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="470" y="620" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="646" font-size="14"><tspan x="486" dy="0">Synthetic document operator</tspan><tspan x="486" dy="20">Uploads synthetic documents an</tspan><tspan x="486" dy="20">d their explicit permission lists. A </tspan><tspan x="486" dy="20">caller outside the provisioning sc</tspan><tspan x="486" dy="20">ope.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="620" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="646" font-size="14"><tspan x="906" dy="0">Synthetic source documents</tspan><tspan x="906" dy="20">Cloud Storage</tspan><tspan x="906" dy="20">Private bucket for synthetic UTF-</tspan><tspan x="906" dy="20">8 documents plus ACL metadata.</tspan><tspan x="906" dy="20"> Uniform bucket-level access; no </tspan><tspan x="906" dy="20">public access.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="620" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="646" font-size="14"><tspan x="1326" dy="0">Ingestion job</tspan><tspan x="1326" dy="20">Cloud Run jobs</tspan><tspan x="1326" dy="20">Reads new documents, checks t</tspan><tspan x="1326" dy="20">heir size, splits them into chunks </tspan><tspan x="1326" dy="20">and extracts keywords. Writes ch</tspan><tspan x="1326" dy="20">unks and the source&apos;s ACL to the</tspan><tspan x="1326" dy="20"> catalog using conditional, revisio</tspan><tspan x="1326" dy="20">n-aware writes.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Audit &amp; monitoring</tspan><tspan x="1746" dy="20">Cloud Logging / Cloud Monitoring</tspan><tspan x="1746" dy="20">Records who asked, which docu</tspan><tspan x="1746" dy="20">ment IDs were allowed or denied,</tspan><tspan x="1746" dy="20"> and model latency and errors. It </tspan><tspan x="1746" dy="20">does not store prompt text by def</tspan><tspan x="1746" dy="20">ault.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>