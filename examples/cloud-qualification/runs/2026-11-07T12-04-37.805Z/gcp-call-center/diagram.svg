<svg xmlns="http://www.w3.org/2000/svg" width="3330" height="1042" viewBox="-50 -90 3330 1042"><rect x="-50" y="-90" width="3330" height="1042" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Agent assist for synthetic support calls (Google Cloud) · r2</tspan></text><path d="M290,566 C380,566 380,556 470,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">caller consent prompt</tspan></text><path d="M710,556 C800,556 800,436 890,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="280" width="210" height="26" fill="white"/><text x="800" y="298" text-anchor="middle" font-size="12"><tspan x="800" dy="0">consented audio only</tspan></text><path d="M1130,436 C1220,436 1220,436 1310,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">streaming recognize</tspan></text><path d="M1550,436 C1640,436 1640,426 1730,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="280" width="210" height="26" fill="white"/><text x="1640" y="298" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">transcript segments</tspan></text><path d="M1970,426 C2060,426 2060,436 2150,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="270" width="210" height="26" fill="white"/><text x="2060" y="288" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">redacted transcript</tspan></text><path d="M2390,436 C2480,436 2480,126 2570,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="-28" width="210" height="44" fill="white"/><text x="2480" y="-10" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">search grounding passa</tspan><tspan x="2480" dy="18">ges</tspan></text><path d="M2390,436 C2480,436 2480,416 2570,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="252" width="210" height="44" fill="white"/><text x="2480" y="270" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">generateContent (redact</tspan><tspan x="2480" dy="18">ed)</tspan></text><path d="M2390,436 C2480,436 2480,676 2570,676" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="252" width="210" height="44" fill="white"/><text x="2480" y="270" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">cited suggestions, draft s</tspan><tspan x="2480" dy="18">ummary &amp; CRM draft</tspan></text><path d="M2810,676 C2900,676 2900,556 2990,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="392" width="210" height="44" fill="white"/><text x="2900" y="410" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">approved summary / dra</tspan><tspan x="2900" dy="18">ft</tspan></text><path d="M2810,676 C2900,676 2900,826 2990,826" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="532" width="210" height="44" fill="white"/><text x="2900" y="550" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">agent applies draft manu</tspan><tspan x="2900" dy="18">ally</tspan></text><path d="M710,556 C1430,556 1430,696 2150,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1325" y="410" width="210" height="26" fill="white"/><text x="1430" y="428" text-anchor="middle" font-size="12"><tspan x="1430" dy="0">consent events</tspan></text><path d="M1970,426 C2060,426 2060,696 2150,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="280" width="210" height="26" fill="white"/><text x="2060" y="298" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">redaction findings</tspan></text><g><rect x="50" y="470" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Synthetic call / telephony source</tspan><tspan x="66" dy="20">Synthetic audio stream (test fixtur</tspan><tspan x="66" dy="20">e)</tspan><tspan x="66" dy="20">An existing or synthetic call audio</tspan><tspan x="66" dy="20"> source outside provisioning scop</tspan><tspan x="66" dy="20">e. It receives calls only; the syste</tspan><tspan x="66" dy="20">m never places calls.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="496" font-size="14"><tspan x="486" dy="0">Consent gate</tspan><tspan x="486" dy="20">Cloud Run (consent service) + Fi</tspan><tspan x="486" dy="20">restore consent record</tspan><tspan x="486" dy="20">Records the caller&apos;s consent with</tspan><tspan x="486" dy="20"> a timestamp. If consent is missin</tspan><tspan x="486" dy="20">g, the audio stops here.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="366" font-size="14"><tspan x="906" dy="0">Audio ingestion</tspan><tspan x="906" dy="20">Cloud Run streaming gateway</tspan><tspan x="906" dy="20">Receives consented audio over g</tspan><tspan x="906" dy="20">RPC/WebSocket and streams it t</tspan><tspan x="906" dy="20">o Speech-to-Text. Raw audio is n</tspan><tspan x="906" dy="20">ot kept unless a retention rule is </tspan><tspan x="906" dy="20">agreed.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">Transcription</tspan><tspan x="1326" dy="20">Cloud Speech-to-Text V2 (stream</tspan><tspan x="1326" dy="20">ing)</tspan><tspan x="1326" dy="20">Streaming transcription in near re</tspan><tspan x="1326" dy="20">al time. Language and model cho</tspan><tspan x="1326" dy="20">ice depend on the region; availab</tspan><tspan x="1326" dy="20">ility is unverified.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="340" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">PII redaction</tspan><tspan x="1746" dy="20">Sensitive Data Protection (DLP A</tspan><tspan x="1746" dy="20">PI) de-identify</tspan><tspan x="1746" dy="20">Removes personal details from tr</tspan><tspan x="1746" dy="20">anscript segments before any mo</tspan><tspan x="1746" dy="20">del, storage or log sees them.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="76" font-size="14"><tspan x="2586" dy="0">Support knowledge base</tspan><tspan x="2586" dy="20">Vertex AI Search data store</tspan><tspan x="2586" dy="20">Approved support articles used t</tspan><tspan x="2586" dy="20">o ground suggestions. The sourc</tspan><tspan x="2586" dy="20">e content is still to be confirmed.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Agent-assist orchestrator</tspan><tspan x="2166" dy="20">Cloud Run (orchestrator)</tspan><tspan x="2166" dy="20">Takes the redacted transcript, ret</tspan><tspan x="2166" dy="20">rieves passages and asks Gemin</tspan><tspan x="2166" dy="20">i for cited suggestions, a summar</tspan><tspan x="2166" dy="20">y and a CRM draft. It has no tool </tspan><tspan x="2166" dy="20">for placing calls or writing to the </tspan><tspan x="2166" dy="20">CRM.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="356" font-size="14"><tspan x="2586" dy="0">Gemini model</tspan><tspan x="2586" dy="20">Gemini on Vertex AI</tspan><tspan x="2586" dy="20">Generates suggestions and sum</tspan><tspan x="2586" dy="20">maries. Model version, quotas an</tspan><tspan x="2586" dy="20">d regional access are unverified; </tspan><tspan x="2586" dy="20">local tests use scripted replies.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="636" font-size="14"><tspan x="2586" dy="0">Support agent desktop</tspan><tspan x="2586" dy="20">The support agent (a person) see</tspan><tspan x="2586" dy="20">s suggestions and edits/approves</tspan><tspan x="2586" dy="20"> the summary and the CRM draft.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="496" font-size="14"><tspan x="3006" dy="0">Approved summaries &amp; CRM dra</tspan><tspan x="3006" dy="20">fts</tspan><tspan x="3006" dy="20">Firestore</tspan><tspan x="3006" dy="20">Stores redacted summaries and </tspan><tspan x="3006" dy="20">CRM drafts with their approval st</tspan><tspan x="3006" dy="20">atus and who approved them.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="750" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="776" font-size="14"><tspan x="3006" dy="0">Existing CRM</tspan><tspan x="3006" dy="20">The existing CRM, outside provis</tspan><tspan x="3006" dy="20">ioning scope. The system has no</tspan><tspan x="3006" dy="20"> write access; the agent applies a</tspan><tspan x="3006" dy="20">n approved draft by hand.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="610" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="636" font-size="14"><tspan x="2166" dy="0">Audit &amp; monitoring</tspan><tspan x="2166" dy="20">Cloud Logging + Cloud Monitorin</tspan><tspan x="2166" dy="20">g</tspan><tspan x="2166" dy="20">Logs consent decisions, redactio</tspan><tspan x="2166" dy="20">n results, approvals and errors, w</tspan><tspan x="2166" dy="20">ithout raw personal data.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>