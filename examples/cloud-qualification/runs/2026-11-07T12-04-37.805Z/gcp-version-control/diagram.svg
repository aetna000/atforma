<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="922" viewBox="-50 -90 2490 922"><rect x="-50" y="-90" width="2490" height="922" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP pull request review assistant · r2</tspan></text><path d="M290,416 C380,416 380,201 470,201" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="55" width="210" height="26" fill="white"/><text x="380" y="73" text-anchor="middle" font-size="12"><tspan x="380" dy="0">signed PR webhook</tspan></text><path d="M710,201 C800,201 800,191 890,191" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="55" width="210" height="26" fill="white"/><text x="800" y="73" text-anchor="middle" font-size="12"><tspan x="800" dy="0">publish review job</tspan></text><path d="M1130,191 C1220,191 1220,446 1310,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="55" width="210" height="26" fill="white"/><text x="1220" y="73" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">push subscription</tspan></text><path d="M1130,481 C1220,481 1220,446 1310,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read-only token</tspan></text><path d="M290,416 C800,416 800,446 1310,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="252" width="210" height="44" fill="white"/><text x="800" y="270" text-anchor="middle" font-size="12"><tspan x="800" dy="0">authorised diff and files (</tspan><tspan x="800" dy="18">read-only)</tspan></text><path d="M1550,446 C1640,446 1640,136 1730,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-28" width="210" height="44" fill="white"/><text x="1640" y="-10" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">Vertex AI generateConte</tspan><tspan x="1640" dy="18">nt</tspan></text><path d="M1550,446 C1640,446 1640,426 1730,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">proposed findings</tspan></text><path d="M1970,426 C2060,426 2060,426 2150,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="270" width="210" height="26" fill="white"/><text x="2060" y="288" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">line-linked drafts</tspan></text><path d="M1550,446 C1640,446 1640,696 1730,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">logs and metrics</tspan></text><g><rect x="50" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Existing code repository</tspan><tspan x="66" dy="20">Existing repository host, preserve</tspan><tspan x="66" dy="20">d unchanged. It sends pull reque</tspan><tspan x="66" dy="20">st webhooks and serves the diff a</tspan><tspan x="66" dy="20">nd changed files to a read-only to</tspan><tspan x="66" dy="20">ken.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="115" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="141" font-size="14"><tspan x="486" dy="0">Webhook receiver</tspan><tspan x="486" dy="20">Cloud Run</tspan><tspan x="486" dy="20">Checks the webhook signature, a</tspan><tspan x="486" dy="20">ccepts only allowed repositories </tspan><tspan x="486" dy="20">and events, and queues a review</tspan><tspan x="486" dy="20"> job. It does no analysis itself.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="115" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="141" font-size="14"><tspan x="906" dy="0">Review job queue</tspan><tspan x="906" dy="20">Pub/Sub</tspan><tspan x="906" dy="20">Separates intake from processin</tspan><tspan x="906" dy="20">g. Retries jobs, and a dead-letter </tspan><tspan x="906" dy="20">topic catches failed ones.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Review worker</tspan><tspan x="1326" dy="20">Cloud Run</tspan><tspan x="1326" dy="20">Reads only the authorised diff an</tspan><tspan x="1326" dy="20">d relevant changed files through t</tspan><tspan x="1326" dy="20">he read-only API. It never clones,</tspan><tspan x="1326" dy="20"> builds or executes repository co</tspan><tspan x="1326" dy="20">de. It treats repository content as </tspan><tspan x="1326" dy="20">untrusted data, calls Gemini, and</tspan><tspan x="1326" dy="20"> maps findings to changed lines.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="395" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="421" font-size="14"><tspan x="906" dy="0">Read-only repository token</tspan><tspan x="906" dy="20">Secret Manager</tspan><tspan x="906" dy="20">Holds the read-only repository cr</tspan><tspan x="906" dy="20">edential, readable only by the wo</tspan><tspan x="906" dy="20">rker&apos;s service account. No secret </tspan><tspan x="906" dy="20">values appear in this diagram.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Gemini model</tspan><tspan x="1746" dy="20">Vertex AI (Gemini)</tspan><tspan x="1746" dy="20">Analyses the diff. Model choice, r</tspan><tspan x="1746" dy="20">egional availability and quota are </tspan><tspan x="1746" dy="20">not verified. Local tests use script</tspan><tspan x="1746" dy="20">ed replies.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Comment guard</tspan><tspan x="1746" dy="20">Cloud Run (worker module)</tspan><tspan x="1746" dy="20">Part of the worker deployment. It </tspan><tspan x="1746" dy="20">rejects comments that point outsi</tspan><tspan x="1746" dy="20">de changed lines, any proposed </tspan><tspan x="1746" dy="20">actions such as push, merge or r</tspan><tspan x="1746" dy="20">un, and leaked secrets.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Draft review comments</tspan><tspan x="2166" dy="20">Firestore</tspan><tspan x="2166" dy="20">Stores draft comments keyed by </tspan><tspan x="2166" dy="20">pull request, commit and file line, </tspan><tspan x="2166" dy="20">with a status for each job. Wheth</tspan><tspan x="2166" dy="20">er they get posted is an open dec</tspan><tspan x="2166" dy="20">ision.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Logs and audit</tspan><tspan x="1746" dy="20">Cloud Logging and Cloud Monito</tspan><tspan x="1746" dy="20">ring</tspan><tspan x="1746" dy="20">Records jobs, model calls, guard </tspan><tspan x="1746" dy="20">rejections and failures without sto</tspan><tspan x="1746" dy="20">ring source code in logs.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>