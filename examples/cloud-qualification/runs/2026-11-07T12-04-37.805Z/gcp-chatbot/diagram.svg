<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1502" viewBox="-50 -90 2070 1502"><rect x="-50" y="-90" width="2070" height="1502" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP authenticated conversational assistant · r2</tspan></text><path d="M290,676 C380,676 380,771 470,771" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="550" width="210" height="26" fill="white"/><text x="380" y="568" text-anchor="middle" font-size="12"><tspan x="380" dy="0">sign in</tspan></text><path d="M290,676 C590,676 590,746 890,746" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="532" width="210" height="44" fill="white"/><text x="590" y="550" text-anchor="middle" font-size="12"><tspan x="590" dy="0">HTTPS chat with ID toke</tspan><tspan x="590" dy="18">n</tspan></text><path d="M710,771 C800,771 800,746 890,746" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="550" width="210" height="26" fill="white"/><text x="800" y="568" text-anchor="middle" font-size="12"><tspan x="800" dy="0">token verification</tspan></text><path d="M1130,746 C1220,746 1220,426 1310,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="252" width="210" height="44" fill="white"/><text x="1220" y="270" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read/write own conversa</tspan><tspan x="1220" dy="18">tion</tspan></text><path d="M1130,746 C1220,746 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">trim to bounded context</tspan></text><path d="M1130,746 C1220,746 1220,726 1310,726" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="532" width="210" height="44" fill="white"/><text x="1220" y="550" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">generateContent (bound</tspan><tspan x="1220" dy="18">ed prompt)</tspan></text><path d="M1130,746 C1220,746 1220,996 1310,996" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">publish escalation</tspan></text><path d="M1550,996 C1640,996 1640,966 1730,966" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="830" width="210" height="26" fill="white"/><text x="1640" y="848" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">review handoff</tspan></text><path d="M1130,746 C1220,746 1220,1266 1310,1266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">logs &amp; metrics</tspan></text><g><rect x="50" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="636" font-size="14"><tspan x="66" dy="0">Synthetic user (browser)</tspan><tspan x="66" dy="20">Synthetic test user in a browser. </tspan><tspan x="66" dy="20">This is a client reference and is n</tspan><tspan x="66" dy="20">ot provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="685" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="711" font-size="14"><tspan x="486" dy="0">Sign-in</tspan><tspan x="486" dy="20">Identity Platform</tspan><tspan x="486" dy="20">Issues ID tokens to synthetic use</tspan><tspan x="486" dy="20">rs. Self sign-up is off and account</tspan><tspan x="486" dy="20">s are created by an admin. MFA </tspan><tspan x="486" dy="20">policy is still to be decided.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="610" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">Chat application</tspan><tspan x="906" dy="20">Cloud Run</tspan><tspan x="906" dy="20">Serves the chat UI and API, verifi</tspan><tspan x="906" dy="20">es the Identity Platform token on </tspan><tspan x="906" dy="20">every request and loads that user</tspan><tspan x="906" dy="20">&apos;s conversation. It applies bounde</tspan><tspan x="906" dy="20">d context (last N turns plus a toke</tspan><tspan x="906" dy="20">n cap), calls the model and return</tspan><tspan x="906" dy="20">s the answer. It decides on escal</tspan><tspan x="906" dy="20">ation. It takes no external actions</tspan><tspan x="906" dy="20">.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Bounded context policy</tspan><tspan x="1326" dy="20">Cloud Run (in-app module)</tspan><tspan x="1326" dy="20">A conceptual node owned by the </tspan><tspan x="1326" dy="20">Chat application, not a separate </tspan><tspan x="1326" dy="20">deployment. It trims history to a t</tspan><tspan x="1326" dy="20">urn and token budget, strips othe</tspan><tspan x="1326" dy="20">r users&apos; data and treats user text </tspan><tspan x="1326" dy="20">as untrusted.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Conversation state</tspan><tspan x="1326" dy="20">Firestore (Native mode)</tspan><tspan x="1326" dy="20">Per-user conversation document</tspan><tspan x="1326" dy="20">s keyed by the verified user ID. O</tspan><tspan x="1326" dy="20">nly the app&apos;s service account can</tspan><tspan x="1326" dy="20"> read or write them. The retention</tspan><tspan x="1326" dy="20"> period is still to be decided.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Model runtime</tspan><tspan x="1326" dy="20">Vertex AI (Gemini)</tspan><tspan x="1326" dy="20">Gemini model called through the </tspan><tspan x="1326" dy="20">Vertex AI API using the app&apos;s ser</tspan><tspan x="1326" dy="20">vice account. The model ID, regi</tspan><tspan x="1326" dy="20">onal availability and quotas have </tspan><tspan x="1326" dy="20">not been verified. In the local test</tspan><tspan x="1326" dy="20"> it is replaced by scripted mock re</tspan><tspan x="1326" dy="20">sponses.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="890" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="916" font-size="14"><tspan x="1326" dy="0">Escalation queue</tspan><tspan x="1326" dy="20">Pub/Sub</tspan><tspan x="1326" dy="20">The app publishes an escalation </tspan><tspan x="1326" dy="20">event (conversation ID and reaso</tspan><tspan x="1326" dy="20">n) when the model abstains, the </tspan><tspan x="1326" dy="20">user asks for a person or the poli</tspan><tspan x="1326" dy="20">cy triggers. A dead-letter topic ca</tspan><tspan x="1326" dy="20">tches failed deliveries.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="890" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="916" font-size="14"><tspan x="1746" dy="0">Human support reviewer</tspan><tspan x="1746" dy="20">A person who picks up escalation</tspan><tspan x="1746" dy="20">s. The review tool is to be decide</tspan><tspan x="1746" dy="20">d. Nothing is sent automatically o</tspan><tspan x="1746" dy="20">utside the system.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1170" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1196" font-size="14"><tspan x="1326" dy="0">Logs &amp; monitoring</tspan><tspan x="1326" dy="20">Cloud Logging &amp; Cloud Monitorin</tspan><tspan x="1326" dy="20">g</tspan><tspan x="1326" dy="20">Request, latency, model-error an</tspan><tspan x="1326" dy="20">d escalation-rate logs and metric</tspan><tspan x="1326" dy="20">s. Prompt contents are excluded </tspan><tspan x="1326" dy="20">by default.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>