<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="737" viewBox="-50 -90 2910 737"><rect x="-50" y="-90" width="2910" height="737" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP drift and correction advisor (synthetic) · r2</tspan></text><path d="M290,176 C380,176 380,231 470,231" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">read-only snapshot read</tspan></text><path d="M710,231 C800,231 800,241 890,241" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="65" width="210" height="26" fill="white"/><text x="800" y="83" text-anchor="middle" font-size="12"><tspan x="800" dy="0">drift findings</tspan></text><path d="M1130,241 C1220,241 1220,231 1310,231" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="55" width="210" height="26" fill="white"/><text x="1220" y="73" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">confirmed violations</tspan></text><path d="M1310,231 C1220,231 1220,241 1130,241" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="37" width="210" height="44" fill="white"/><text x="1220" y="55" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">proposed plan for re-che</tspan><tspan x="1220" dy="18">ck</tspan></text><path d="M1550,231 C1640,231 1640,201 1730,201" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="37" width="210" height="44" fill="white"/><text x="1640" y="55" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">plan + diff (policy-passed</tspan><tspan x="1640" dy="18">)</tspan></text><path d="M1970,201 C2060,201 2060,296 2150,296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="55" width="210" height="26" fill="white"/><text x="2060" y="73" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">diff hash for review</tspan></text><path d="M290,416 C1220,416 1220,296 2150,296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">approve / reject</tspan></text><path d="M290,416 C380,416 380,231 470,231" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="65" width="210" height="26" fill="white"/><text x="380" y="83" text-anchor="middle" font-size="12"><tspan x="380" dy="0">start analysis run</tspan></text><path d="M2390,296 C2480,296 2480,511 2570,511" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="130" width="210" height="26" fill="white"/><text x="2480" y="148" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">decision record</tspan></text><path d="M1130,241 C1850,241 1850,511 2570,511" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1745" y="65" width="210" height="26" fill="white"/><text x="1850" y="83" text-anchor="middle" font-size="12"><tspan x="1850" dy="0">policy verdicts</tspan></text><path d="M710,231 C1640,231 1640,511 2570,511" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="65" width="210" height="26" fill="white"/><text x="1640" y="83" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">run log</tspan></text><g><rect x="50" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Platform engineer (reviewer)</tspan><tspan x="66" dy="20">Existing person outside the provi</tspan><tspan x="66" dy="20">sioning scope. Starts analysis ru</tspan><tspan x="66" dy="20">ns, reviews diffs and records app</tspan><tspan x="66" dy="20">rove/reject decisions. Never trigg</tspan><tspan x="66" dy="20">ers an apply through this system.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="50" y="50" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Synthetic inventory snapshot</tspan><tspan x="66" dy="20">Cloud Storage</tspan><tspan x="66" dy="20">Private bucket holding synthetic </tspan><tspan x="66" dy="20">Cloud Asset Inventory-style JSO</tspan><tspan x="66" dy="20">N exports and the declared desir</tspan><tspan x="66" dy="20">ed state. Analyzer service accou</tspan><tspan x="66" dy="20">nt has read-only object viewer ac</tspan><tspan x="66" dy="20">cess. Real Cloud Asset Inventory</tspan><tspan x="66" dy="20"> reads are a later, separately app</tspan><tspan x="66" dy="20">roved step.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="125" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="151" font-size="14"><tspan x="486" dy="0">Inventory &amp; drift analyzer</tspan><tspan x="486" dy="20">Cloud Run jobs</tspan><tspan x="486" dy="20">Normalizes the inventory, compar</tspan><tspan x="486" dy="20">es it with the desired state and e</tspan><tspan x="486" dy="20">mits drift findings. Runs as a dedi</tspan><tspan x="486" dy="20">cated read-only service account </tspan><tspan x="486" dy="20">with no write, delete or IAM-admi</tspan><tspan x="486" dy="20">n roles.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="125" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="151" font-size="14"><tspan x="906" dy="0">Policy checks</tspan><tspan x="906" dy="20">Cloud Run (Open Policy Agent ru</tspan><tspan x="906" dy="20">les)</tspan><tspan x="906" dy="20">Deterministic policy evaluation of </tspan><tspan x="906" dy="20">findings and later of the proposed</tspan><tspan x="906" dy="20"> plan. It rejects any plan containin</tspan><tspan x="906" dy="20">g deletes, apply steps or credenti</tspan><tspan x="906" dy="20">al/IAM broadening. The ruleset is</tspan><tspan x="906" dy="20"> versioned.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="115" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="141" font-size="14"><tspan x="1326" dy="0">Correction plan generator</tspan><tspan x="1326" dy="20">Vertex AI (Gemini)</tspan><tspan x="1326" dy="20">Drafts a minimal Terraform-style </tspan><tspan x="1326" dy="20">correction for policy-confirmed dri</tspan><tspan x="1326" dy="20">ft. Inventory text is treated as untr</tspan><tspan x="1326" dy="20">usted input. Locally the model is </tspan><tspan x="1326" dy="20">scripted; real model quality, regio</tspan><tspan x="1326" dy="20">nal availability and quotas are un</tspan><tspan x="1326" dy="20">verified.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="115" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="141" font-size="14"><tspan x="1746" dy="0">Reviewable diff &amp; plan artifacts</tspan><tspan x="1746" dy="20">Cloud Storage (versioned)</tspan><tspan x="1746" dy="20">Stores the plan, human-readable </tspan><tspan x="1746" dy="20">diff, findings and policy results pe</tspan><tspan x="1746" dy="20">r run, immutably versioned. Nothi</tspan><tspan x="1746" dy="20">ng is applied from here.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="190" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="216" font-size="14"><tspan x="2166" dy="0">Approval gate</tspan><tspan x="2166" dy="20">Cloud Run service + Firestore (a</tspan><tspan x="2166" dy="20">pproval records)</tspan><tspan x="2166" dy="20">Records the reviewer&apos;s approve/r</tspan><tspan x="2166" dy="20">eject decision against a specific d</tspan><tspan x="2166" dy="20">iff hash. Approval only marks the </tspan><tspan x="2166" dy="20">plan as reviewed; it does not exe</tspan><tspan x="2166" dy="20">cute anything.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="425" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="451" font-size="14"><tspan x="2586" dy="0">Audit trail</tspan><tspan x="2586" dy="20">Cloud Logging + BigQuery log si</tspan><tspan x="2586" dy="20">nk</tspan><tspan x="2586" dy="20">Append-only record of runs, findi</tspan><tspan x="2586" dy="20">ngs, policy verdicts, model calls a</tspan><tspan x="2586" dy="20">nd approvals for traceability.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>