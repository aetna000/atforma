<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="972" viewBox="-50 -90 2070 972"><rect x="-50" y="-90" width="2070" height="972" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure permission-aware RAG qualification · r2</tspan></text><path d="M290,396 C380,396 380,426 470,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="270" width="210" height="26" fill="white"/><text x="380" y="288" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,426 C800,426 800,436 890,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="252" width="210" height="44" fill="white"/><text x="800" y="270" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (auth code + PK</tspan><tspan x="800" dy="18">CE)</tspan></text><path d="M710,426 C1010,426 1010,486 1310,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="252" width="210" height="44" fill="white"/><text x="1010" y="270" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">question + bearer token /</tspan><tspan x="1010" dy="18"> cited answer</tspan></text><path d="M1130,436 C1220,436 1220,486 1310,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT validation</tspan></text><path d="M1550,486 C1640,486 1640,716 1730,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="252" width="210" height="44" fill="white"/><text x="1640" y="270" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">ACL-filtered keyword rea</tspan><tspan x="1640" dy="18">d + revision recheck</tspan></text><path d="M1550,486 C1640,486 1640,426 1730,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="252" width="210" height="44" fill="white"/><text x="1640" y="270" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">chat completion (permitt</tspan><tspan x="1640" dy="18">ed excerpts only)</tspan></text><path d="M710,686 C800,686 800,696 890,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="542" width="210" height="44" fill="white"/><text x="800" y="560" text-anchor="middle" font-size="12"><tspan x="800" dy="0">upload/update/delete do</tspan><tspan x="800" dy="18">cuments</tspan></text><path d="M1130,696 C1220,696 1220,726 1310,726" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="542" width="210" height="44" fill="white"/><text x="1220" y="560" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">blob created/deleted eve</tspan><tspan x="1220" dy="18">nt</tspan></text><path d="M1550,726 C1640,726 1640,716 1730,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="532" width="210" height="44" fill="white"/><text x="1640" y="550" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">conditional upsert/tombs</tspan><tspan x="1640" dy="18">tone</tspan></text><path d="M1550,486 C1640,486 1640,126 1730,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">audit events</tspan></text><g><rect x="50" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Signed-in user (browser)</tspan><tspan x="66" dy="20">Existing person using a browser; </tspan><tspan x="66" dy="20">an external client reference, not p</tspan><tspan x="66" dy="20">rovisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Web app</tspan><tspan x="486" dy="20">Azure Static Web Apps</tspan><tspan x="486" dy="20">Authenticated chat UI; signs in wi</tspan><tspan x="486" dy="20">th Entra ID (auth code + PKCE), </tspan><tspan x="486" dy="20">calls the RAG API with an access</tspan><tspan x="486" dy="20"> token and displays cited answer</tspan><tspan x="486" dy="20">s or abstentions.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="366" font-size="14"><tspan x="906" dy="0">Identity</tspan><tspan x="906" dy="20">Microsoft Entra ID</tspan><tspan x="906" dy="20">Issues tokens for users; the API </tspan><tspan x="906" dy="20">validates the JWT and maps subj</tspan><tspan x="906" dy="20">ect/groups to catalog ACLs. Tena</tspan><tspan x="906" dy="20">nt and app registration are not ye</tspan><tspan x="906" dy="20">t decided.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="312" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">RAG API</tspan><tspan x="1326" dy="20">Azure Functions</tspan><tspan x="1326" dy="20">HTTP-triggered, token-validated f</tspan><tspan x="1326" dy="20">unction. Modules: bounded keyw</tspan><tspan x="1326" dy="20">ord retrieval, ACL filtering before </tspan><tspan x="1326" dy="20">the prompt is built, prompt with ci</tspan><tspan x="1326" dy="20">tations, abstention when no supp</tspan><tspan x="1326" dy="20">ort, revision and ACL recheck bef</tspan><tspan x="1326" dy="20">ore returning (suppresses on rev</tspan><tspan x="1326" dy="20">ocation). Returns the answer to t</tspan><tspan x="1326" dy="20">he web app. Uses a managed id</tspan><tspan x="1326" dy="20">entity for Cosmos DB and Azure </tspan><tspan x="1326" dy="20">OpenAI.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Catalog, ACLs and keyword inde</tspan><tspan x="1746" dy="20">x</tspan><tspan x="1746" dy="20">Azure Cosmos DB</tspan><tspan x="1746" dy="20">Stores document chunks, keywor</tspan><tspan x="1746" dy="20">d terms, explicit ACLs, current re</tspan><tspan x="1746" dy="20">vision IDs and tombstones for del</tspan><tspan x="1746" dy="20">etions. The API only reads; inges</tspan><tspan x="1746" dy="20">tion writes conditionally.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Model runtime</tspan><tspan x="1746" dy="20">Azure OpenAI Service</tspan><tspan x="1746" dy="20">Chat model deployment called by</tspan><tspan x="1746" dy="20"> the RAG API with permitted exc</tspan><tspan x="1746" dy="20">erpts only. The model, region and</tspan><tspan x="1746" dy="20"> quota are unverified. The local te</tspan><tspan x="1746" dy="20">st uses a scripted mock instead.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="470" y="620" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="646" font-size="14"><tspan x="486" dy="0">Content operator</tspan><tspan x="486" dy="20">Existing operator who uploads, u</tspan><tspan x="486" dy="20">pdates and deletes synthetic doc</tspan><tspan x="486" dy="20">uments and their ACL metadata.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="620" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="646" font-size="14"><tspan x="906" dy="0">Source documents</tspan><tspan x="906" dy="20">Azure Blob Storage</tspan><tspan x="906" dy="20">Private container with versioning;</tspan><tspan x="906" dy="20"> holds synthetic UTF-8 document</tspan><tspan x="906" dy="20">s plus ACL metadata.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="620" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="646" font-size="14"><tspan x="1326" dy="0">Ingestion</tspan><tspan x="1326" dy="20">Azure Functions</tspan><tspan x="1326" dy="20">Blob-triggered (Event Grid) functi</tspan><tspan x="1326" dy="20">on: chunks text, extracts keyword</tspan><tspan x="1326" dy="20">s, writes ACLs and revisions, and</tspan><tspan x="1326" dy="20"> tombstones deleted documents i</tspan><tspan x="1326" dy="20">n the catalog. Must be idempoten</tspan><tspan x="1326" dy="20">t.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Audit and telemetry</tspan><tspan x="1746" dy="20">Application Insights</tspan><tspan x="1746" dy="20">Logs queries, retrieval decisions, </tspan><tspan x="1746" dy="20">denials, abstentions and suppres</tspan><tspan x="1746" dy="20">sions, without document content.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>