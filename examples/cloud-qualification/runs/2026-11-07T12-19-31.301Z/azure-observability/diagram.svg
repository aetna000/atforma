<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="952" viewBox="-50 -90 1650 952"><rect x="-50" y="-90" width="1650" height="952" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure incident explainer (logs + traces) · r2</tspan></text><path d="M290,136 C380,136 380,136 470,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">OTLP logs + spans</tspan></text><path d="M710,136 C800,136 800,166 890,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Event Hubs trigger</tspan></text><path d="M1130,166 C1220,166 1220,166 1310,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted, keyed ingest</tspan></text><path d="M1130,486 C1220,486 1220,166 1310,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-18" width="210" height="44" fill="white"/><text x="1220" y="0" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">allowlisted KQL evidenc</tspan><tspan x="1220" dy="18">e query</tspan></text><path d="M1130,486 C1220,486 1220,426 1310,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="262" width="210" height="44" fill="white"/><text x="1220" y="280" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted evidence prom</tspan><tspan x="1220" dy="18">pt</tspan></text><path d="M290,406 C380,406 380,406 470,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="270" width="210" height="26" fill="white"/><text x="380" y="288" text-anchor="middle" font-size="12"><tspan x="380" dy="0">sign-in</tspan></text><path d="M710,406 C800,406 800,486 890,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">token validation</tspan></text><path d="M290,406 C590,406 590,486 890,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="280" width="210" height="26" fill="white"/><text x="590" y="298" text-anchor="middle" font-size="12"><tspan x="590" dy="0">question / cited answer</tspan></text><path d="M1130,486 C1220,486 1220,716 1310,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">audit + telemetry</tspan></text><g><rect x="50" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Synthetic services (OTel)</tspan><tspan x="66" dy="20">Existing synthetic services that e</tspan><tspan x="66" dy="20">mit OpenTelemetry logs and spa</tspan><tspan x="66" dy="20">ns with trace, span and log IDs. T</tspan><tspan x="66" dy="20">hey sit outside the provisioning s</tspan><tspan x="66" dy="20">cope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Telemetry collection</tspan><tspan x="486" dy="20">Azure Event Hubs</tspan><tspan x="486" dy="20">Takes in OTLP-exported log and </tspan><tspan x="486" dy="20">trace batches. Partitioned by trac</tspan><tspan x="486" dy="20">e ID to keep ordering within each</tspan><tspan x="486" dy="20"> trace.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Redaction &amp; normalisation</tspan><tspan x="906" dy="20">Azure Functions</tspan><tspan x="906" dy="20">Event Hubs trigger. Masks secret</tspan><tspan x="906" dy="20">s and tokens before storage or m</tspan><tspan x="906" dy="20">odel input, normalises timestamp</tspan><tspan x="906" dy="20">s and writes records with determi</tspan><tspan x="906" dy="20">nistic keys (trace, span, log ID) s</tspan><tspan x="906" dy="20">o a replay is idempotent and the t</tspan><tspan x="906" dy="20">imeline stays consistent.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="60" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="86" font-size="14"><tspan x="1326" dy="0">Telemetry store &amp; search</tspan><tspan x="1326" dy="20">Azure Data Explorer</tspan><tspan x="1326" dy="20">Holds the redacted logs and spa</tspan><tspan x="1326" dy="20">ns. Answers KQL queries for the </tspan><tspan x="1326" dy="20">incident timeline, trace trees and </tspan><tspan x="1326" dy="20">gap detection (missing spans). In</tspan><tspan x="1326" dy="20">gestion deduplicates on record k</tspan><tspan x="1326" dy="20">eys.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="340" width="240" height="292" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="366" font-size="14"><tspan x="906" dy="0">AI analysis runtime</tspan><tspan x="906" dy="20">Azure Container Apps</tspan><tspan x="906" dy="20">Gets the evidence through a fixe</tspan><tspan x="906" dy="20">d, allowlisted KQL query tool and</tspan><tspan x="906" dy="20"> passes log text to the model as </tspan><tspan x="906" dy="20">quoted data only, so model outpu</tspan><tspan x="906" dy="20">t cannot trigger tool calls. Checks</tspan><tspan x="906" dy="20"> that every conclusion cites existi</tspan><tspan x="906" dy="20">ng trace or log IDs, and reports u</tspan><tspan x="906" dy="20">ncertainty when spans are missin</tspan><tspan x="906" dy="20">g. Returns the cited answer to th</tspan><tspan x="906" dy="20">e operator.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">Incident reasoning model</tspan><tspan x="1326" dy="20">Azure OpenAI Service</tspan><tspan x="1326" dy="20">Chat model deployment that rece</tspan><tspan x="1326" dy="20">ives only redacted evidence. The</tspan><tspan x="1326" dy="20"> model, quota and regional availa</tspan><tspan x="1326" dy="20">bility are not yet verified.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="50" y="340" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="366" font-size="14"><tspan x="66" dy="0">Operator</tspan><tspan x="66" dy="20">Engineer who asks why the incid</tspan><tspan x="66" dy="20">ent happened and reviews the cit</tspan><tspan x="66" dy="20">ed answer.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Operator sign-in</tspan><tspan x="486" dy="20">Microsoft Entra ID</tspan><tspan x="486" dy="20">Authenticates operators and issu</tspan><tspan x="486" dy="20">es the tokens that the runtime val</tspan><tspan x="486" dy="20">idates.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="620" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="646" font-size="14"><tspan x="1326" dy="0">Runtime observability</tspan><tspan x="1326" dy="20">Azure Monitor Application Insight</tspan><tspan x="1326" dy="20">s</tspan><tspan x="1326" dy="20">Audit of questions, evidence IDs </tspan><tspan x="1326" dy="20">used, refusals, guard failures and</tspan><tspan x="1326" dy="20"> latency. This is separate from th</tspan><tspan x="1326" dy="20">e analysed synthetic telemetry.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>