<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="1022" viewBox="-50 -90 2910 1022"><rect x="-50" y="-90" width="2910" height="1022" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure synthetic sensor anomaly detection · r2</tspan></text><path d="M290,296 C380,296 380,306 470,306" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="104" width="210" height="62" fill="white"/><text x="380" y="122" text-anchor="middle" font-size="12"><tspan x="380" dy="0">device telemetry (MQTT/</tspan><tspan x="380" dy="18">HTTPS, per-device ident</tspan><tspan x="380" dy="18">ity)</tspan></text><path d="M710,306 C800,306 800,316 890,316" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="140" width="210" height="26" fill="white"/><text x="800" y="158" text-anchor="middle" font-size="12"><tspan x="800" dy="0">message routing</tspan></text><path d="M1130,316 C1430,316 1430,146 1730,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1325" y="-10" width="210" height="26" fill="white"/><text x="1430" y="8" text-anchor="middle" font-size="12"><tspan x="1430" dy="0">Capture raw archive</tspan></text><path d="M1130,316 C1220,316 1220,701 1310,701" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="122" width="210" height="44" fill="white"/><text x="1220" y="140" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Event Hubs trigger (chec</tspan><tspan x="1220" dy="18">kpointed)</tspan></text><path d="M1550,701 C1640,701 1640,146 1730,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">rejected event + reason</tspan></text><path d="M1550,296 C1640,296 1640,466 1730,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="140" width="210" height="26" fill="white"/><text x="1640" y="158" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">deploy model version</tspan></text><path d="M1550,701 C1640,701 1640,466 1730,466" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="290" width="210" height="26" fill="white"/><text x="1640" y="308" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">score request</tspan></text><path d="M1550,701 C1640,701 1640,756 1730,756" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="485" width="210" height="26" fill="white"/><text x="1640" y="503" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">idempotent result write</tspan></text><path d="M1970,756 C2060,756 2060,716 2150,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="570" width="210" height="26" fill="white"/><text x="2060" y="588" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">anomaly results / metrics</tspan></text><path d="M2390,716 C2480,716 2480,696 2570,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="570" width="210" height="26" fill="white"/><text x="2480" y="588" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">action group alert</tspan></text><g><rect x="50" y="200" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="226" font-size="14"><tspan x="66" dy="0">Synthetic device simulator</tspan><tspan x="66" dy="20">Existing test harness. It sends sy</tspan><tspan x="66" dy="20">nthetic telemetry with deviceId, a</tspan><tspan x="66" dy="20">n event ID, the device timestamp,</tspan><tspan x="66" dy="20"> a value and its unit. It also produ</tspan><tspan x="66" dy="20">ces duplicate, late, out-of-order a</tspan><tspan x="66" dy="20">nd disconnect/reconnect cases.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="200" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="226" font-size="14"><tspan x="486" dy="0">Azure IoT Hub</tspan><tspan x="486" dy="20">Device ingestion with an identity r</tspan><tspan x="486" dy="20">egistry for each device. Unknown</tspan><tspan x="486" dy="20"> devices cannot authenticate. Me</tspan><tspan x="486" dy="20">ssage routing forwards telemetry </tspan><tspan x="486" dy="20">to Event Hubs while keeping devi</tspan><tspan x="486" dy="20">ceId, the timestamp and the unit </tspan><tspan x="486" dy="20">unchanged.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="200" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="226" font-size="14"><tspan x="906" dy="0">Azure Event Hubs (durable buffer</tspan><tspan x="906" dy="20">)</tspan><tspan x="906" dy="20">Azure Event Hubs</tspan><tspan x="906" dy="20">Durable, partitioned buffer keyed </tspan><tspan x="906" dy="20">by deviceId. Retention and consu</tspan><tspan x="906" dy="20">mer checkpoints let processing r</tspan><tspan x="906" dy="20">esume after a disconnect. Captur</tspan><tspan x="906" dy="20">e to Blob storage keeps the raw </tspan><tspan x="906" dy="20">archive for longer-range replay.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="545" width="240" height="312" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="571" font-size="14"><tspan x="1326" dy="0">Azure Functions validator &amp; scor</tspan><tspan x="1326" dy="20">er</tspan><tspan x="1326" dy="20">Azure Functions</tspan><tspan x="1326" dy="20">Event Hubs-triggered function. It </tspan><tspan x="1326" dy="20">rejects unknown devices and inv</tspan><tspan x="1326" dy="20">alid units, checks the device&apos;s ev</tspan><tspan x="1326" dy="20">ent ID against Cosmos DB to dro</tspan><tspan x="1326" dy="20">p duplicates, and applies the late/</tspan><tspan x="1326" dy="20">out-of-order policy (not decided y</tspan><tspan x="1326" dy="20">et). It then calls the model and wr</tspan><tspan x="1326" dy="20">ites one result per event, includin</tspan><tspan x="1326" dy="20">g evidence and the model versio</tspan><tspan x="1326" dy="20">n.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Azure Blob Storage (raw archive </tspan><tspan x="1746" dy="20">&amp; quarantine)</tspan><tspan x="1746" dy="20">Azure Blob Storage</tspan><tspan x="1746" dy="20">Private containers for the Event </tspan><tspan x="1746" dy="20">Hubs Capture raw archive (used </tspan><tspan x="1746" dy="20">for replay) and for rejected event</tspan><tspan x="1746" dy="20">s with a reason code.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="200" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="226" font-size="14"><tspan x="1326" dy="0">Azure ML model registry</tspan><tspan x="1326" dy="20">Azure Machine Learning</tspan><tspan x="1326" dy="20">Versioned anomaly models. The </tspan><tspan x="1326" dy="20">deployed version is stamped on </tspan><tspan x="1326" dy="20">every result. The training method</tspan><tspan x="1326" dy="20"> is still open: unsupervised versu</tspan><tspan x="1326" dy="20">s labelled.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="350" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="376" font-size="14"><tspan x="1746" dy="0">Azure ML online endpoint</tspan><tspan x="1746" dy="20">Azure Machine Learning manage</tspan><tspan x="1746" dy="20">d online endpoint</tspan><tspan x="1746" dy="20">Returns an anomaly score, the c</tspan><tspan x="1746" dy="20">ontributing evidence fields and th</tspan><tspan x="1746" dy="20">e model version. In local tests it i</tspan><tspan x="1746" dy="20">s replaced by a scripted mock, w</tspan><tspan x="1746" dy="20">hich proves contracts only, not de</tspan><tspan x="1746" dy="20">tection quality.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="630" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="656" font-size="14"><tspan x="1746" dy="0">Azure Cosmos DB (results &amp; ide</tspan><tspan x="1746" dy="20">mpotency)</tspan><tspan x="1746" dy="20">Azure Cosmos DB</tspan><tspan x="1746" dy="20">Results container with a unique k</tspan><tspan x="1746" dy="20">ey on deviceId plus eventId, so o</tspan><tspan x="1746" dy="20">ne event produces one result. Ea</tspan><tspan x="1746" dy="20">ch result stores the score, eviden</tspan><tspan x="1746" dy="20">ce, model version and lateness fl</tspan><tspan x="1746" dy="20">ag. A device catalog container ho</tspan><tspan x="1746" dy="20">lds the allowed units.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="630" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="656" font-size="14"><tspan x="2166" dy="0">Azure Monitor alerts</tspan><tspan x="2166" dy="20">Azure Monitor</tspan><tspan x="2166" dy="20">Alert rules on anomaly results an</tspan><tspan x="2166" dy="20">d pipeline health (Event Hubs lag</tspan><tspan x="2166" dy="20">, rejections, function errors). An a</tspan><tspan x="2166" dy="20">ction group notifies the operator.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="630" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="656" font-size="14"><tspan x="2586" dy="0">Operator</tspan><tspan x="2586" dy="20">Person who receives anomaly al</tspan><tspan x="2586" dy="20">erts naming the device, the evide</tspan><tspan x="2586" dy="20">nce and the model version.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>