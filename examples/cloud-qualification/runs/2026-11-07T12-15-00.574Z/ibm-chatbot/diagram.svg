<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1202" viewBox="-50 -90 2070 1202"><rect x="-50" y="-90" width="2070" height="1202" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM authenticated conversational assistant (synthetic) · r2</tspan></text><path d="M290,536 C380,536 380,631 470,631" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">OIDC sign-in</tspan></text><path d="M290,536 C590,536 590,576 890,576" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="392" width="210" height="44" fill="white"/><text x="590" y="410" text-anchor="middle" font-size="12"><tspan x="590" dy="0">HTTPS chat + bearer tok</tspan><tspan x="590" dy="18">en / reply</tspan></text><path d="M710,631 C800,631 800,576 890,576" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="410" width="210" height="26" fill="white"/><text x="800" y="428" text-anchor="middle" font-size="12"><tspan x="800" dy="0">token validation (JWKS)</tspan></text><path d="M1130,576 C1220,576 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read/write own history</tspan></text><path d="M1130,576 C1220,576 1220,436 1310,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">history + message</tspan></text><path d="M1550,436 C1640,436 1640,426 1730,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="252" width="210" height="44" fill="white"/><text x="1640" y="270" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">bounded prompt → gene</tspan><tspan x="1640" dy="18">ration</tspan></text><path d="M1130,576 C1220,576 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="410" width="210" height="26" fill="white"/><text x="1220" y="428" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">escalation event</tspan></text><path d="M1550,706 C1640,706 1640,676 1730,676" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="550" width="210" height="26" fill="white"/><text x="1640" y="568" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">notify</tspan></text><path d="M1130,576 C1220,576 1220,976 1310,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="410" width="210" height="26" fill="white"/><text x="1220" y="428" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">logs/audit</tspan></text><g><rect x="50" y="470" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Synthetic user (browser)</tspan><tspan x="66" dy="20">Synthetic test user signing in thro</tspan><tspan x="66" dy="20">ugh a browser. This is a client ref</tspan><tspan x="66" dy="20">erence and is not provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="545" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="571" font-size="14"><tspan x="486" dy="0">Sign-in</tspan><tspan x="486" dy="20">IBM Cloud App ID</tspan><tspan x="486" dy="20">Issues OIDC tokens to synthetic </tspan><tspan x="486" dy="20">users. The app validates the toke</tspan><tspan x="486" dy="20">ns and derives the user ID from t</tspan><tspan x="486" dy="20">he token subject.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="470" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="496" font-size="14"><tspan x="906" dy="0">Chat application</tspan><tspan x="906" dy="20">IBM Cloud Code Engine</tspan><tspan x="906" dy="20">Web UI and chat API. Rejects un</tspan><tspan x="906" dy="20">authenticated requests, loads an</tspan><tspan x="906" dy="20">d saves per-user history, builds t</tspan><tspan x="906" dy="20">he bounded prompt, calls the mo</tspan><tspan x="906" dy="20">del and returns the reply. It has n</tspan><tspan x="906" dy="20">o tools for external actions.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Conversation state</tspan><tspan x="1326" dy="20">IBM Cloudant</tspan><tspan x="1326" dy="20">Stores per-user conversation doc</tspan><tspan x="1326" dy="20">uments, partitioned by the token </tspan><tspan x="1326" dy="20">subject. The app can only read a</tspan><tspan x="1326" dy="20">nd write the signed-in user&apos;s own </tspan><tspan x="1326" dy="20">partition. Retention is still to be d</tspan><tspan x="1326" dy="20">ecided.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Bounded context builder</tspan><tspan x="1326" dy="20">IBM Cloud Code Engine (app mo</tspan><tspan x="1326" dy="20">dule)</tspan><tspan x="1326" dy="20">Application logic owned by the C</tspan><tspan x="1326" dy="20">hat application, not a separate de</tspan><tspan x="1326" dy="20">ployment. It limits history turns, in</tspan><tspan x="1326" dy="20">put size and output tokens, and tr</tspan><tspan x="1326" dy="20">eats stored content as untrusted.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Model runtime</tspan><tspan x="1746" dy="20">IBM watsonx.ai</tspan><tspan x="1746" dy="20">Foundation model inference via t</tspan><tspan x="1746" dy="20">he watsonx.ai API using a servic</tspan><tspan x="1746" dy="20">e ID. The model, plan, region and</tspan><tspan x="1746" dy="20"> access are unverified. Local test</tspan><tspan x="1746" dy="20">s use a scripted mock instead.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Escalation</tspan><tspan x="1326" dy="20">IBM Cloud Event Notifications</tspan><tspan x="1326" dy="20">The app publishes an escalation </tspan><tspan x="1326" dy="20">event when the user asks for a p</tspan><tspan x="1326" dy="20">erson or the model abstains. The</tspan><tspan x="1326" dy="20"> event goes to the reviewer&apos;s des</tspan><tspan x="1326" dy="20">tination.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Human reviewer</tspan><tspan x="1746" dy="20">The person who receives escalat</tspan><tspan x="1746" dy="20">ed conversations. Not provisione</tspan><tspan x="1746" dy="20">d.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="916" font-size="14"><tspan x="1326" dy="0">Logs &amp; audit</tspan><tspan x="1326" dy="20">IBM Cloud Logs + Activity Tracke</tspan><tspan x="1326" dy="20">r</tspan><tspan x="1326" dy="20">Application logs, escalation audit </tspan><tspan x="1326" dy="20">and account activity. Retention is </tspan><tspan x="1326" dy="20">still to be decided.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>