<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="1182" viewBox="-50 -90 2490 1182"><rect x="-50" y="-90" width="2490" height="1182" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic sensor anomaly detection on AWS · r2</tspan></text><path d="M290,546 C380,546 380,556 470,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">MQTT sensor events</tspan></text><path d="M710,556 C800,556 800,556 890,556" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="410" width="210" height="26" fill="white"/><text x="800" y="428" text-anchor="middle" font-size="12"><tspan x="800" dy="0">IoT rule → PutRecord</tspan></text><path d="M1130,556 C1220,556 1220,606 1310,606" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="392" width="210" height="44" fill="white"/><text x="1220" y="410" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Event source mapping (</tspan><tspan x="1220" dy="18">batches)</tspan></text><path d="M1550,606 C1640,606 1640,126 1730,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">Invalid/failed events</tspan></text><path d="M1550,606 C1640,606 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">InvokeEndpoint → score</tspan></text><path d="M1550,606 C1640,606 1640,686 1730,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="410" width="210" height="26" fill="white"/><text x="1640" y="428" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">Conditional write result</tspan></text><path d="M1550,606 C1640,606 1640,966 1730,966" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="410" width="210" height="26" fill="white"/><text x="1640" y="428" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">Publish anomaly</tspan></text><path d="M1970,966 C2060,966 2060,946 2150,946" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="830" width="210" height="26" fill="white"/><text x="2060" y="848" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">Alert notification</tspan></text><g><rect x="50" y="470" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Synthetic sensor devices</tspan><tspan x="66" dy="20">Existing synthetic event generato</tspan><tspan x="66" dy="20">r. Each event carries device_id, ti</tspan><tspan x="66" dy="20">mestamp and value+unit. Outsid</tspan><tspan x="66" dy="20">e provisioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="496" font-size="14"><tspan x="486" dy="0">Ingestion</tspan><tspan x="486" dy="20">AWS IoT Core</tspan><tspan x="486" dy="20">Authenticates devices over MQT</tspan><tspan x="486" dy="20">T and routes events via an IoT ru</tspan><tspan x="486" dy="20">le into Kinesis. Device certificates</tspan><tspan x="486" dy="20">/policies need design.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="470" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="496" font-size="14"><tspan x="906" dy="0">Durable buffer</tspan><tspan x="906" dy="20">Amazon Kinesis Data Streams</tspan><tspan x="906" dy="20">Durable, ordered buffer partitione</tspan><tspan x="906" dy="20">d by device_id so events can be r</tspan><tspan x="906" dy="20">eplayed. Retention period to be d</tspan><tspan x="906" dy="20">ecided.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="470" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="496" font-size="14"><tspan x="1326" dy="0">Validation &amp; scoring</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Consumes Kinesis batches; valid</tspan><tspan x="1326" dy="20">ates schema, device_id, timesta</tspan><tspan x="1326" dy="20">mp and unit without altering them</tspan><tspan x="1326" dy="20">; sends invalid events to quaranti</tspan><tspan x="1326" dy="20">ne; calls the model; writes results</tspan><tspan x="1326" dy="20"> idempotently keyed by device_id</tspan><tspan x="1326" dy="20">+timestamp; publishes alerts abo</tspan><tspan x="1326" dy="20">ve threshold. Owns its role and lo</tspan><tspan x="1326" dy="20">gs.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Invalid event quarantine</tspan><tspan x="1746" dy="20">Amazon SQS</tspan><tspan x="1746" dy="20">Holds events that fail validation o</tspan><tspan x="1746" dy="20">r processing, with the reason, for </tspan><tspan x="1746" dy="20">review and replay.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Anomaly model</tspan><tspan x="1746" dy="20">Amazon SageMaker AI real-time </tspan><tspan x="1746" dy="20">endpoint</tspan><tspan x="1746" dy="20">Returns an anomaly score per ev</tspan><tspan x="1746" dy="20">ent. Local tests use a scripted re</tspan><tspan x="1746" dy="20">sponse; real accuracy needs a tr</tspan><tspan x="1746" dy="20">ained model and labelled evaluati</tspan><tspan x="1746" dy="20">on.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="636" font-size="14"><tspan x="1746" dy="0">Anomaly results</tspan><tspan x="1746" dy="20">Amazon DynamoDB</tspan><tspan x="1746" dy="20">Stores device_id, timestamp, orig</tspan><tspan x="1746" dy="20">inal value+unit, score, model ver</tspan><tspan x="1746" dy="20">sion and decision.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="890" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="916" font-size="14"><tspan x="1746" dy="0">Operator alert</tspan><tspan x="1746" dy="20">Amazon SNS</tspan><tspan x="1746" dy="20">Publishes anomaly alerts with de</tspan><tspan x="1746" dy="20">vice_id, timestamp and score. Su</tspan><tspan x="1746" dy="20">bscription channel to be decided.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="890" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="916" font-size="14"><tspan x="2166" dy="0">Operator</tspan><tspan x="2166" dy="20">Person who receives and acts on</tspan><tspan x="2166" dy="20"> anomaly alerts.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>