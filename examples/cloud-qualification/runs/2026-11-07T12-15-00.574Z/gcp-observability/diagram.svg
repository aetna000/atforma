<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="732" viewBox="-50 -90 2910 732"><rect x="-50" y="-90" width="2910" height="732" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">GCP incident explainer (synthetic qualification) · r2</tspan></text><path d="M290,396 C380,396 380,136 470,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">structured logs</tspan></text><path d="M290,396 C380,396 380,416 470,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="260" width="210" height="26" fill="white"/><text x="380" y="278" text-anchor="middle" font-size="12"><tspan x="380" dy="0">OTel spans</tspan></text><path d="M710,136 C800,136 800,406 890,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Log Router sink</tspan></text><path d="M710,416 C800,416 800,406 890,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="260" width="210" height="26" fill="white"/><text x="800" y="278" text-anchor="middle" font-size="12"><tspan x="800" dy="0">span export</tspan></text><path d="M1130,406 C1220,406 1220,446 1310,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="260" width="210" height="26" fill="white"/><text x="1220" y="278" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">push subscription</tspan></text><path d="M1550,446 C1640,446 1640,406 1730,406" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="242" width="210" height="44" fill="white"/><text x="1640" y="260" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">redacted rows (Storage </tspan><tspan x="1640" dy="18">Write API)</tspan></text><path d="M1970,406 C2060,406 2060,456 2150,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="260" width="210" height="26" fill="white"/><text x="2060" y="278" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">search + trace-ID join</tspan></text><path d="M2390,456 C2480,456 2480,146 2570,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="-28" width="210" height="44" fill="white"/><text x="2480" y="-10" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">generateContent (eviden</tspan><tspan x="2480" dy="18">ce as data)</tspan></text><path d="M2570,416 C2480,416 2480,456 2390,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="242" width="210" height="44" fill="white"/><text x="2480" y="260" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">IAP-authenticated reque</tspan><tspan x="2480" dy="18">st</tspan></text><path d="M2390,456 C2480,456 2480,416 2570,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="242" width="210" height="44" fill="white"/><text x="2480" y="260" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">cited explanation / abstai</tspan><tspan x="2480" dy="18">n</tspan></text><g><rect x="50" y="320" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="346" font-size="14"><tspan x="66" dy="0">Synthetic services</tspan><tspan x="66" dy="20">Existing synthetic workload that e</tspan><tspan x="66" dy="20">mits structured logs and OpenTel</tspan><tspan x="66" dy="20">emetry traces. Outside provisioni</tspan><tspan x="66" dy="20">ng scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Log collection</tspan><tspan x="486" dy="20">Cloud Logging (Log Router sink)</tspan><tspan x="486" dy="20">Receives service logs. A Log Ro</tspan><tspan x="486" dy="20">uter sink exports the entries to P</tspan><tspan x="486" dy="20">ub/Sub, so raw text never goes st</tspan><tspan x="486" dy="20">raight into the search store.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Trace collection</tspan><tspan x="486" dy="20">Cloud Trace</tspan><tspan x="486" dy="20">Collects OpenTelemetry spans. S</tspan><tspan x="486" dy="20">pan names and attributes are pull</tspan><tspan x="486" dy="20">ed into the redaction path before </tspan><tspan x="486" dy="20">they are indexed.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="320" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="346" font-size="14"><tspan x="906" dy="0">Ingest queue</tspan><tspan x="906" dy="20">Pub/Sub (with dead-letter topic)</tspan><tspan x="906" dy="20">Buffers log and span records for r</tspan><tspan x="906" dy="20">edaction. A dead-letter topic kee</tspan><tspan x="906" dy="20">ps records that fail processing so</tspan><tspan x="906" dy="20"> they can be replayed.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="320" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="346" font-size="14"><tspan x="1326" dy="0">Redaction worker</tspan><tspan x="1326" dy="20">Cloud Run + Sensitive Data Prot</tspan><tspan x="1326" dy="20">ection</tspan><tspan x="1326" dy="20">Masks secrets, tokens and perso</tspan><tspan x="1326" dy="20">nal data using Sensitive Data Pro</tspan><tspan x="1326" dy="20">tection (DLP) inspect templates, </tspan><tspan x="1326" dy="20">and keeps trace and span IDs as</tspan><tspan x="1326" dy="20"> join keys. Fails closed: records t</tspan><tspan x="1326" dy="20">hat can&apos;t be redacted go to the d</tspan><tspan x="1326" dy="20">ead-letter topic.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="320" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="346" font-size="14"><tspan x="1746" dy="0">Redacted log &amp; span store</tspan><tspan x="1746" dy="20">BigQuery (search indexes)</tspan><tspan x="1746" dy="20">Partitioned tables of redacted log</tspan><tspan x="1746" dy="20">s and spans, with search indexes</tspan><tspan x="1746" dy="20"> for keyword and ID lookup. Rete</tspan><tspan x="1746" dy="20">ntion is still to be decided.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="320" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="346" font-size="14"><tspan x="2166" dy="0">Incident analysis service</tspan><tspan x="2166" dy="20">Cloud Run</tspan><tspan x="2166" dy="20">Takes an incident time window, jo</tspan><tspan x="2166" dy="20">ins logs to spans by trace ID, and</tspan><tspan x="2166" dy="20"> builds an evidence bundle where</tspan><tspan x="2166" dy="20"> log text is quoted as untrusted d</tspan><tspan x="2166" dy="20">ata. It calls Gemini with no tools, </tspan><tspan x="2166" dy="20">checks that every citation is a rea</tspan><tspan x="2166" dy="20">l log or span ID, and returns an e</tspan><tspan x="2166" dy="20">xplanation with evidence or an ab</tspan><tspan x="2166" dy="20">stention.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="76" font-size="14"><tspan x="2586" dy="0">Analysis model</tspan><tspan x="2586" dy="20">Vertex AI Gemini</tspan><tspan x="2586" dy="20">Reasons over redacted evidence</tspan><tspan x="2586" dy="20"> only. The model ID, regional avai</tspan><tspan x="2586" dy="20">lability and quotas are not verifie</tspan><tspan x="2586" dy="20">d. Local tests use a scripted moc</tspan><tspan x="2586" dy="20">k in place of this model.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="356" font-size="14"><tspan x="2586" dy="0">Incident operator</tspan><tspan x="2586" dy="20">Person who asks for an incident </tspan><tspan x="2586" dy="20">explanation through Identity-Awa</tspan><tspan x="2586" dy="20">re Proxy and receives the cited a</tspan><tspan x="2586" dy="20">nswer. Outside provisioning scop</tspan><tspan x="2586" dy="20">e.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>