<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="682" viewBox="-50 -90 2910 682"><rect x="-50" y="-90" width="2910" height="682" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure synthetic sensor anomaly detection · r2</tspan></text><path d="M290,266 C380,266 380,296 470,296" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">AMQP/HTTPS events</tspan></text><path d="M710,296 C800,296 800,286 890,286" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="112" width="210" height="44" fill="white"/><text x="800" y="130" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Event Hubs trigger (chec</tspan><tspan x="800" dy="18">kpointed)</tspan></text><path d="M1130,286 C1220,286 1220,126 1310,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">rejected events + reason</tspan></text><path d="M1130,286 C1220,286 1220,436 1310,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="112" width="210" height="44" fill="white"/><text x="1220" y="130" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">valid event → score requ</tspan><tspan x="1220" dy="18">est</tspan></text><path d="M1550,436 C1640,436 1640,426 1730,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">score + model version</tspan></text><path d="M1970,426 C2060,426 2060,426 2150,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="252" width="210" height="44" fill="white"/><text x="2060" y="270" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">score at or above thresh</tspan><tspan x="2060" dy="18">old</tspan></text><path d="M2390,426 C2480,426 2480,386 2570,386" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="270" width="210" height="26" fill="white"/><text x="2480" y="288" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">notification</tspan></text><g><rect x="50" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Synthetic device simulator</tspan><tspan x="66" dy="20">Existing test source that sends J</tspan><tspan x="66" dy="20">SON events {deviceId, timestam</tspan><tspan x="66" dy="20">p, value, unit}. Outside the provisi</tspan><tspan x="66" dy="20">oning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">Event ingestion &amp; buffer</tspan><tspan x="486" dy="20">Azure Event Hubs</tspan><tspan x="486" dy="20">Receives events and holds them </tspan><tspan x="486" dy="20">durably for a retention window th</tspan><tspan x="486" dy="20">at is still to be agreed. Partitions </tspan><tspan x="486" dy="20">by deviceId to keep per-device or</tspan><tspan x="486" dy="20">der. Consumers use checkpoints </tspan><tspan x="486" dy="20">so processing can be replayed.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="190" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">Validation function</tspan><tspan x="906" dy="20">Azure Functions</tspan><tspan x="906" dy="20">Event Hubs-triggered function. C</tspan><tspan x="906" dy="20">hecks the schema, the required d</tspan><tspan x="906" dy="20">eviceId, timestamp and unit, and </tspan><tspan x="906" dy="20">the allowed units. Passes the ori</tspan><tspan x="906" dy="20">ginal fields through unchanged.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Invalid event quarantine</tspan><tspan x="1326" dy="20">Azure Blob Storage</tspan><tspan x="1326" dy="20">Private container that stores reje</tspan><tspan x="1326" dy="20">cted events with the rejection rea</tspan><tspan x="1326" dy="20">son, for review and replay.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Anomaly scoring endpoint</tspan><tspan x="1326" dy="20">Azure Machine Learning manage</tspan><tspan x="1326" dy="20">d online endpoint</tspan><tspan x="1326" dy="20">Returns an anomaly score per ev</tspan><tspan x="1326" dy="20">ent. The model isn&apos;t chosen yet. </tspan><tspan x="1326" dy="20">Local tests use a scripted reply, </tspan><tspan x="1326" dy="20">which does not validate model qu</tspan><tspan x="1326" dy="20">ality.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Anomaly results store</tspan><tspan x="1746" dy="20">Azure Cosmos DB for NoSQL</tspan><tspan x="1746" dy="20">Stores the score with deviceId, ti</tspan><tspan x="1746" dy="20">mestamp, unit and model version</tspan><tspan x="1746" dy="20">. Uses deviceId as the partition k</tspan><tspan x="1746" dy="20">ey. Writes are idempotent per ev</tspan><tspan x="1746" dy="20">ent ID.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Operator alerting</tspan><tspan x="2166" dy="20">Azure Monitor alerts + action gro</tspan><tspan x="2166" dy="20">up</tspan><tspan x="2166" dy="20">Raises an alert when a score is a</tspan><tspan x="2166" dy="20">t or above the agreed threshold. </tspan><tspan x="2166" dy="20">The threshold and the notification</tspan><tspan x="2166" dy="20"> channel are still to be agreed.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="330" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="356" font-size="14"><tspan x="2586" dy="0">Operator</tspan><tspan x="2586" dy="20">Person who receives and handle</tspan><tspan x="2586" dy="20">s anomaly alerts.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>