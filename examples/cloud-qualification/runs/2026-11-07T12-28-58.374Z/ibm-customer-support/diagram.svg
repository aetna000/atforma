800,1096 800,1616 890,1616" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="794" width="210" height="62" fill="white"/><text x="800" y="812" text-anchor="middle" font-size="12"><tspan x="800" dy="0">HTTPS inference: filtere</tspan><tspan x="800" dy="18">d context → cited draft o</tspan><tspan x="800" dy="18">r abstention</tspan></text><path d="M470,1096 C380,1096 380,566 290,566" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="392" width="210" height="44" fill="white"/><text x="380" y="410" text-anchor="middle" font-size="12"><tspan x="380" dy="0">Return cited draft, escal</tspan><tspan x="380" dy="18">ation and update status</tspan></text><path d="M710,1096 C800,1096 800,1846 890,1846" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="794" width="210" height="62" fill="white"/><text x="800" y="812" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Scoped secret retrieval; i</tspan><tspan x="800" dy="18">ntegration requires verifi</tspan><tspan x="800" dy="18">cation</tspan></text><path d="M710,1096 C800,1096 800,2176 890,2176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="794" width="210" height="62" fill="white"/><text x="800" y="812" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Redacted diagnostics an</tspan><tspan x="800" dy="18">d failure events; routing r</tspan><tspan x="800" dy="18">equired</tspan></text><g><rect x="50" y="470" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Support staff</tspan><tspan x="66" dy="20">Existing people using a browser </tspan><tspan x="66" dy="20">outside provisioning scope. Revi</tspan><tspan x="66" dy="20">ew cited drafts, handle escalation</tspan><tspan x="66" dy="20">s and explicitly approve ticket up</tspan><tspan x="66" dy="20">dates.</tspan><tspan x="66" dy="20">Existing location; country unresol</tspan><tspan x="66" dy="20">ved</tspan></text></g><g><rect x="890" y="50" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Staff authentication</tspan><tspan x="906" dy="20">IBM Cloud App ID</tspan><tspan x="906" dy="20">Proposed IBM Cloud App ID for s</tspan><tspan x="906" dy="20">taff authentication. Company sign</tspan><tspan x="906" dy="20">-in federation and current service</tspan><tspan x="906" dy="20"> availability require verification. Tr</tspan><tspan x="906" dy="20">usted server-side mappings supp</tspan><tspan x="906" dy="20">ly staff, tenant and customer per</tspan><tspan x="906" dy="20">missions; browser claims alone c</tspan><tspan x="906" dy="20">annot grant access.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="890" width="240" height="412" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="916" font-size="14"><tspan x="486" dy="0">Support application and staff inte</tspan><tspan x="486" dy="20">rface</tspan><tspan x="486" dy="20">IBM Cloud Code Engine</tspan><tspan x="486" dy="20">One Code Engine application ser</tspan><tspan x="486" dy="20">ves HTTPS UI/API and owns sou</tspan><tspan x="486" dy="20">rce adapters, deny-by-default aut</tspan><tspan x="486" dy="20">horization, customer/tenant chec</tspan><tspan x="486" dy="20">ks, sensitive-field allowlisting, SQ</tspan><tspan x="486" dy="20">L retrieval, prompt isolation, citati</tspan><tspan x="486" dy="20">on checks and human escalation.</tspan><tspan x="486" dy="20"> Returns drafts to staff. Only expli</tspan><tspan x="486" dy="20">cit staff approval permits ticket up</tspan><tspan x="486" dy="20">dates; no refund or CRM-write ca</tspan><tspan x="486" dy="20">pability. Uses durable approval/id</tspan><tspan x="486" dy="20">empotency state and reconciliatio</tspan><tspan x="486" dy="20">n after ambiguous source respon</tspan><tspan x="486" dy="20">ses. Custom implementation req</tspan><tspan x="486" dy="20">uired.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Synthetic ticket queue</tspan><tspan x="906" dy="20">External qualification fixture for ti</tspan><tspan x="906" dy="20">cket ingestion, escalation and ap</tspan><tspan x="906" dy="20">proved ticket updates. Its actual </tspan><tspan x="906" dy="20">API and idempotency/reconciliati</tspan><tspan x="906" dy="20">on contract must be implemented</tspan><tspan x="906" dy="20">. It is not an IBM managed queue</tspan><tspan x="906" dy="20"> or proof of a production ticket-sy</tspan><tspan x="906" dy="20">stem integration.</tspan><tspan x="906" dy="20">Local synthetic fixture</tspan></text></g><g><rect x="890" y="610" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">Existing CRM</tspan><tspan x="906" dy="20">Client-owned CRM, vendor and </tspan><tspan x="906" dy="20">API unspecified. Application recei</tspan><tspan x="906" dy="20">ves read-only access to authoriz</tspan><tspan x="906" dy="20">ed customer records and allowlist</tspan><tspan x="906" dy="20">s permitted fields before model in</tspan><tspan x="906" dy="20">put. Local qualification uses synt</tspan><tspan x="906" dy="20">hetic CRM fixtures, not live custo</tspan><tspan x="906" dy="20">mer records. No customer-record</tspan><tspan x="906" dy="20"> write integration.</tspan><tspan x="906" dy="20">Existing placement; country unre</tspan><tspan x="906" dy="20">solved</tspan></text></g><g><rect x="50" y="750" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="776" font-size="14"><tspan x="66" dy="0">Approved knowledge source</tspan><tspan x="66" dy="20">External source reference; locati</tspan><tspan x="66" dy="20">on and API remain unknown. Su</tspan><tspan x="66" dy="20">pplies approved content, source i</tspan><tspan x="66" dy="20">dentifiers, revisions and explicit a</tspan><tspan x="66" dy="20">ccess rules. Content is untrusted </tspan><tspan x="66" dy="20">input even when approved. Local</tspan><tspan x="66" dy="20"> qualification uses synthetic docu</tspan><tspan x="66" dy="20">ments and ACLs.</tspan><tspan x="66" dy="20">Existing placement; country unre</tspan><tspan x="66" dy="20">solved</tspan></text></g><g><rect x="890" y="890" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="916" font-size="14"><tspan x="906" dy="0">Approved knowledge snapshots</tspan><tspan x="906" dy="20">IBM Cloud Object Storage</tspan><tspan x="906" dy="20">Private IBM Cloud Object Storag</tspan><tspan x="906" dy="20">e for versioned approved knowle</tspan><tspan x="906" dy="20">dge snapshots. Application-mana</tspan><tspan x="906" dy="20">ged ingestion records source revi</tspan><tspan x="906" dy="20">sion and ACL metadata; read-tim</tspan><tspan x="906" dy="20">e approval and authorization che</tspan><tspan x="906" dy="20">cks are required. Retention, encr</tspan><tspan x="906" dy="20">yption and deletion policies remai</tspan><tspan x="906" dy="20">n to be agreed. Broader applicati</tspan><tspan x="906" dy="20">on integration is not covered by t</tspan><tspan x="906" dy="20">he narrow private-storage genera</tspan><tspan x="906" dy="20">tor.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1170" width="240" height="452" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1196" font-size="14"><tspan x="906" dy="0">Authorized catalog and workflow </tspan><tspan x="906" dy="20">state</tspan><tspan x="906" dy="20">IBM Cloud Databases for Postgr</tspan><tspan x="906" dy="20">eSQL</tspan><tspan x="906" dy="20">One PostgreSQL deployment sto</tspan><tspan x="906" dy="20">res tenant/customer-scoped kno</tspan><tspan x="906" dy="20">wledge metadata and searchable</tspan><tspan x="906" dy="20"> text, trusted staff mappings, appr</tspan><tspan x="906" dy="20">ovals, update outbox, idempoten</tspan><tspan x="906" dy="20">cy keys and application audit eve</tspan><tspan x="906" dy="20">nts. Proposed SQL keyword retri</tspan><tspan x="906" dy="20">eval filters authorization before s</tspan><tspan x="906" dy="20">electing content and rechecks re</tspan><tspan x="906" dy="20">visions before drafting. Transacti</tspan><tspan x="906" dy="20">ons and source reconciliation pro</tspan><tspan x="906" dy="20">tect retries; database state alone </tspan><tspan x="906" dy="20">cannot guarantee remote exactly</tspan><tspan x="906" dy="20">-once updates. Schema, retentio</tspan><tspan x="906" dy="20">n and recovery require engineeri</tspan><tspan x="906" dy="20">ng.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1450" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1476" font-size="14"><tspan x="906" dy="0">Grounded draft generation</tspan><tspan x="906" dy="20">IBM watsonx.ai</tspan><tspan x="906" dy="20">IBM watsonx.ai inference candid</tspan><tspan x="906" dy="20">ate. Receives only authorized ap</tspan><tspan x="906" dy="20">proved passages and allowlisted </tspan><tspan x="906" dy="20">customer context; produces a dra</tspan><tspan x="906" dy="20">ft with source references or abste</tspan><tspan x="906" dy="20">ntion. The application checks ref</tspan><tspan x="906" dy="20">erences and escalates unsupport</tspan><tspan x="906" dy="20">ed promises. Exact model, region</tspan><tspan x="906" dy="20">al inference, entitlement, API and</tspan><tspan x="906" dy="20"> quality remain unverified. Local s</tspan><tspan x="906" dy="20">cripted responses do not validate</tspan><tspan x="906" dy="20"> a real model.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1730" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1756" font-size="14"><tspan x="906" dy="0">Application credentials</tspan><tspan x="906" dy="20">IBM Cloud Secrets Manager</tspan><tspan x="906" dy="20">Stores source/API credentials for</tspan><tspan x="906" dy="20"> application retrieval using scope</tspan><tspan x="906" dy="20">d service access. Keep values ou</tspan><tspan x="906" dy="20">tside the diagram and code. Cred</tspan><tspan x="906" dy="20">ential provisioning, rotation and C</tspan><tspan x="906" dy="20">ode Engine integration require im</tspan><tspan x="906" dy="20">plementation and verification.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="2010" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="2036" font-size="14"><tspan x="906" dy="0">Redacted operational logs</tspan><tspan x="906" dy="20">IBM Cloud Logs</tspan><tspan x="906" dy="20">IBM Cloud Logs candidate for re</tspan><tspan x="906" dy="20">dacted application diagnostics, a</tspan><tspan x="906" dy="20">uthorization denials, correlation I</tspan><tspan x="906" dy="20">Ds, integration failures and escal</tspan><tspan x="906" dy="20">ation events. Durable business a</tspan><tspan x="906" dy="20">pprovals and update history live i</tspan><tspan x="906" dy="20">n PostgreSQL. Exclude raw cust</tspan><tspan x="906" dy="20">omer fields, prompts and credenti</tspan><tspan x="906" dy="20">als. Routing, access, retention an</tspan><tspan x="906" dy="20">d alert ownership require enginee</tspan><tspan x="906" dy="20">ring; ingestion and regional supp</tspan><tspan x="906" dy="20">ort are unverified.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g></g></svg>