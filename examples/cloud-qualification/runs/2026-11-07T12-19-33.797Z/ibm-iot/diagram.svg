<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1462" viewBox="-50 -90 2070 1462"><rect x="-50" y="-90" width="2070" height="1462" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Synthetic sensor anomaly detection on IBM Cloud · r2</tspan></text><path d="M290,696 C380,696 380,726 470,726" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="532" width="210" height="44" fill="white"/><text x="380" y="550" text-anchor="middle" font-size="12"><tspan x="380" dy="0">Kafka produce telemetry.</tspan><tspan x="380" dy="18">raw</tspan></text><path d="M710,726 C800,726 800,746 890,746" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="532" width="210" height="44" fill="white"/><text x="800" y="550" text-anchor="middle" font-size="12"><tspan x="800" dy="0">consume + replay from o</tspan><tspan x="800" dy="18">ffset</tspan></text><path d="M1130,746 C1220,746 1220,126 1310,126" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">lookup device &amp; units</tspan></text><path d="M890,746 C800,746 800,726 710,726" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="532" width="210" height="44" fill="white"/><text x="800" y="550" text-anchor="middle" font-size="12"><tspan x="800" dy="0">rejects to telemetry.reject</tspan><tspan x="800" dy="18">ed</tspan></text><path d="M1130,746 C1220,746 1220,426 1310,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">score request</tspan></text><path d="M1130,746 C1220,746 1220,716 1310,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">idempotent upsert result</tspan></text><path d="M1130,746 C1220,746 1220,976 1310,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">publish anomaly alert</tspan></text><path d="M1550,976 C1640,976 1640,946 1730,946" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="830" width="210" height="26" fill="white"/><text x="1640" y="848" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">notify</tspan></text><path d="M1130,746 C1220,746 1220,1246 1310,1246" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="550" width="210" height="26" fill="white"/><text x="1220" y="568" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">metrics</tspan></text><g><rect x="50" y="610" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="636" font-size="14"><tspan x="66" dy="0">Synthetic device publisher</tspan><tspan x="66" dy="20">An external test publisher sends </tspan><tspan x="66" dy="20">synthetic telemetry: device_id, ev</tspan><tspan x="66" dy="20">ent_id, timestamp, value and unit</tspan><tspan x="66" dy="20">. It sits outside the provisioning s</tspan><tspan x="66" dy="20">cope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="610" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="636" font-size="14"><tspan x="486" dy="0">Telemetry buffer</tspan><tspan x="486" dy="20">IBM Event Streams</tspan><tspan x="486" dy="20">A Kafka topic (telemetry.raw) key</tspan><tspan x="486" dy="20">ed by device_id keeps order per </tspan><tspan x="486" dy="20">device. Retention allows replay a</tspan><tspan x="486" dy="20">fter a disconnect, and consumers</tspan><tspan x="486" dy="20"> resume from committed offsets. </tspan><tspan x="486" dy="20">A telemetry.rejected topic holds i</tspan><tspan x="486" dy="20">nvalid events with a reason.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="610" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">Validator &amp; scoring app</tspan><tspan x="906" dy="20">IBM Cloud Code Engine</tspan><tspan x="906" dy="20">Consumer app. It rejects unknow</tspan><tspan x="906" dy="20">n devices and invalid units, keepi</tspan><tspan x="906" dy="20">ng device identity, timestamps an</tspan><tspan x="906" dy="20">d units unchanged. It drops dupli</tspan><tspan x="906" dy="20">cates by device_id + event_id an</tspan><tspan x="906" dy="20">d applies the explicit late/out-of-o</tspan><tspan x="906" dy="20">rder window. It then calls the mod</tspan><tspan x="906" dy="20">el, writes an idempotent result an</tspan><tspan x="906" dy="20">d raises alerts.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Device registry</tspan><tspan x="1326" dy="20">IBM Cloudant</tspan><tspan x="1326" dy="20">Lists known device IDs and the u</tspan><tspan x="1326" dy="20">nits allowed for each sensor. It is </tspan><tspan x="1326" dy="20">read by the validator.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Anomaly model</tspan><tspan x="1326" dy="20">IBM watsonx.ai Runtime</tspan><tspan x="1326" dy="20">Deployed anomaly model that ret</tspan><tspan x="1326" dy="20">urns a score, evidence features a</tspan><tspan x="1326" dy="20">nd a model version. It is mocked i</tspan><tspan x="1326" dy="20">n the local test, and its real qualit</tspan><tspan x="1326" dy="20">y is unvalidated.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Anomaly results</tspan><tspan x="1326" dy="20">IBM Cloud Databases for Postgr</tspan><tspan x="1326" dy="20">eSQL</tspan><tspan x="1326" dy="20">Stores results with a unique key (</tspan><tspan x="1326" dy="20">device_id, event_id), so a duplica</tspan><tspan x="1326" dy="20">te event gives one result. Each re</tspan><tspan x="1326" dy="20">sult records the evidence and mo</tspan><tspan x="1326" dy="20">del version.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="916" font-size="14"><tspan x="1326" dy="0">Operator alert</tspan><tspan x="1326" dy="20">IBM Cloud Event Notifications</tspan><tspan x="1326" dy="20">Sends anomaly alerts that name </tspan><tspan x="1326" dy="20">the device, evidence and model v</tspan><tspan x="1326" dy="20">ersion to the operator destination</tspan><tspan x="1326" dy="20">.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="890" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="916" font-size="14"><tspan x="1746" dy="0">Operator</tspan><tspan x="1746" dy="20">The person who receives and tria</tspan><tspan x="1746" dy="20">ges anomaly alerts.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1170" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1196" font-size="14"><tspan x="1326" dy="0">Pipeline monitoring</tspan><tspan x="1326" dy="20">IBM Cloud Monitoring</tspan><tspan x="1326" dy="20">Tracks consumer lag, reject coun</tspan><tspan x="1326" dy="20">ts, duplicates dropped, late event</tspan><tspan x="1326" dy="20">s and model latency.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>