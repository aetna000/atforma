<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1482" viewBox="-50 -90 1650 1482"><rect x="-50" y="-90" width="1650" height="1482" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM Cloud authenticated conversational assistant · r2</tspan></text><path d="M290,536 C380,536 380,796 470,796" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="210" height="26" fill="white"/><text x="380" y="428" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS chat</tspan></text><path d="M710,796 C800,796 800,146 890,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-28" width="210" height="44" fill="white"/><text x="800" y="-10" text-anchor="middle" font-size="12"><tspan x="800" dy="0">OIDC PKCE sign-in / tok</tspan><tspan x="800" dy="18">en validation</tspan></text><path d="M710,796 C800,796 800,436 890,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="252" width="210" height="44" fill="white"/><text x="800" y="270" text-anchor="middle" font-size="12"><tspan x="800" dy="0">read/write/delete own co</tspan><tspan x="800" dy="18">nversations</tspan></text><path d="M710,796 C800,796 800,716 890,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="532" width="210" height="44" fill="white"/><text x="800" y="550" text-anchor="middle" font-size="12"><tspan x="800" dy="0">bounded inference requ</tspan><tspan x="800" dy="18">est; returns reply</tspan></text><path d="M710,796 C800,796 800,966 890,966" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="532" width="210" height="44" fill="white"/><text x="800" y="550" text-anchor="middle" font-size="12"><tspan x="800" dy="0">publish approved contex</tspan><tspan x="800" dy="18">t</tspan></text><path d="M1130,966 C1220,966 1220,956 1310,956" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="830" width="210" height="26" fill="white"/><text x="1220" y="848" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">escalation handoff</tspan></text><path d="M290,836 C380,836 380,796 470,796" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="550" width="210" height="26" fill="white"/><text x="380" y="568" text-anchor="middle" font-size="12"><tspan x="380" dy="0">runtime credentials</tspan></text><path d="M710,796 C800,796 800,1256 890,1256" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="550" width="210" height="26" fill="white"/><text x="800" y="568" text-anchor="middle" font-size="12"><tspan x="800" dy="0">logs/audit events</tspan></text><g><rect x="50" y="470" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="496" font-size="14"><tspan x="66" dy="0">Synthetic user (browser)</tspan><tspan x="66" dy="20">Synthetic test user using a brows</tspan><tspan x="66" dy="20">er. A client reference outside the </tspan><tspan x="66" dy="20">provisioning scope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Sign-in</tspan><tspan x="906" dy="20">IBM Cloud App ID</tspan><tspan x="906" dy="20">Handles user sign-in with OIDC a</tspan><tspan x="906" dy="20">uthorization code and PKCE, the</tspan><tspan x="906" dy="20">n issues the tokens that the app </tspan><tspan x="906" dy="20">validates. Uses synthetic user ac</tspan><tspan x="906" dy="20">counts only.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="610" width="240" height="372" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="636" font-size="14"><tspan x="486" dy="0">Assistant application</tspan><tspan x="486" dy="20">IBM Cloud Code Engine</tspan><tspan x="486" dy="20">Hosts the web UI and chat API. V</tspan><tspan x="486" dy="20">alidates App ID tokens and enfor</tspan><tspan x="486" dy="20">ces conversation ownership by to</tspan><tspan x="486" dy="20">ken subject. Bounds context with </tspan><tspan x="486" dy="20">a size limit and trims older turns, </tspan><tspan x="486" dy="20">and caps response length. If the </tspan><tspan x="486" dy="20">model times out or is unavailable,</tspan><tspan x="486" dy="20"> returns a recoverable &apos;try again&apos; r</tspan><tspan x="486" dy="20">esponse without losing the stored</tspan><tspan x="486" dy="20"> conversation. Deleting a convers</tspan><tspan x="486" dy="20">ation removes its stored context. </tspan><tspan x="486" dy="20">Escalation sends only the context</tspan><tspan x="486" dy="20"> the user approved. Takes no ext</tspan><tspan x="486" dy="20">ernal actions.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Conversation state</tspan><tspan x="906" dy="20">IBM Cloudant</tspan><tspan x="906" dy="20">Per-user conversation document</tspan><tspan x="906" dy="20">s, partitioned by user subject. Th</tspan><tspan x="906" dy="20">e app is the only writer. Delete re</tspan><tspan x="906" dy="20">moves the conversation docume</tspan><tspan x="906" dy="20">nts; backup and retention behavi</tspan><tspan x="906" dy="20">our must be confirmed.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="610" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">Model runtime</tspan><tspan x="906" dy="20">IBM watsonx.ai</tspan><tspan x="906" dy="20">Foundation model inference with </tspan><tspan x="906" dy="20">a bounded number of input and o</tspan><tspan x="906" dy="20">utput tokens. The model, region </tspan><tspan x="906" dy="20">availability and project access stil</tspan><tspan x="906" dy="20">l need to be chosen and verified. </tspan><tspan x="906" dy="20">Mocked in the local test.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="890" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="916" font-size="14"><tspan x="906" dy="0">Escalation queue</tspan><tspan x="906" dy="20">IBM Event Streams</tspan><tspan x="906" dy="20">Topic carrying escalation records </tspan><tspan x="906" dy="20">that contain only the approved co</tspan><tspan x="906" dy="20">nversation context.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="890" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="916" font-size="14"><tspan x="1326" dy="0">Human support agent</tspan><tspan x="1326" dy="20">Person who handles escalated c</tspan><tspan x="1326" dy="20">onversations. The review tool is s</tspan><tspan x="1326" dy="20">till to be decided.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="50" y="750" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="776" font-size="14"><tspan x="66" dy="0">Secrets</tspan><tspan x="66" dy="20">IBM Cloud Secrets Manager</tspan><tspan x="66" dy="20">Stores API keys and credentials f</tspan><tspan x="66" dy="20">or Cloudant, watsonx.ai and Eve</tspan><tspan x="66" dy="20">nt Streams. Credentials never ap</tspan><tspan x="66" dy="20">pear in the diagram.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1170" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1196" font-size="14"><tspan x="906" dy="0">Logs and audit</tspan><tspan x="906" dy="20">IBM Cloud Logs</tspan><tspan x="906" dy="20">Application logs and audit events</tspan><tspan x="906" dy="20">, without conversation content. Tr</tspan><tspan x="906" dy="20">acks model failures and denied c</tspan><tspan x="906" dy="20">ross-user requests.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g></g></svg>