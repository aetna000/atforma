<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="782" viewBox="-50 -90 2910 782"><rect x="-50" y="-90" width="2910" height="782" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM log/trace incident analysis · r2</tspan></text><path d="M290,406 C380,406 380,436 470,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="270" width="210" height="26" fill="white"/><text x="380" y="288" text-anchor="middle" font-size="12"><tspan x="380" dy="0">OTLP logs + spans</tspan></text><path d="M710,436 C800,436 800,426 890,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="270" width="210" height="26" fill="white"/><text x="800" y="288" text-anchor="middle" font-size="12"><tspan x="800" dy="0">raw batches</tspan></text><path d="M1130,426 C1220,426 1220,491 1310,491" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="252" width="210" height="44" fill="white"/><text x="1220" y="270" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted batch (versione</tspan><tspan x="1220" dy="18">d)</tspan></text><path d="M1130,426 C1220,426 1220,221 1310,221" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="65" width="210" height="26" fill="white"/><text x="1220" y="83" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">idempotent upsert</tspan></text><path d="M1550,221 C1640,221 1640,486 1730,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="47" width="210" height="44" fill="white"/><text x="1640" y="65" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">read-only evidence quer</tspan><tspan x="1640" dy="18">y</tspan></text><path d="M1550,491 C1640,491 1640,486 1730,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">timeline rebuild</tspan></text><path d="M1970,486 C2060,486 2060,146 2150,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-28" width="210" height="44" fill="white"/><text x="2060" y="-10" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">redacted evidence prom</tspan><tspan x="2060" dy="18">pt</tspan></text><path d="M2390,386 C2480,386 2480,471 2570,471" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="270" width="210" height="26" fill="white"/><text x="2480" y="288" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">sign in</tspan></text><path d="M2570,471 C2270,471 2270,486 1970,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2165" y="270" width="210" height="26" fill="white"/><text x="2270" y="288" text-anchor="middle" font-size="12"><tspan x="2270" dy="0">token</tspan></text><path d="M1970,486 C2060,486 2060,386 2150,386" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="252" width="210" height="44" fill="white"/><text x="2060" y="270" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">answer citing trace/log I</tspan><tspan x="2060" dy="18">Ds</tspan></text><g><rect x="50" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Synthetic services</tspan><tspan x="66" dy="20">Existing synthetic workloads that </tspan><tspan x="66" dy="20">emit logs and OpenTelemetry tra</tspan><tspan x="66" dy="20">ces. Log text is treated as untrust</tspan><tspan x="66" dy="20">ed.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">OTel collector</tspan><tspan x="486" dy="20">IBM Cloud Code Engine</tspan><tspan x="486" dy="20">OpenTelemetry Collector app on </tspan><tspan x="486" dy="20">Code Engine. Receives logs and </tspan><tspan x="486" dy="20">spans, adds batch IDs and a det</tspan><tspan x="486" dy="20">erministic event key (trace_id/spa</tspan><tspan x="486" dy="20">n_id/log_id plus hash) so repeate</tspan><tspan x="486" dy="20">d ingestion stays idempotent.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Redaction worker</tspan><tspan x="906" dy="20">IBM Cloud Code Engine</tspan><tspan x="906" dy="20">Separate Code Engine job that m</tspan><tspan x="906" dy="20">asks secrets and tokens before a</tspan><tspan x="906" dy="20">nything is stored or sent to the m</tspan><tspan x="906" dy="20">odel. Records redaction counts b</tspan><tspan x="906" dy="20">ut never the original values.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="405" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="431" font-size="14"><tspan x="1326" dy="0">Redacted event archive</tspan><tspan x="1326" dy="20">IBM Cloud Object Storage</tspan><tspan x="1326" dy="20">Versioned bucket holding redacte</tspan><tspan x="1326" dy="20">d batches keyed by event key, so</tspan><tspan x="1326" dy="20"> the incident timeline can be rebu</tspan><tspan x="1326" dy="20">ilt consistently.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="125" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="151" font-size="14"><tspan x="1326" dy="0">Log/trace search index</tspan><tspan x="1326" dy="20">IBM Cloud Databases for OpenS</tspan><tspan x="1326" dy="20">earch</tspan><tspan x="1326" dy="20">Indexes redacted logs and spans</tspan><tspan x="1326" dy="20"> by trace_id, span_id, log_id and </tspan><tspan x="1326" dy="20">timestamp. Upserts use the even</tspan><tspan x="1326" dy="20">t key to prevent duplicates.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="312" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Incident analysis runtime</tspan><tspan x="1746" dy="20">IBM Cloud Code Engine</tspan><tspan x="1746" dy="20">Builds the timeline, detects missi</tspan><tspan x="1746" dy="20">ng spans, and sends log text to t</tspan><tspan x="1746" dy="20">he model as quoted data only, ne</tspan><tspan x="1746" dy="20">ver as instructions. It has no write</tspan><tspan x="1746" dy="20"> tools, and model output cannot tr</tspan><tspan x="1746" dy="20">igger tool calls. A validator reject</tspan><tspan x="1746" dy="20">s any conclusion that does not cit</tspan><tspan x="1746" dy="20">e an existing trace or log ID and r</tspan><tspan x="1746" dy="20">eturns &apos;uncertain&apos; when there are </tspan><tspan x="1746" dy="20">gaps. It also serves the cited ans</tspan><tspan x="1746" dy="20">wer to operators.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">LLM</tspan><tspan x="2166" dy="20">IBM watsonx.ai</tspan><tspan x="2166" dy="20">Foundation model inference on r</tspan><tspan x="2166" dy="20">edacted evidence only. The mod</tspan><tspan x="2166" dy="20">el choice, region availability and </tspan><tspan x="2166" dy="20">entitlement have not been check</tspan><tspan x="2166" dy="20">ed yet.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="405" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="431" font-size="14"><tspan x="2586" dy="0">Operator sign-in</tspan><tspan x="2586" dy="20">IBM Cloud App ID</tspan><tspan x="2586" dy="20">Authenticates operators before th</tspan><tspan x="2586" dy="20">ey can use the analysis app.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">On-call operator</tspan><tspan x="2166" dy="20">Person asking about an incident </tspan><tspan x="2166" dy="20">and reviewing the cited answer.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g></g></svg>