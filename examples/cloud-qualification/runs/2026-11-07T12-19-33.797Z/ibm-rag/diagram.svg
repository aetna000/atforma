<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="912" viewBox="-50 -90 2070 912"><rect x="-50" y="-90" width="2070" height="912" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">IBM Cloud synthetic RAG qualification · r2</tspan></text><path d="M710,116 C800,116 800,136 890,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">upload docs + ACLs</tspan></text><path d="M1130,136 C1220,136 1220,146 1310,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">changed objects</tspan></text><path d="M1550,146 C1640,146 1640,166 1730,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">conditional upsert/delete</tspan></text><path d="M290,406 C380,406 380,426 470,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="280" width="210" height="26" fill="white"/><text x="380" y="298" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,426 C800,426 800,576 890,576" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="280" width="210" height="26" fill="white"/><text x="800" y="298" text-anchor="middle" font-size="12"><tspan x="800" dy="0">OIDC sign-in (PKCE)</tspan></text><path d="M710,426 C1010,426 1010,476 1310,476" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="280" width="210" height="26" fill="white"/><text x="1010" y="298" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">question + bearer token</tspan></text><path d="M1130,576 C1220,576 1220,476 1310,476" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">token validation keys</tspan></text><path d="M1550,476 C1640,476 1640,166 1730,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-18" width="210" height="44" fill="white"/><text x="1640" y="0" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">ACL-filtered keyword se</tspan><tspan x="1640" dy="18">arch + recheck</tspan></text><path d="M1550,476 C1640,476 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="280" width="210" height="26" fill="white"/><text x="1640" y="298" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">permitted passages only</tspan></text><path d="M1550,476 C1640,476 1640,696 1730,696" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="280" width="210" height="26" fill="white"/><text x="1640" y="298" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">audit events</tspan></text><g><rect x="470" y="50" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Content operator</tspan><tspan x="486" dy="20">Loads synthetic documents with </tspan><tspan x="486" dy="20">explicit ACLs. Outside provisionin</tspan><tspan x="486" dy="20">g scope.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Source documents</tspan><tspan x="906" dy="20">IBM Cloud Object Storage</tspan><tspan x="906" dy="20">Private bucket for synthetic UTF-</tspan><tspan x="906" dy="20">8 documents and ACL manifests.</tspan><tspan x="906" dy="20"> Versioning lets updates and dele</tspan><tspan x="906" dy="20">tions be detected.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Ingestion job</tspan><tspan x="1326" dy="20">IBM Cloud Code Engine (job)</tspan><tspan x="1326" dy="20">Reads changed objects, then writ</tspan><tspan x="1326" dy="20">es document text, keyword terms</tspan><tspan x="1326" dy="20">, ACLs and revision IDs to the cat</tspan><tspan x="1326" dy="20">alog using conditional writes. App</tspan><tspan x="1326" dy="20">lies deletions as tombstones.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="60" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="86" font-size="14"><tspan x="1746" dy="0">RAG catalog</tspan><tspan x="1746" dy="20">IBM Cloudant</tspan><tspan x="1746" dy="20">Bounded catalog of 100 docume</tspan><tspan x="1746" dy="20">nts or fewer: content, keyword in</tspan><tspan x="1746" dy="20">dex, explicit ACLs and current re</tspan><tspan x="1746" dy="20">visions. It is the source of truth fo</tspan><tspan x="1746" dy="20">r permission and revision rechec</tspan><tspan x="1746" dy="20">ks.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="50" y="340" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="366" font-size="14"><tspan x="66" dy="0">Employee browser</tspan><tspan x="66" dy="20">A signed-in user asking question</tspan><tspan x="66" dy="20">s. Client reference, not provision</tspan><tspan x="66" dy="20">ed.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="340" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="366" font-size="14"><tspan x="486" dy="0">Web application</tspan><tspan x="486" dy="20">IBM Cloud Code Engine (app)</tspan><tspan x="486" dy="20">Authenticated chat UI. Shows the</tspan><tspan x="486" dy="20"> cited answer or an abstention. Si</tspan><tspan x="486" dy="20">gns in through App ID with author</tspan><tspan x="486" dy="20">ization code + PKCE.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="490" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="516" font-size="14"><tspan x="906" dy="0">Identity</tspan><tspan x="906" dy="20">IBM Cloud App ID</tspan><tspan x="906" dy="20">User sign-in with MFA. Issues the</tspan><tspan x="906" dy="20"> tokens that the RAG API validat</tspan><tspan x="906" dy="20">es. Unknown identities fail closed</tspan><tspan x="906" dy="20">.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">RAG API</tspan><tspan x="1326" dy="20">IBM Cloud Code Engine (app)</tspan><tspan x="1326" dy="20">Validates the token, filters by AC</tspan><tspan x="1326" dy="20">L before retrieval, runs bounded </tspan><tspan x="1326" dy="20">keyword search and sends only p</tspan><tspan x="1326" dy="20">ermitted passages to the model. </tspan><tspan x="1326" dy="20">Abstains when support is insuffici</tspan><tspan x="1326" dy="20">ent, rechecks ACLs/revisions afte</tspan><tspan x="1326" dy="20">r generation and suppresses the </tspan><tspan x="1326" dy="20">answer if access was revoked. R</tspan><tspan x="1326" dy="20">eturns citations with revision IDs.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">Model runtime</tspan><tspan x="1746" dy="20">IBM watsonx.ai</tspan><tspan x="1746" dy="20">Foundation-model inference for g</tspan><tspan x="1746" dy="20">rounded answers. The model ID, </tspan><tspan x="1746" dy="20">regional availability and entitleme</tspan><tspan x="1746" dy="20">nt are not yet verified. Local tests</tspan><tspan x="1746" dy="20"> use mocked responses.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="620" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="646" font-size="14"><tspan x="1746" dy="0">Audit &amp; logs</tspan><tspan x="1746" dy="20">IBM Cloud Logs</tspan><tspan x="1746" dy="20">Request, denial, abstention and r</tspan><tspan x="1746" dy="20">evocation-suppression events, wi</tspan><tspan x="1746" dy="20">th no document text.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>