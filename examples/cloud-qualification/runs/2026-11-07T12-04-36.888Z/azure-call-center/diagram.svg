<svg xmlns="http://www.w3.org/2000/svg" width="3750" height="1362" viewBox="-50 -90 3750 1362"><rect x="-50" y="-90" width="3750" height="1362" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure agent-assist for synthetic support calls · r2</tspan></text><path d="M290,761 C380,761 380,811 470,811" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="635" width="210" height="26" fill="white"/><text x="380" y="653" text-anchor="middle" font-size="12"><tspan x="380" dy="0">inbound call</tspan></text><path d="M710,811 C800,811 800,791 890,791" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="635" width="210" height="26" fill="white"/><text x="800" y="653" text-anchor="middle" font-size="12"><tspan x="800" dy="0">consent response</tspan></text><path d="M1130,791 C1220,791 1220,416 1310,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">audio only if consented</tspan></text><path d="M1130,791 C2060,791 2060,1136 2990,1136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="635" width="210" height="26" fill="white"/><text x="2060" y="653" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">consent record</tspan></text><path d="M1550,416 C1640,416 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="280" width="210" height="26" fill="white"/><text x="1640" y="298" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">raw transcript segments</tspan></text><path d="M1970,436 C2060,436 2060,456 2150,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="280" width="210" height="26" fill="white"/><text x="2060" y="298" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">redacted transcript</tspan></text><path d="M2390,456 C2480,456 2480,136 2570,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="-10" width="210" height="26" fill="white"/><text x="2480" y="8" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">retrieve articles</tspan></text><path d="M2390,456 C2480,456 2480,426 2570,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="252" width="210" height="44" fill="white"/><text x="2480" y="270" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">grounded prompt (redact</tspan><tspan x="2480" dy="18">ed)</tspan></text><path d="M2390,456 C2480,456 2480,706 2570,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="262" width="210" height="44" fill="white"/><text x="2480" y="280" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">cited suggestions, summ</tspan><tspan x="2480" dy="18">ary &amp; CRM drafts</tspan></text><path d="M2390,986 C2480,986 2480,706 2570,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="550" width="210" height="26" fill="white"/><text x="2480" y="568" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">agent sign-in</tspan></text><path d="M2810,706 C2900,706 2900,676 2990,676" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="550" width="210" height="26" fill="white"/><text x="2900" y="568" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">review &amp; approve</tspan></text><path d="M2810,706 C2900,706 2900,1136 2990,1136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="532" width="210" height="44" fill="white"/><text x="2900" y="550" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">approved summary + au</tspan><tspan x="2900" dy="18">dit</tspan></text><path d="M3230,676 C3320,676 3320,686 3410,686" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3215" y="532" width="210" height="44" fill="white"/><text x="3320" y="550" text-anchor="middle" font-size="12"><tspan x="3320" dy="0">manual save of approve</tspan><tspan x="3320" dy="18">d draft</tspan></text><path d="M2390,456 C2480,456 2480,976 2570,976" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="280" width="210" height="26" fill="white"/><text x="2480" y="298" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">telemetry</tspan></text><g><rect x="50" y="695" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="721" font-size="14"><tspan x="66" dy="0">Synthetic caller</tspan><tspan x="66" dy="20">Test caller placing synthetic inbo</tspan><tspan x="66" dy="20">und calls. Outside provisioning sc</tspan><tspan x="66" dy="20">ope.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="695" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="721" font-size="14"><tspan x="486" dy="0">Call intake &amp; audio stream</tspan><tspan x="486" dy="20">Azure Communication Services (</tspan><tspan x="486" dy="20">Call Automation, media streamin</tspan><tspan x="486" dy="20">g)</tspan><tspan x="486" dy="20">Answers inbound calls only and p</tspan><tspan x="486" dy="20">lays the consent prompt. Stream</tspan><tspan x="486" dy="20">s audio only after consent is reco</tspan><tspan x="486" dy="20">rded. Outbound calling is not ena</tspan><tspan x="486" dy="20">bled.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="695" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="721" font-size="14"><tspan x="906" dy="0">Consent gate</tspan><tspan x="906" dy="20">Azure Functions</tspan><tspan x="906" dy="20">Records the caller&apos;s consent deci</tspan><tspan x="906" dy="20">sion with a timestamp and call ID</tspan><tspan x="906" dy="20"> in Cosmos DB. Blocks transcripti</tspan><tspan x="906" dy="20">on when consent is refused or mi</tspan><tspan x="906" dy="20">ssing (fail closed).</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">Real-time transcription</tspan><tspan x="1326" dy="20">Azure AI Speech (real-time spee</tspan><tspan x="1326" dy="20">ch to text)</tspan><tspan x="1326" dy="20">Turns consented audio into a live</tspan><tspan x="1326" dy="20"> transcript, labelled by speaker.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">PII redaction</tspan><tspan x="1746" dy="20">Azure AI Language (PII detection</tspan><tspan x="1746" dy="20">)</tspan><tspan x="1746" dy="20">Redacts personal data from trans</tspan><tspan x="1746" dy="20">cript segments before any promp</tspan><tspan x="1746" dy="20">t, storage or display beyond the li</tspan><tspan x="1746" dy="20">ve call.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="340" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="366" font-size="14"><tspan x="2166" dy="0">Agent-assist orchestrator</tspan><tspan x="2166" dy="20">Azure Container Apps</tspan><tspan x="2166" dy="20">Retrieves knowledge for redacte</tspan><tspan x="2166" dy="20">d transcript turns and asks the m</tspan><tspan x="2166" dy="20">odel for cited suggestions. Drafts </tspan><tspan x="2166" dy="20">the call summary and the CRM u</tspan><tspan x="2166" dy="20">pdate. It has read-only tools and </tspan><tspan x="2166" dy="20">no CRM write or calling permissi</tspan><tspan x="2166" dy="20">on.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="76" font-size="14"><tspan x="2586" dy="0">Knowledge index</tspan><tspan x="2586" dy="20">Azure AI Search</tspan><tspan x="2586" dy="20">Index of approved support article</tspan><tspan x="2586" dy="20">s used to ground suggestions. So</tspan><tspan x="2586" dy="20">urce content is treated as untrust</tspan><tspan x="2586" dy="20">ed data.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="356" font-size="14"><tspan x="2586" dy="0">Language model</tspan><tspan x="2586" dy="20">Azure OpenAI Service</tspan><tspan x="2586" dy="20">Model deployment for suggestion</tspan><tspan x="2586" dy="20">s and summaries. It only receives</tspan><tspan x="2586" dy="20"> redacted text. The model, region</tspan><tspan x="2586" dy="20"> and quota are still to be chosen </tspan><tspan x="2586" dy="20">and checked.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="636" font-size="14"><tspan x="2586" dy="0">Agent desktop</tspan><tspan x="2586" dy="20">Azure App Service (web app)</tspan><tspan x="2586" dy="20">Shows live suggestions with sour</tspan><tspan x="2586" dy="20">ces. The agent edits and approve</tspan><tspan x="2586" dy="20">s the summary and CRM draft. N</tspan><tspan x="2586" dy="20">othing is sent onward without app</tspan><tspan x="2586" dy="20">roval.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="910" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="936" font-size="14"><tspan x="2166" dy="0">Agent sign-in</tspan><tspan x="2166" dy="20">Microsoft Entra ID</tspan><tspan x="2166" dy="20">Signs agents in to the desktop ap</tspan><tspan x="2166" dy="20">p and assigns roles. The tenant i</tspan><tspan x="2166" dy="20">s not yet confirmed.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="610" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="636" font-size="14"><tspan x="3006" dy="0">Support agent</tspan><tspan x="3006" dy="20">Person who handles the call, app</tspan><tspan x="3006" dy="20">roves the summary and manually</tspan><tspan x="3006" dy="20"> saves the CRM draft.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="3410" y="610" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3426" y="636" font-size="14"><tspan x="3426" dy="0">Existing CRM</tspan><tspan x="3426" dy="20">The current CRM, product not yet</tspan><tspan x="3426" dy="20"> named. The system has no write</tspan><tspan x="3426" dy="20"> access. Only the agent saves th</tspan><tspan x="3426" dy="20">e update.</tspan><tspan x="3426" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="1050" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="1076" font-size="14"><tspan x="3006" dy="0">Call records</tspan><tspan x="3006" dy="20">Azure Cosmos DB</tspan><tspan x="3006" dy="20">Stores the consent record, redact</tspan><tspan x="3006" dy="20">ed transcript, approved summary,</tspan><tspan x="3006" dy="20"> CRM draft and approval audit tra</tspan><tspan x="3006" dy="20">il. Retention is not yet decided.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="890" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="916" font-size="14"><tspan x="2586" dy="0">Monitoring &amp; audit</tspan><tspan x="2586" dy="20">Azure Monitor / Application Insig</tspan><tspan x="2586" dy="20">hts</tspan><tspan x="2586" dy="20">Collects traces, latency, errors an</tspan><tspan x="2586" dy="20">d redaction failures. Logs exclud</tspan><tspan x="2586" dy="20">e raw PII.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>