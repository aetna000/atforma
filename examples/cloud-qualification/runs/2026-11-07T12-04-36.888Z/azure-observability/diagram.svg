<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1232" viewBox="-50 -90 2070 1232"><rect x="-50" y="-90" width="2070" height="1232" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure synthetic incident correlation (logs + traces) · r2</tspan></text><path d="M290,136 C380,136 380,166 470,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">OTLP logs + spans</tspan></text><path d="M710,166 C800,166 800,156 890,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Event Hubs trigger</tspan></text><path d="M1130,156 C1220,156 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted ingest</tspan></text><path d="M1130,986 C1220,986 1220,996 1310,996" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="822" width="210" height="44" fill="white"/><text x="1220" y="840" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">incident question (Entra </tspan><tspan x="1220" dy="18">sign-in)</tspan></text><path d="M1310,996 C1220,996 1220,656 1130,656" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="460" width="210" height="26" fill="white"/><text x="1220" y="478" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">analysis request</tspan></text><path d="M1130,656 C1220,656 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-28" width="210" height="44" fill="white"/><text x="1220" y="-10" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read-only KQL correlatio</tspan><tspan x="1220" dy="18">n</tspan></text><path d="M1130,656 C1220,656 1220,446 1310,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">screen evidence</tspan></text><path d="M1550,446 C1640,446 1640,446 1730,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="262" width="210" height="44" fill="white"/><text x="1640" y="280" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">delimited evidence prom</tspan><tspan x="1640" dy="18">pt</tspan></text><path d="M1130,656 C1220,656 1220,996 1310,996" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="460" width="210" height="26" fill="white"/><text x="1220" y="478" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">answer + cited evidence</tspan></text><path d="M1130,656 C1220,656 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="460" width="210" height="26" fill="white"/><text x="1220" y="478" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">telemetry</tspan></text><path d="M1130,156 C1220,156 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redaction metrics</tspan></text><g><rect x="50" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Synthetic services (logs + traces)</tspan><tspan x="66" dy="20">Existing synthetic workloads instr</tspan><tspan x="66" dy="20">umented with OpenTelemetry. Th</tspan><tspan x="66" dy="20">ey emit logs and distributed trace</tspan><tspan x="66" dy="20">s for the incident scenario. Their </tspan><tspan x="66" dy="20">content is untrusted.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Telemetry collection</tspan><tspan x="486" dy="20">Azure Event Hubs (via OpenTele</tspan><tspan x="486" dy="20">metry Collector)</tspan><tspan x="486" dy="20">An OpenTelemetry Collector exp</tspan><tspan x="486" dy="20">orts OTLP logs/spans to an Even</tspan><tspan x="486" dy="20">t Hubs namespace. Trace and sp</tspan><tspan x="486" dy="20">an IDs are kept so logs and trace</tspan><tspan x="486" dy="20">s can be correlated. Authenticatio</tspan><tspan x="486" dy="20">n uses managed identity.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Redaction</tspan><tspan x="906" dy="20">Azure Functions (Event Hubs trig</tspan><tspan x="906" dy="20">ger)</tspan><tspan x="906" dy="20">Masks secrets, tokens, emails an</tspan><tspan x="906" dy="20">d IPs using reviewed rules before</tspan><tspan x="906" dy="20"> storage, and records a redaction</tspan><tspan x="906" dy="20"> audit count. Raw events aren&apos;t p</tspan><tspan x="906" dy="20">ersisted after redaction.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Log &amp; trace store / search</tspan><tspan x="1326" dy="20">Azure Data Explorer</tspan><tspan x="1326" dy="20">Stores the redacted logs and spa</tspan><tspan x="1326" dy="20">ns in separate tables joined on tr</tspan><tspan x="1326" dy="20">ace_id. The analysis runtime run</tspan><tspan x="1326" dy="20">s read-only KQL queries over tim</tspan><tspan x="1326" dy="20">e windows and services. Retentio</tspan><tspan x="1326" dy="20">n still needs to be decided.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="520" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="546" font-size="14"><tspan x="906" dy="0">Incident analysis runtime</tspan><tspan x="906" dy="20">Azure Container Apps</tspan><tspan x="906" dy="20">Takes an operator&apos;s question and</tspan><tspan x="906" dy="20"> runs bounded, read-only KQL qu</tspan><tspan x="906" dy="20">eries to correlate error spans with</tspan><tspan x="906" dy="20"> logs. It sends delimited evidence</tspan><tspan x="906" dy="20"> to the model as untrusted data, c</tspan><tspan x="906" dy="20">hecks that every claim cites an e</tspan><tspan x="906" dy="20">vidence ID, and abstains if the ev</tspan><tspan x="906" dy="20">idence is insufficient. It does not t</tspan><tspan x="906" dy="20">ake any actions.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">Prompt-injection screening</tspan><tspan x="1326" dy="20">Azure AI Content Safety (Prompt </tspan><tspan x="1326" dy="20">Shields)</tspan><tspan x="1326" dy="20">Screens retrieved log text for inje</tspan><tspan x="1326" dy="20">cted instructions before it is sent t</tspan><tspan x="1326" dy="20">o the model. Flagged excerpts ar</tspan><tspan x="1326" dy="20">e quarantined and shown to the o</tspan><tspan x="1326" dy="20">perator.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="340" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">LLM</tspan><tspan x="1746" dy="20">Azure OpenAI Service</tspan><tspan x="1746" dy="20">Hosts the model deployment use</tspan><tspan x="1746" dy="20">d for the incident explanation. Wh</tspan><tspan x="1746" dy="20">ich model to use and its regional </tspan><tspan x="1746" dy="20">availability are unverified. Local t</tspan><tspan x="1746" dy="20">ests use scripted responses inste</tspan><tspan x="1746" dy="20">ad.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="900" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="926" font-size="14"><tspan x="1326" dy="0">Operator incident console</tspan><tspan x="1326" dy="20">Azure App Service (Entra ID sign</tspan><tspan x="1326" dy="20">-in)</tspan><tspan x="1326" dy="20">A web UI where operators ask ab</tspan><tspan x="1326" dy="20">out an incident and get a timeline</tspan><tspan x="1326" dy="20">, a probable cause and linked log</tspan><tspan x="1326" dy="20">/span evidence.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="930" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="956" font-size="14"><tspan x="906" dy="0">On-call operator</tspan><tspan x="906" dy="20">The person investigating the inci</tspan><tspan x="906" dy="20">dent. External to provisioning.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="620" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="646" font-size="14"><tspan x="1326" dy="0">Pipeline observability</tspan><tspan x="1326" dy="20">Azure Monitor + Application Insig</tspan><tspan x="1326" dy="20">hts</tspan><tspan x="1326" dy="20">Monitors the pipeline itself: ingest</tspan><tspan x="1326" dy="20">ion lag, redaction failures, model </tspan><tspan x="1326" dy="20">latency/errors and abstentions.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>