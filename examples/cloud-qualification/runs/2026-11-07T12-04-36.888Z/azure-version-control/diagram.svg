<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="942" viewBox="-50 -90 2490 942"><rect x="-50" y="-90" width="2490" height="942" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure PR review assistant (synthetic qualification) · r2</tspan></text><path d="M290,436 C380,436 380,221 470,221" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="37" width="210" height="44" fill="white"/><text x="380" y="55" text-anchor="middle" font-size="12"><tspan x="380" dy="0">PR webhook event (sign</tspan><tspan x="380" dy="18">ature validated)</tspan></text><path d="M710,221 C800,221 800,486 890,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="55" width="210" height="26" fill="white"/><text x="800" y="73" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Service Bus trigger</tspan></text><path d="M890,486 C590,486 590,436 290,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="252" width="210" height="44" fill="white"/><text x="590" y="270" text-anchor="middle" font-size="12"><tspan x="590" dy="0">read-only fetch: diff + ch</tspan><tspan x="590" dy="18">anged files</tspan></text><path d="M710,491 C800,491 800,486 890,486" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="252" width="210" height="44" fill="white"/><text x="800" y="270" text-anchor="middle" font-size="12"><tspan x="800" dy="0">managed identity: read t</tspan><tspan x="800" dy="18">oken/secret</tspan></text><path d="M1130,486 C1220,486 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">screen untrusted content</tspan></text><path d="M1130,486 C1220,486 1220,446 1310,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="252" width="210" height="44" fill="white"/><text x="1220" y="270" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">chat completion (structur</tspan><tspan x="1220" dy="18">ed findings)</tspan></text><path d="M1550,446 C1640,446 1640,426 1730,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="252" width="210" height="44" fill="white"/><text x="1640" y="270" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">line-anchored drafts (via </tspan><tspan x="1640" dy="18">orchestrator)</tspan></text><path d="M1970,426 C2060,426 2060,396 2150,396" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="270" width="210" height="26" fill="white"/><text x="2060" y="288" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">drafts for human review</tspan></text><path d="M1130,486 C1220,486 1220,706 1310,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="270" width="210" height="26" fill="white"/><text x="1220" y="288" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">telemetry</tspan></text><g><rect x="50" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Existing Git repository</tspan><tspan x="66" dy="20">Existing Git host (to be confirmed</tspan><tspan x="66" dy="20">)</tspan><tspan x="66" dy="20">The existing repository and its sy</tspan><tspan x="66" dy="20">nthetic PRs. It stays unchanged. </tspan><tspan x="66" dy="20">It sends PR events and serves th</tspan><tspan x="66" dy="20">e diff and files to a read-only toke</tspan><tspan x="66" dy="20">n scoped to this repository.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="115" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="141" font-size="14"><tspan x="486" dy="0">PR event queue</tspan><tspan x="486" dy="20">Azure Service Bus (queue)</tspan><tspan x="486" dy="20">Holds PR events after webhook v</tspan><tspan x="486" dy="20">alidation. Uses a dead-letter que</tspan><tspan x="486" dy="20">ue for failed reviews and deduplic</tspan><tspan x="486" dy="20">ates on PR id plus head commit </tspan><tspan x="486" dy="20">so the same commit is not review</tspan><tspan x="486" dy="20">ed twice.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="312" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Review orchestrator</tspan><tspan x="906" dy="20">Azure Functions</tspan><tspan x="906" dy="20">Validates the webhook signature,</tspan><tspan x="906" dy="20"> then fetches only the authorised </tspan><tspan x="906" dy="20">diff and the changed files it need</tspan><tspan x="906" dy="20">s, within size limits. It builds the p</tspan><tspan x="906" dy="20">rompt, maps findings to changed </tspan><tspan x="906" dy="20">lines and rejects any comment n</tspan><tspan x="906" dy="20">ot anchored to a changed line. It </tspan><tspan x="906" dy="20">has no write, merge or execution </tspan><tspan x="906" dy="20">capability, and repository content </tspan><tspan x="906" dy="20">is treated as untrusted data. It us</tspan><tspan x="906" dy="20">es a managed identity.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="395" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="421" font-size="14"><tspan x="486" dy="0">Secrets</tspan><tspan x="486" dy="20">Azure Key Vault</tspan><tspan x="486" dy="20">Stores the read-only repository to</tspan><tspan x="486" dy="20">ken and the webhook secret. The</tspan><tspan x="486" dy="20"> orchestrator reads them through </tspan><tspan x="486" dy="20">its managed identity. No secrets </tspan><tspan x="486" dy="20">are kept in the diagram.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Prompt-injection screening</tspan><tspan x="1326" dy="20">Azure AI Content Safety (Prompt </tspan><tspan x="1326" dy="20">Shields)</tspan><tspan x="1326" dy="20">Screens the diff and file content f</tspan><tspan x="1326" dy="20">or injected instructions before it r</tspan><tspan x="1326" dy="20">eaches the model. Flagged conte</tspan><tspan x="1326" dy="20">nt is marked and routed to a hum</tspan><tspan x="1326" dy="20">an.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="330" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Review model</tspan><tspan x="1326" dy="20">Azure OpenAI Service (Azure AI </tspan><tspan x="1326" dy="20">Foundry deployment)</tspan><tspan x="1326" dy="20">Analyses the screened diff and re</tspan><tspan x="1326" dy="20">turns structured findings (file, line</tspan><tspan x="1326" dy="20">, comment). The model, quota an</tspan><tspan x="1326" dy="20">d regional availability are unverifi</tspan><tspan x="1326" dy="20">ed. Local tests use a mocked res</tspan><tspan x="1326" dy="20">ponse.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Draft review comments</tspan><tspan x="1746" dy="20">Azure Cosmos DB</tspan><tspan x="1746" dy="20">Stores draft comments keyed by </tspan><tspan x="1746" dy="20">PR, commit, file and line, along w</tspan><tspan x="1746" dy="20">ith their review status and an aud</tspan><tspan x="1746" dy="20">it trail. Nothing is posted until a p</tspan><tspan x="1746" dy="20">erson approves it.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="356" font-size="14"><tspan x="2166" dy="0">Human reviewer</tspan><tspan x="2166" dy="20">Accepts, edits or discards the dra</tspan><tspan x="2166" dy="20">ft comments. Posting them back t</tspan><tspan x="2166" dy="20">o the PR is an open decision.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="610" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="636" font-size="14"><tspan x="1326" dy="0">Monitoring</tspan><tspan x="1326" dy="20">Azure Monitor + Application Insig</tspan><tspan x="1326" dy="20">hts</tspan><tspan x="1326" dy="20">Tracks traces, failures, token use</tspan><tspan x="1326" dy="20"> and dead-letter alerts. Logs met</tspan><tspan x="1326" dy="20">adata only, never repository cont</tspan><tspan x="1326" dy="20">ent.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>