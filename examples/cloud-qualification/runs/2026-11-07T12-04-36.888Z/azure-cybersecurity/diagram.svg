<svg xmlns="http://www.w3.org/2000/svg" width="2910" height="1167" viewBox="-50 -90 2910 1167"><rect x="-50" y="-90" width="2910" height="1167" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure synthetic security-alert triage · r2</tspan></text><path d="M290,556 C380,556 380,566 470,566" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="420" width="210" height="26" fill="white"/><text x="380" y="438" text-anchor="middle" font-size="12"><tspan x="380" dy="0">alert/log events</tspan></text><path d="M710,266 C800,266 800,456 890,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="140" width="210" height="26" fill="white"/><text x="800" y="158" text-anchor="middle" font-size="12"><tspan x="800" dy="0">asset records</tspan></text><path d="M710,566 C800,566 800,456 890,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="280" width="210" height="26" fill="white"/><text x="800" y="298" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Event Hubs trigger</tspan></text><path d="M1130,456 C1220,456 1220,136 1310,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">write redacted evidence</tspan></text><path d="M1550,136 C1640,136 1640,156 1730,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">indexer pull</tspan></text><path d="M1130,456 C1220,456 1220,606 1310,606" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redacted alert</tspan></text><path d="M1550,606 C1640,606 1640,156 1730,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-18" width="210" height="44" fill="white"/><text x="1640" y="0" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">evidence query + citation</tspan><tspan x="1640" dy="18">s</tspan></text><path d="M1550,606 C1640,606 1640,446 1730,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="290" width="210" height="26" fill="white"/><text x="1640" y="308" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">grounded triage prompt</tspan></text><path d="M1550,606 C1640,606 1640,726 1730,726" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="402" width="210" height="44" fill="white"/><text x="1640" y="420" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">triage + response propos</tspan><tspan x="1640" dy="18">al</tspan></text><path d="M1550,606 C2060,606 2060,931 2570,931" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="420" width="210" height="26" fill="white"/><text x="2060" y="438" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">audit record</tspan></text><path d="M1970,726 C2060,726 2060,736 2150,736" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="570" width="210" height="26" fill="white"/><text x="2060" y="588" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">review items</tspan></text><path d="M2390,736 C2480,736 2480,611 2570,611" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="495" width="210" height="26" fill="white"/><text x="2480" y="513" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">evidence &amp; proposal</tspan></text><path d="M2390,736 C2480,736 2480,931 2570,931" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="570" width="210" height="26" fill="white"/><text x="2480" y="588" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">analyst decision</tspan></text><g><rect x="50" y="480" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="506" font-size="14"><tspan x="66" dy="0">Synthetic alerts &amp; approved logs</tspan><tspan x="66" dy="20">Existing synthetic alert generator </tspan><tspan x="66" dy="20">and approved log exports. Outsid</tspan><tspan x="66" dy="20">e provisioning scope. Content is t</tspan><tspan x="66" dy="20">reated as untrusted.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="200" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="226" font-size="14"><tspan x="486" dy="0">Asset context (CMDB export)</tspan><tspan x="486" dy="20">Existing asset inventory: owner, c</tspan><tspan x="486" dy="20">riticality, exposure. Read-only ref</tspan><tspan x="486" dy="20">erence.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="470" y="480" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="506" font-size="14"><tspan x="486" dy="0">Alert ingestion</tspan><tspan x="486" dy="20">Azure Event Hubs</tspan><tspan x="486" dy="20">Receives alert and log events wit</tspan><tspan x="486" dy="20">h schema validation at the consu</tspan><tspan x="486" dy="20">mer. Capture is retained for repla</tspan><tspan x="486" dy="20">y.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="340" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="366" font-size="14"><tspan x="906" dy="0">Redaction</tspan><tspan x="906" dy="20">Azure Functions + Azure AI Lang</tspan><tspan x="906" dy="20">uage (PII detection)</tspan><tspan x="906" dy="20">Masks personal data and secrets</tspan><tspan x="906" dy="20"> in alerts and asset fields before </tspan><tspan x="906" dy="20">anything is stored or sent to a mo</tspan><tspan x="906" dy="20">del. Uses a managed identity. Fai</tspan><tspan x="906" dy="20">lures go to quarantine and are no</tspan><tspan x="906" dy="20">t passed on.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Redacted evidence store</tspan><tspan x="1326" dy="20">Azure Blob Storage (private, vers</tspan><tspan x="1326" dy="20">ioned)</tspan><tspan x="1326" dy="20">Redacted alert and evidence obj</tspan><tspan x="1326" dy="20">ects. Private endpoint, no public </tspan><tspan x="1326" dy="20">access.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="60" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="86" font-size="14"><tspan x="1746" dy="0">Evidence retrieval</tspan><tspan x="1746" dy="20">Azure AI Search</tspan><tspan x="1746" dy="20">Indexes redacted evidence and a</tspan><tspan x="1746" dy="20">sset context. Returns cited evide</tspan><tspan x="1746" dy="20">nce for each alert. Retrieval mod</tspan><tspan x="1746" dy="20">e (keyword, vector or hybrid) is st</tspan><tspan x="1746" dy="20">ill to be decided.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="480" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="506" font-size="14"><tspan x="1326" dy="0">AI triage orchestrator</tspan><tspan x="1326" dy="20">Azure Functions (Durable)</tspan><tspan x="1326" dy="20">For each alert: retrieves evidence</tspan><tspan x="1326" dy="20">, asks the model for severity, rati</tspan><tspan x="1326" dy="20">onale with citations and a propos</tspan><tspan x="1326" dy="20">ed response. Can abstain when </tspan><tspan x="1326" dy="20">evidence is insufficient. Has no p</tspan><tspan x="1326" dy="20">ermission or tool to isolate hosts, </tspan><tspan x="1326" dy="20">disable users or execute payload</tspan><tspan x="1326" dy="20">s; its output is a proposal only.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="350" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="376" font-size="14"><tspan x="1746" dy="0">Triage model</tspan><tspan x="1746" dy="20">Azure OpenAI Service</tspan><tspan x="1746" dy="20">Model deployment to be selected</tspan><tspan x="1746" dy="20">. Access, quota and regional avai</tspan><tspan x="1746" dy="20">lability are unverified. Mocked wit</tspan><tspan x="1746" dy="20">h scripted responses in local test</tspan><tspan x="1746" dy="20">s.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="630" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="656" font-size="14"><tspan x="1746" dy="0">Analyst queue</tspan><tspan x="1746" dy="20">Azure Service Bus (queue + dea</tspan><tspan x="1746" dy="20">d-letter)</tspan><tspan x="1746" dy="20">Holds triaged alerts and respons</tspan><tspan x="1746" dy="20">e proposals for analyst review. U</tspan><tspan x="1746" dy="20">ses idempotent message IDs per</tspan><tspan x="1746" dy="20"> alert.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="630" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="656" font-size="14"><tspan x="2166" dy="0">Analyst console</tspan><tspan x="2166" dy="20">Azure App Service + Microsoft E</tspan><tspan x="2166" dy="20">ntra ID sign-in</tspan><tspan x="2166" dy="20">Analysts review evidence and pr</tspan><tspan x="2166" dy="20">oposals, then accept, edit or reje</tspan><tspan x="2166" dy="20">ct them. Any real containment is </tspan><tspan x="2166" dy="20">done manually outside this syste</tspan><tspan x="2166" dy="20">m.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="555" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="581" font-size="14"><tspan x="2586" dy="0">SOC analyst</tspan><tspan x="2586" dy="20">Person who decides on every res</tspan><tspan x="2586" dy="20">ponse proposal.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="835" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="861" font-size="14"><tspan x="2586" dy="0">Audit trail</tspan><tspan x="2586" dy="20">Azure Monitor Log Analytics + im</tspan><tspan x="2586" dy="20">mutable Blob archive</tspan><tspan x="2586" dy="20">Records inputs (by reference), re</tspan><tspan x="2586" dy="20">trieved evidence IDs, model versi</tspan><tspan x="2586" dy="20">on, proposal and analyst decision</tspan><tspan x="2586" dy="20"> for every alert.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g></g></svg>