<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1782" viewBox="-50 -90 1650 1782"><rect x="-50" y="-90" width="1650" height="1782" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure authenticated conversational assistant · r2</tspan></text><path d="M290,816 C380,816 380,896 470,896" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="690" width="210" height="26" fill="white"/><text x="380" y="708" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS chat and reply</tspan></text><path d="M710,896 C800,896 800,146 890,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-28" width="210" height="44" fill="white"/><text x="800" y="-10" text-anchor="middle" font-size="12"><tspan x="800" dy="0">OIDC sign-in, token valid</tspan><tspan x="800" dy="18">ation</tspan></text><path d="M710,896 C800,896 800,426 890,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="252" width="210" height="44" fill="white"/><text x="800" y="270" text-anchor="middle" font-size="12"><tspan x="800" dy="0">read/write own user&apos;s tur</tspan><tspan x="800" dy="18">ns</tspan></text><path d="M710,896 C800,896 800,716 890,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="532" width="210" height="44" fill="white"/><text x="800" y="550" text-anchor="middle" font-size="12"><tspan x="800" dy="0">bounded prompt via chat</tspan><tspan x="800" dy="18"> completions</tspan></text><path d="M710,896 C800,896 800,966 890,966" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="690" width="210" height="26" fill="white"/><text x="800" y="708" text-anchor="middle" font-size="12"><tspan x="800" dy="0">screen input and output</tspan></text><path d="M710,896 C800,896 800,1266 890,1266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="690" width="210" height="26" fill="white"/><text x="800" y="708" text-anchor="middle" font-size="12"><tspan x="800" dy="0">send escalation ticket</tspan></text><path d="M1130,1266 C1220,1266 1220,1236 1310,1236" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="1092" width="210" height="44" fill="white"/><text x="1220" y="1110" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">review escalated conver</tspan><tspan x="1220" dy="18">sation</tspan></text><path d="M710,896 C800,896 800,1546 890,1546" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="672" width="210" height="44" fill="white"/><text x="800" y="690" text-anchor="middle" font-size="12"><tspan x="800" dy="0">telemetry and audit even</tspan><tspan x="800" dy="18">ts</tspan></text><g><rect x="50" y="750" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="776" font-size="14"><tspan x="66" dy="0">Synthetic user (browser)</tspan><tspan x="66" dy="20">Synthetic test user chatting throu</tspan><tspan x="66" dy="20">gh a browser. This is a client refe</tspan><tspan x="66" dy="20">rence and isn&apos;t provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Sign-in</tspan><tspan x="906" dy="20">Microsoft Entra External ID</tspan><tspan x="906" dy="20">Signs users in and issues tokens.</tspan><tspan x="906" dy="20"> The app validates the token and </tspan><tspan x="906" dy="20">uses the user&apos;s object ID as the c</tspan><tspan x="906" dy="20">onversation partition key. Tenant </tspan><tspan x="906" dy="20">and user flow aren&apos;t chosen yet.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="750" width="240" height="292" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="776" font-size="14"><tspan x="486" dy="0">Chat application</tspan><tspan x="486" dy="20">Azure App Service</tspan><tspan x="486" dy="20">Web UI and chat orchestration. It</tspan><tspan x="486" dy="20"> validates tokens, loads the user&apos;</tspan><tspan x="486" dy="20">s recent turns, enforces a context</tspan><tspan x="486" dy="20"> budget (recent turns plus a sum</tspan><tspan x="486" dy="20">mary), calls the model, runs safet</tspan><tspan x="486" dy="20">y checks and decides when to es</tspan><tspan x="486" dy="20">calate. It returns the reply to the </tspan><tspan x="486" dy="20">user. It takes no external actions.</tspan><tspan x="486" dy="20"> It uses managed identity to reac</tspan><tspan x="486" dy="20">h downstream services.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Conversation state</tspan><tspan x="906" dy="20">Azure Cosmos DB for NoSQL</tspan><tspan x="906" dy="20">Per-user conversation history, pa</tspan><tspan x="906" dy="20">rtitioned by user ID. The app only</tspan><tspan x="906" dy="20"> reads and writes the caller&apos;s own</tspan><tspan x="906" dy="20"> partition. Retention isn&apos;t decided </tspan><tspan x="906" dy="20">yet.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="610" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="636" font-size="14"><tspan x="906" dy="0">Model runtime</tspan><tspan x="906" dy="20">Azure OpenAI (Azure AI Foundry</tspan><tspan x="906" dy="20">)</tspan><tspan x="906" dy="20">Chat model deployment. The mo</tspan><tspan x="906" dy="20">del, region, quota and access are</tspan><tspan x="906" dy="20"> still to be verified. Local tests us</tspan><tspan x="906" dy="20">e scripted mock responses instea</tspan><tspan x="906" dy="20">d.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="890" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="916" font-size="14"><tspan x="906" dy="0">Safety check</tspan><tspan x="906" dy="20">Azure AI Content Safety</tspan><tspan x="906" dy="20">Screens user input and model ou</tspan><tspan x="906" dy="20">tput. Flagged items trigger refusa</tspan><tspan x="906" dy="20">l or escalation.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1170" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1196" font-size="14"><tspan x="906" dy="0">Escalation queue</tspan><tspan x="906" dy="20">Azure Service Bus</tspan><tspan x="906" dy="20">Holds escalation tickets (convers</tspan><tspan x="906" dy="20">ation reference and reason) for h</tspan><tspan x="906" dy="20">uman review, with a dead-letter q</tspan><tspan x="906" dy="20">ueue. The escalation trigger and </tspan><tspan x="906" dy="20">owner are still open.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1170" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1196" font-size="14"><tspan x="1326" dy="0">Human reviewer</tspan><tspan x="1326" dy="20">The person who handles escalat</tspan><tspan x="1326" dy="20">ed conversations. This is outside </tspan><tspan x="1326" dy="20">the provisioning scope.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="1450" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="1476" font-size="14"><tspan x="906" dy="0">Monitoring and audit</tspan><tspan x="906" dy="20">Azure Monitor / Application Insig</tspan><tspan x="906" dy="20">hts</tspan><tspan x="906" dy="20">Traces, errors, latency, token usa</tspan><tspan x="906" dy="20">ge and escalation events. Prompt</tspan><tspan x="906" dy="20"> content is excluded from logs by </tspan><tspan x="906" dy="20">default.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g></g></svg>