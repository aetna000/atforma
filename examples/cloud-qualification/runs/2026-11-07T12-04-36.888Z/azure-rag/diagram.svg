<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="932" viewBox="-50 -90 2070 932"><rect x="-50" y="-90" width="2070" height="932" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure synthetic RAG qualification · r2</tspan></text><path d="M290,406 C380,406 380,426 470,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="280" width="210" height="26" fill="white"/><text x="380" y="298" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,426 C800,426 800,566 890,566" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="280" width="210" height="26" fill="white"/><text x="800" y="298" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (OIDC + PKCE)</tspan></text><path d="M710,426 C1010,426 1010,456 1310,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="262" width="210" height="44" fill="white"/><text x="1010" y="280" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">question + bearer token /</tspan><tspan x="1010" dy="18"> cited answer</tspan></text><path d="M1130,566 C1220,566 1220,456 1310,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT validation</tspan></text><path d="M1550,456 C1640,456 1640,136 1730,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-28" width="210" height="44" fill="white"/><text x="1640" y="-10" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">ACL-filtered keyword qu</tspan><tspan x="1640" dy="18">ery</tspan></text><path d="M1550,456 C1640,456 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="280" width="210" height="26" fill="white"/><text x="1640" y="298" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">grounded prompt</tspan></text><path d="M1130,126 C1220,126 1220,136 1310,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-10" width="210" height="26" fill="white"/><text x="1220" y="8" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">blob created/updated</tspan></text><path d="M1550,136 C1640,136 1640,136 1730,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-10" width="210" height="26" fill="white"/><text x="1640" y="8" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">write chunks + ACLs</tspan></text><path d="M1550,456 C1640,456 1640,706 1730,706" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="280" width="210" height="26" fill="white"/><text x="1640" y="298" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">telemetry + audit</tspan></text><g><rect x="50" y="340" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="366" font-size="14"><tspan x="66" dy="0">Staff user (browser)</tspan><tspan x="66" dy="20">Person using the assistant in a br</tspan><tspan x="66" dy="20">owser. Client reference only, not </tspan><tspan x="66" dy="20">provisioned.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="340" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="366" font-size="14"><tspan x="486" dy="0">Web app</tspan><tspan x="486" dy="20">Azure Static Web Apps</tspan><tspan x="486" dy="20">Authenticated chat UI. Signs user</tspan><tspan x="486" dy="20">s in with Entra ID (auth code + P</tspan><tspan x="486" dy="20">KCE) and shows answers with th</tspan><tspan x="486" dy="20">eir source citations.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="480" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="506" font-size="14"><tspan x="906" dy="0">Identity</tspan><tspan x="906" dy="20">Microsoft Entra ID</tspan><tspan x="906" dy="20">App registration issuing tokens wi</tspan><tspan x="906" dy="20">th user and group claims. Wheth</tspan><tspan x="906" dy="20">er we use an existing tenant or a </tspan><tspan x="906" dy="20">new test tenant is still open.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">RAG API</tspan><tspan x="1326" dy="20">Azure Functions</tspan><tspan x="1326" dy="20">Validates the JWT, maps the user</tspan><tspan x="1326" dy="20"> to groups, filters chunks by ACL,</tspan><tspan x="1326" dy="20"> runs bounded keyword retrieval, </tspan><tspan x="1326" dy="20">calls the model and returns a cite</tspan><tspan x="1326" dy="20">d answer, or declines if nothing p</tspan><tspan x="1326" dy="20">ermitted matches. Fails closed fo</tspan><tspan x="1326" dy="20">r unknown identities.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Document catalog + ACLs</tspan><tspan x="1746" dy="20">Azure Cosmos DB for NoSQL</tspan><tspan x="1746" dy="20">Stores chunks, keywords, docum</tspan><tspan x="1746" dy="20">ent revisions and explicit source </tspan><tspan x="1746" dy="20">ACLs. Read by the API; written o</tspan><tspan x="1746" dy="20">nly by ingestion.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Synthetic documents</tspan><tspan x="906" dy="20">Azure Blob Storage</tspan><tspan x="906" dy="20">Private container holding the synt</tspan><tspan x="906" dy="20">hetic UTF-8 documents and their </tspan><tspan x="906" dy="20">permission metadata.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Ingestion</tspan><tspan x="1326" dy="20">Azure Functions (blob trigger)</tspan><tspan x="1326" dy="20">Chunks new or updated docume</tspan><tspan x="1326" dy="20">nts, extracts keywords and writes</tspan><tspan x="1326" dy="20"> chunks with their ACLs to the cat</tspan><tspan x="1326" dy="20">alog, using managed identity.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">LLM</tspan><tspan x="1746" dy="20">Azure OpenAI Service</tspan><tspan x="1746" dy="20">Chat model deployment that gen</tspan><tspan x="1746" dy="20">erates grounded answers. The m</tspan><tspan x="1746" dy="20">odel, regional availability and quo</tspan><tspan x="1746" dy="20">ta are not yet verified. Local tests</tspan><tspan x="1746" dy="20"> use scripted responses instead.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="620" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="646" font-size="14"><tspan x="1746" dy="0">Monitoring &amp; audit</tspan><tspan x="1746" dy="20">Azure Monitor / Application Insig</tspan><tspan x="1746" dy="20">hts</tspan><tspan x="1746" dy="20">Logs requests, access denials an</tspan><tspan x="1746" dy="20">d latency without storing docume</tspan><tspan x="1746" dy="20">nt text.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>