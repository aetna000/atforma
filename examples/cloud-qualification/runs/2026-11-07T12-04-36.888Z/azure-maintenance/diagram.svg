<svg xmlns="http://www.w3.org/2000/svg" width="3750" height="642" viewBox="-50 -90 3750 642"><rect x="-50" y="-90" width="3750" height="642" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure predictive maintenance (synthetic) · r2</tspan></text><path d="M290,106 C380,106 380,116 470,116" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">sensor events</tspan></text><path d="M710,116 C800,116 800,266 890,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Event Hubs Capture</tspan></text><path d="M710,396 C800,396 800,266 890,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">batch load</tspan></text><path d="M1130,266 C1220,266 1220,266 1310,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">raw data</tspan></text><path d="M1550,266 C1640,266 1640,361 1730,361" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="130" width="210" height="26" fill="white"/><text x="1640" y="148" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">time-split dataset</tspan></text><path d="M1970,361 C2060,361 2060,361 2150,361" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="187" width="210" height="44" fill="white"/><text x="2060" y="205" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">versioned model + metri</tspan><tspan x="2060" dy="18">cs</tspan></text><path d="M1550,266 C2060,266 2060,276 2570,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="130" width="210" height="26" fill="white"/><text x="2060" y="148" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">recent features</tspan></text><path d="M2390,361 C2480,361 2480,276 2570,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2375" y="130" width="210" height="26" fill="white"/><text x="2480" y="148" text-anchor="middle" font-size="12"><tspan x="2480" dy="0">promoted version</tspan></text><path d="M2810,276 C2900,276 2900,136 2990,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="-10" width="210" height="26" fill="white"/><text x="2900" y="8" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">predictions + inputs</tspan></text><path d="M2810,276 C2900,276 2900,416 2990,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="2795" y="130" width="210" height="26" fill="white"/><text x="2900" y="148" text-anchor="middle" font-size="12"><tspan x="2900" dy="0">risk scores</tspan></text><path d="M3230,416 C3320,416 3320,386 3410,386" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="3215" y="270" width="210" height="26" fill="white"/><text x="3320" y="288" text-anchor="middle" font-size="12"><tspan x="3320" dy="0">draft for approval</tspan></text><g><rect x="50" y="50" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Synthetic sensor histories</tspan><tspan x="66" dy="20">Existing synthetic sensor telemet</tspan><tspan x="66" dy="20">ry source.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="330" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="356" font-size="14"><tspan x="486" dy="0">Maintenance records</tspan><tspan x="486" dy="20">Existing synthetic maintenance a</tspan><tspan x="486" dy="20">nd failure history. These records </tspan><tspan x="486" dy="20">are the label source.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Event Hubs ingestion</tspan><tspan x="486" dy="20">Azure Event Hubs</tspan><tspan x="486" dy="20">Receives sensor events and capt</tspan><tspan x="486" dy="20">ures them to the data lake.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">Data lake</tspan><tspan x="906" dy="20">Azure Data Lake Storage Gen2</tspan><tspan x="906" dy="20">Private storage for raw telemetry,</tspan><tspan x="906" dy="20"> maintenance records and featur</tspan><tspan x="906" dy="20">es. Records are loaded in batch.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="216" font-size="14"><tspan x="1326" dy="0">Feature preparation</tspan><tspan x="1326" dy="20">Azure Machine Learning pipeline</tspan><tspan x="1326" dy="20">Builds windowed sensor features</tspan><tspan x="1326" dy="20"> and joins them with time-aligned </tspan><tspan x="1326" dy="20">failure labels.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="265" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="291" font-size="14"><tspan x="1746" dy="0">Training + held-out eval</tspan><tspan x="1746" dy="20">Azure Machine Learning training </tspan><tspan x="1746" dy="20">job</tspan><tspan x="1746" dy="20">Trains on earlier periods and eval</tspan><tspan x="1746" dy="20">uates on a later held-out period. </tspan><tspan x="1746" dy="20">Reports precision, recall and fals</tspan><tspan x="1746" dy="20">e alarms.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="2150" y="265" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="291" font-size="14"><tspan x="2166" dy="0">Model registry</tspan><tspan x="2166" dy="20">Azure Machine Learning model r</tspan><tspan x="2166" dy="20">egistry</tspan><tspan x="2166" dy="20">Holds versioned models together</tspan><tspan x="2166" dy="20"> with their evaluation evidence. O</tspan><tspan x="2166" dy="20">nly approved versions are promot</tspan><tspan x="2166" dy="20">ed.</tspan><tspan x="2166" dy="20">To be selected</tspan></text></g><g><rect x="2570" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2586" y="216" font-size="14"><tspan x="2586" dy="0">Batch scoring</tspan><tspan x="2586" dy="20">Azure Machine Learning batch e</tspan><tspan x="2586" dy="20">ndpoint</tspan><tspan x="2586" dy="20">Scores recent features with the p</tspan><tspan x="2586" dy="20">romoted model version and outp</tspan><tspan x="2586" dy="20">uts a risk for each asset.</tspan><tspan x="2586" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="76" font-size="14"><tspan x="3006" dy="0">Drift monitoring</tspan><tspan x="3006" dy="20">Azure Machine Learning model </tspan><tspan x="3006" dy="20">monitoring + Azure Monitor</tspan><tspan x="3006" dy="20">Compares input and prediction dr</tspan><tspan x="3006" dy="20">ift with the training baseline and a</tspan><tspan x="3006" dy="20">lerts the model owner.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="2990" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3006" y="356" font-size="14"><tspan x="3006" dy="0">Work-order draft</tspan><tspan x="3006" dy="20">Azure Functions</tspan><tspan x="3006" dy="20">Turns high-risk scores into draft </tspan><tspan x="3006" dy="20">work orders. These are drafts onl</tspan><tspan x="3006" dy="20">y; it has no equipment-control pat</tspan><tspan x="3006" dy="20">h.</tspan><tspan x="3006" dy="20">To be selected</tspan></text></g><g><rect x="3410" y="330" width="240" height="112" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="3426" y="356" font-size="14"><tspan x="3426" dy="0">Maintenance operator</tspan><tspan x="3426" dy="20">Reviews, approves or rejects the </tspan><tspan x="3426" dy="20">drafts.</tspan><tspan x="3426" dy="20">To be selected</tspan></text></g></g></svg>