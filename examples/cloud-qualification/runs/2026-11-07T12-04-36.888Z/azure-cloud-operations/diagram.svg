<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1407" viewBox="-50 -90 2070 1407"><rect x="-50" y="-90" width="2070" height="1407" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure read-only drift and correction planner · r2</tspan></text><path d="M290,556 C380,556 380,736 470,736" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="420" width="210" height="26" fill="white"/><text x="380" y="438" text-anchor="middle" font-size="12"><tspan x="380" dy="0">synthetic snapshot</tspan></text><path d="M290,856 C380,856 380,736 470,736" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="542" width="210" height="44" fill="white"/><text x="380" y="560" text-anchor="middle" font-size="12"><tspan x="380" dy="0">read-only query (Reader</tspan><tspan x="380" dy="18">)</tspan></text><path d="M710,126 C800,126 800,436 890,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">baseline state</tspan></text><path d="M710,736 C800,736 800,156 890,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="10" width="210" height="26" fill="white"/><text x="800" y="28" text-anchor="middle" font-size="12"><tspan x="800" dy="0">evaluate inventory</tspan></text><path d="M710,736 C800,736 800,436 890,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="290" width="210" height="26" fill="white"/><text x="800" y="308" text-anchor="middle" font-size="12"><tspan x="800" dy="0">compare to baseline</tspan></text><path d="M710,736 C800,736 800,716 890,716" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="560" width="210" height="26" fill="white"/><text x="800" y="578" text-anchor="middle" font-size="12"><tspan x="800" dy="0">findings → draft plan</tspan></text><path d="M710,736 C800,736 800,1006 890,1006" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="560" width="210" height="26" fill="white"/><text x="800" y="578" text-anchor="middle" font-size="12"><tspan x="800" dy="0">write plan + diff</tspan></text><path d="M1130,1006 C1220,1006 1220,1016 1310,1016" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="850" width="210" height="26" fill="white"/><text x="1220" y="868" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">diff for review</tspan></text><path d="M1550,1016 C1640,1016 1640,881 1730,881" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="775" width="210" height="26" fill="white"/><text x="1640" y="793" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">approve / reject</tspan></text><path d="M710,736 C1220,736 1220,1191 1730,1191" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="560" width="210" height="26" fill="white"/><text x="1220" y="578" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">run events</tspan></text><path d="M1550,1016 C1640,1016 1640,1191 1730,1191" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="850" width="210" height="26" fill="white"/><text x="1640" y="868" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">decision record</tspan></text><g><rect x="50" y="480" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="506" font-size="14"><tspan x="66" dy="0">Synthetic cloud inventory</tspan><tspan x="66" dy="20">Synthetic Azure resource snapsh</tspan><tspan x="66" dy="20">ot (JSON) used for qualification. I</tspan><tspan x="66" dy="20">t stands in for the live Resource </tspan><tspan x="66" dy="20">Graph source in local tests.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="50" y="760" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="786" font-size="14"><tspan x="66" dy="0">Azure Resource Graph (read-onl</tspan><tspan x="66" dy="20">y)</tspan><tspan x="66" dy="20">Azure Resource Graph</tspan><tspan x="66" dy="20">Read-only inventory queries mad</tspan><tspan x="66" dy="20">e by a managed identity with only</tspan><tspan x="66" dy="20"> the Reader role. The design incl</tspan><tspan x="66" dy="20">udes no write role.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Desired state (IaC repo)</tspan><tspan x="486" dy="20">Baseline Terraform/Bicep definiti</tspan><tspan x="486" dy="20">ons that serve as the reference f</tspan><tspan x="486" dy="20">or drift. The source is not yet deci</tspan><tspan x="486" dy="20">ded.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="470" y="620" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="646" font-size="14"><tspan x="486" dy="0">Analysis orchestrator</tspan><tspan x="486" dy="20">Azure Functions (Durable Functi</tspan><tspan x="486" dy="20">ons)</tspan><tspan x="486" dy="20">Normalises the inventory, runs po</tspan><tspan x="486" dy="20">licy and drift checks, calls the mo</tspan><tspan x="486" dy="20">del for a correction plan and write</tspan><tspan x="486" dy="20">s the plan and diff. It has no write</tspan><tspan x="486" dy="20"> or delete permission on target re</tspan><tspan x="486" dy="20">sources.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="70" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="96" font-size="14"><tspan x="906" dy="0">Policy checks</tspan><tspan x="906" dy="20">Azure Policy (compliance state, r</tspan><tspan x="906" dy="20">ead-only)</tspan><tspan x="906" dy="20">Reads policy compliance results </tspan><tspan x="906" dy="20">and evaluates local rule checks a</tspan><tspan x="906" dy="20">gainst the inventory.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="350" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="376" font-size="14"><tspan x="906" dy="0">Drift detection</tspan><tspan x="906" dy="20">Azure Functions (timer trigger)</tspan><tspan x="906" dy="20">Compares the inventory with the </tspan><tspan x="906" dy="20">desired state on a schedule and f</tspan><tspan x="906" dy="20">lags differences. This is part of th</tspan><tspan x="906" dy="20">e orchestrator&apos;s Function app.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="630" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="656" font-size="14"><tspan x="906" dy="0">Plan generation model</tspan><tspan x="906" dy="20">Azure OpenAI Service</tspan><tspan x="906" dy="20">Drafts a correction plan from findi</tspan><tspan x="906" dy="20">ngs. Local tests use a scripted m</tspan><tspan x="906" dy="20">ock; model quality, deployment a</tspan><tspan x="906" dy="20">nd quota are not validated.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="890" y="910" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="936" font-size="14"><tspan x="906" dy="0">Plan &amp; diff store</tspan><tspan x="906" dy="20">Azure Blob Storage (versioned, i</tspan><tspan x="906" dy="20">mmutable)</tspan><tspan x="906" dy="20">Stores versioned findings, the pr</tspan><tspan x="906" dy="20">oposed plan and a reviewable dif</tspan><tspan x="906" dy="20">f. Artifacts are never executed by</tspan><tspan x="906" dy="20"> the system.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="910" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="936" font-size="14"><tspan x="1326" dy="0">Human review &amp; approval</tspan><tspan x="1326" dy="20">Azure DevOps Environments app</tspan><tspan x="1326" dy="20">roval check</tspan><tspan x="1326" dy="20">A named reviewer approves or re</tspan><tspan x="1326" dy="20">jects the diff. Approval only recor</tspan><tspan x="1326" dy="20">ds a decision; applying it is a sep</tspan><tspan x="1326" dy="20">arate, manual process outside thi</tspan><tspan x="1326" dy="20">s system.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="835" width="240" height="92" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="861" font-size="14"><tspan x="1746" dy="0">Platform reviewer</tspan><tspan x="1746" dy="20">The person who reviews diffs.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="1115" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="1141" font-size="14"><tspan x="1746" dy="0">Audit log</tspan><tspan x="1746" dy="20">Azure Monitor Log Analytics</tspan><tspan x="1746" dy="20">Records every run, finding, mode</tspan><tspan x="1746" dy="20">l call, plan version and approval d</tspan><tspan x="1746" dy="20">ecision.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g></g></svg>