<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1592" viewBox="-50 -90 2070 1592"><rect x="-50" y="-90" width="2070" height="1592" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Azure support-staff knowledge assistant · r2</tspan></text><path d="M290,406 C380,406 380,436 470,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="280" width="210" height="26" fill="white"/><text x="380" y="298" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS use</tspan></text><path d="M710,436 C800,436 800,136 890,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-10" width="210" height="26" fill="white"/><text x="800" y="8" text-anchor="middle" font-size="12"><tspan x="800" dy="0">OIDC sign-in</tspan></text><path d="M710,436 C800,436 800,746 890,746" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="262" width="210" height="44" fill="white"/><text x="800" y="280" text-anchor="middle" font-size="12"><tspan x="800" dy="0">draft request (user token</tspan><tspan x="800" dy="18">)</tspan></text><path d="M710,1386 C800,1386 800,746 890,746" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="560" width="210" height="26" fill="white"/><text x="800" y="578" text-anchor="middle" font-size="12"><tspan x="800" dy="0">read ticket</tspan></text><path d="M1130,746 C1220,746 1220,146 1310,146" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-18" width="210" height="44" fill="white"/><text x="1220" y="0" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read-only customer look</tspan><tspan x="1220" dy="18">up</tspan></text><path d="M1130,406 C1220,406 1220,436 1310,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="252" width="210" height="44" fill="white"/><text x="1220" y="270" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">indexer with ACL metad</tspan><tspan x="1220" dy="18">ata</tspan></text><path d="M1130,746 C1220,746 1220,436 1310,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">group-filtered query</tspan></text><path d="M1130,746 C1220,746 1220,726 1310,726" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="560" width="210" height="26" fill="white"/><text x="1220" y="578" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">grounded prompt</tspan></text><path d="M1130,746 C1220,746 1220,996 1310,996" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="560" width="210" height="26" fill="white"/><text x="1220" y="578" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">check draft</tspan></text><path d="M1550,996 C1640,996 1640,1276 1730,1276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="822" width="210" height="44" fill="white"/><text x="1640" y="840" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">escalate uncertain/refun</tspan><tspan x="1640" dy="18">d</tspan></text><path d="M710,436 C1220,436 1220,1276 1730,1276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="280" width="210" height="26" fill="white"/><text x="1220" y="298" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">staff escalates</tspan></text><path d="M1130,746 C1220,746 1220,1266 1310,1266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="560" width="210" height="26" fill="white"/><text x="1220" y="578" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">audit + traces</tspan></text><g><rect x="50" y="340" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="366" font-size="14"><tspan x="66" dy="0">Support staff (browser)</tspan><tspan x="66" dy="20">Support agents using a browser. </tspan><tspan x="66" dy="20">This is a caller, not a provisioned </tspan><tspan x="66" dy="20">resource.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="890" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Staff sign-in</tspan><tspan x="906" dy="20">Microsoft Entra ID</tspan><tspan x="906" dy="20">Handles staff authentication and </tspan><tspan x="906" dy="20">supplies the group claims used to</tspan><tspan x="906" dy="20"> filter retrieval. Whether a tenant </tspan><tspan x="906" dy="20">already exists is unconfirmed.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="366" font-size="14"><tspan x="486" dy="0">Staff assistant app</tspan><tspan x="486" dy="20">Azure App Service</tspan><tspan x="486" dy="20">The staff interface. It shows the ti</tspan><tspan x="486" dy="20">cket, customer context, a draft an</tspan><tspan x="486" dy="20">swer with citations and an Escala</tspan><tspan x="486" dy="20">te button. Staff must approve bef</tspan><tspan x="486" dy="20">ore anything is sent.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="890" y="620" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="646" font-size="14"><tspan x="906" dy="0">Assistant orchestration API</tspan><tspan x="906" dy="20">Azure Functions</tspan><tspan x="906" dy="20">Uses a managed identity. Pulls th</tspan><tspan x="906" dy="20">e ticket, reads the CRM record (r</tspan><tspan x="906" dy="20">ead-only), runs permission-filtere</tspan><tspan x="906" dy="20">d retrieval, calls the model and a</tspan><tspan x="906" dy="20">pplies the grounding check. It ha</tspan><tspan x="906" dy="20">s no refund or CRM-write tools. T</tspan><tspan x="906" dy="20">he draft response with citations is</tspan><tspan x="906" dy="20"> returned to the app.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="470" y="1320" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="1346" font-size="14"><tspan x="486" dy="0">Synthetic ticket queue</tspan><tspan x="486" dy="20">Existing synthetic support tickets.</tspan><tspan x="486" dy="20"> The integration method is to be c</tspan><tspan x="486" dy="20">onfirmed.</tspan><tspan x="486" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="60" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="86" font-size="14"><tspan x="1326" dy="0">Existing CRM (customer records)</tspan><tspan x="1326" dy="20">Customer records, read-only fro</tspan><tspan x="1326" dy="20">m the assistant. Writes and refun</tspan><tspan x="1326" dy="20">ds are excluded by design. The A</tspan><tspan x="1326" dy="20">PI and access scope are to be co</tspan><tspan x="1326" dy="20">nfirmed.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="890" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="356" font-size="14"><tspan x="906" dy="0">Approved knowledge store</tspan><tspan x="906" dy="20">Azure Blob Storage</tspan><tspan x="906" dy="20">Private container holding only ap</tspan><tspan x="906" dy="20">proved knowledge articles, each </tspan><tspan x="906" dy="20">with access-group metadata.</tspan><tspan x="906" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="340" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="366" font-size="14"><tspan x="1326" dy="0">Authorized retrieval index</tspan><tspan x="1326" dy="20">Azure AI Search</tspan><tspan x="1326" dy="20">Indexes the approved knowledge</tspan><tspan x="1326" dy="20">. Queries are filtered by the staff </tspan><tspan x="1326" dy="20">member&apos;s groups, so unknown gr</tspan><tspan x="1326" dy="20">oups return nothing. Keyword, ve</tspan><tspan x="1326" dy="20">ctor or hybrid mode is still open.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="620" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="646" font-size="14"><tspan x="1326" dy="0">Answer drafting model</tspan><tspan x="1326" dy="20">Azure OpenAI Service</tspan><tspan x="1326" dy="20">Drafts answers only from retrieve</tspan><tspan x="1326" dy="20">d passages and must cite source</tspan><tspan x="1326" dy="20">s or abstain. The model, deploym</tspan><tspan x="1326" dy="20">ent, quota and regional availabilit</tspan><tspan x="1326" dy="20">y are unverified. Local tests use s</tspan><tspan x="1326" dy="20">cripted responses.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="900" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="926" font-size="14"><tspan x="1326" dy="0">Grounding &amp; safety check</tspan><tspan x="1326" dy="20">Azure AI Content Safety</tspan><tspan x="1326" dy="20">Checks the draft for groundednes</tspan><tspan x="1326" dy="20">s, harmful content and prompt inj</tspan><tspan x="1326" dy="20">ection. Ungrounded drafts and an</tspan><tspan x="1326" dy="20">y refund or record-change reques</tspan><tspan x="1326" dy="20">t are sent to escalation.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="1190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="1216" font-size="14"><tspan x="1746" dy="0">Human escalation queue</tspan><tspan x="1746" dy="20">Azure Service Bus</tspan><tspan x="1746" dy="20">Escalated tickets with reason and</tspan><tspan x="1746" dy="20"> context, handled by a senior age</tspan><tspan x="1746" dy="20">nt. Refunds and CRM changes ar</tspan><tspan x="1746" dy="20">e always done by a person.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1310" y="1180" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="1206" font-size="14"><tspan x="1326" dy="0">Audit &amp; monitoring</tspan><tspan x="1326" dy="20">Azure Monitor / Application Insig</tspan><tspan x="1326" dy="20">hts</tspan><tspan x="1326" dy="20">Traces, the audit trail of retrievals</tspan><tspan x="1326" dy="20">, drafts and escalations, and alert</tspan><tspan x="1326" dy="20">s. Log retention is to be agreed.</tspan><tspan x="1326" dy="20">To be selected</tspan></text></g></g></svg>